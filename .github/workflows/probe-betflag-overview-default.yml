name: Probe Betflag overview default metadata

on:
  push:
    paths:
      - 'betflag-overview-default-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Query overview default tabs
        run: |
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.error
          from datetime import datetime,timezone
          base='https://sportservice.betflag.it/api/sport/pregame/getOverviewDefault'
          headers={
            'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*',
            'x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0',
            'Origin':'https://www.betflag.it','Referer':'https://www.betflag.it/'
          }
          results=[]
          for tab in range(0,10):
            url=f'{base}/{tab}?channelId=0'
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=25) as r:
                body=r.read(5000000).decode('utf-8','replace'); status=r.status; ctype=r.headers.get('content-type')
            except urllib.error.HTTPError as e:
              status=e.code; ctype=e.headers.get('content-type'); body=e.read(100000).decode('utf-8','replace')
            except Exception as e:
              results.append({'tab':tab,'error':type(e).__name__+': '+str(e)[:200]}); continue
            rec={'tab':tab,'status':status,'content_type':ctype,'bytes':len(body)}
            try:
              data=json.loads(body); rec['json_type']=type(data).__name__
              rec['keys']=list(data.keys())[:100] if isinstance(data,dict) else None
              # Recursively find dicts looking like events (ei/id/eventId + team/name fields).
              events=[]
              def walk(x,path=''):
                if len(events)>=300: return
                if isinstance(x,dict):
                  keys=set(x)
                  if ('ei' in keys or 'eventId' in keys or 'idEvent' in keys) and any(k in keys for k in ('en','eventName','teams','snm','ed')):
                    events.append({'path':path,'obj':x})
                  for k,v in x.items(): walk(v,path+'.'+str(k))
                elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,path+f'[{i}]')
              walk(data)
              rec['event_like_count']=len(events)
              rec['event_samples']=events[:80]
              low=body.lower(); rec['signals']={k:low.count(k) for k in ['calcio','malaga','deportivo','player','scorer','marcat','tai','"mi"','"ei"']}
              rec['body_prefix']=body[:100000]
            except Exception: rec['body_prefix']=body[:15000]
            results.append(rec)
            if rec.get('event_like_count',0)>0: break
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'results':results}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/betflag-overview-default-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps([{k:r.get(k) for k in ('tab','status','bytes','json_type','keys','event_like_count','signals','error')} for r in results],ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/betflag-overview-default-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Probe Betflag overview default metadata'
          git push
