name: BetFlag Worker fixture feed

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'betflag-worker-feed-trigger.json'
      - 'collector/betflag_worker_fixture_feed.py'

permissions:
  contents: write

concurrency:
  group: betflag-worker-fixture-feed
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize fresh BetFlag fixtures from v7 Worker
        run: python collector/betflag_worker_fixture_feed.py
      - name: Validate fixture feed
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('feed/betflag-fixtures-index.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('source_healthy') is True, d
          assert int(d.get('fixture_count') or 0)>0, d
          assert int(d.get('full_scan_ready_count') or 0)>0, d
          print(json.dumps({'fixture_count':d['fixture_count'],'full_scan_ready_count':d['full_scan_ready_count'],'generated_at':d['generated_at']},indent=2))
          PY
      - name: Commit fresh Worker-backed BetFlag fixtures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-betflag-worker-bot'
          git config user.email 'radar-betflag-worker-bot@users.noreply.github.com'
          git add feed/betflag-fixtures-index.json feed/betflag-fixtures
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Worker-backed BetFlag fixture feeds'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*2))
          done
          exit 1
