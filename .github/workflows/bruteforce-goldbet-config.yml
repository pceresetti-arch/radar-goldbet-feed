name: Brute-force GoldBet public config names

on:
  push:
    paths:
      - 'goldbet-config-bruteforce-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe likely public config files
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.error, re
          from datetime import datetime, timezone

          bases=[
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/Config/gb/produzione/',
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/Config/gb/',
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/Config/common/produzione/',
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/Config/common/'
          ]
          names=[
            'appsettings.json','appSettings.json','settings.json','config.json','configuration.json',
            'environment.json','environment.prod.json','api.json','apiSettings.json','apisettings.json',
            'serviceconfig.json','serviceConfig.json','services.json','sportconfig.json','sportsconfig.json',
            'sportServiceConfig.json','sportServiceConfiguration.json','endpoints.json','endpointconfig.json',
            'hosts.json','urls.json','brandconfig.json','brandConfig.json','siteconfig.json','siteConfig.json',
            'commonconfig.json','commonConfig.json','bettingconfig.json','bettingConfig.json','aamsconfig.json',
            'playerconfig.json','playersconfig.json','pregameconfig.json','prematchconfig.json'
          ]
          keys=('getdetailseventaams','aams','player','giocatori','marcatori','pregame','prematch','sportservice','/api/','endpoint','service','host','url')
          out=[]
          for base in bases:
            for name in names:
              url=base+name
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'})
              try:
                with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read(500000).decode('utf-8','replace'); status=r.status; ctype=r.headers.get('content-type')
              except urllib.error.HTTPError as e:
                status=e.code; ctype=e.headers.get('content-type'); body=e.read(3000).decode('utf-8','replace')
              except Exception as e:
                out.append({'url':url,'error':repr(e)}); continue
              low=body.lower()
              hits=[k for k in keys if k in low]
              if status==200 or hits:
                urls=re.findall(r'https?://[^\\s\"\\'<>]+',body)
                out.append({'url':url,'status':status,'content_type':ctype,'bytes':len(body),'hits':hits,'urls':urls[:100],'sample':body[:12000]})
          result={'generated_at':datetime.now(timezone.utc).isoformat(),'results':out}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/goldbet-config-bruteforce.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('interesting',len(out))
          PY
      - name: Commit result
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/goldbet-config-bruteforce.json
          git diff --cached --quiet && exit 0
          git commit -m 'Brute-force GoldBet public configs'
          git push
