name: Summarize shared sportservice brand fingerprint

on:
  push:
    paths:
      - 'shared-brand-summary-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Summarize groups
        run: |
          python - <<'PY'
          import json,pathlib
          src=json.loads(pathlib.Path('feed/quick-shared-brand-fingerprint.json').read_text(encoding='utf-8'))
          rows=[]
          for r in src.get('rows',[]):
            rows.append({
              'brand':r.get('brand'),
              'program_sha':r.get('program',{}).get('sha256'),
              'overview_sha':r.get('overview',{}).get('sha256'),
              'program_bytes':r.get('program',{}).get('bytes'),
              'overview_bytes':r.get('overview',{}).get('bytes'),
              'first_event':(r.get('overview',{}).get('events') or [None])[0]
            })
          groups={}
          for x in rows:
            k=f"{x['program_sha']}|{x['overview_sha']}"
            groups.setdefault(k,[]).append(x['brand'])
          out={'groups':groups,'rows':rows}
          pathlib.Path('feed/shared-brand-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/shared-brand-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'Summarize shared sportservice brand fingerprints'
          git push
