name: Catalog Giocatori Calcio tournaments

on:
  push:
    paths:
      - 'catalog-player-tournaments-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Discover all player-prop tournaments dynamically
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request
          from datetime import datetime, timezone
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0','Origin':'https://www.betflag.it','Referer':'https://www.betflag.it/'}
          u='https://sportservice.betflag.it/api/sport/pregame/getProgram?channelId=0'
          with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30) as r:
            program=json.loads(r.read(5000000).decode('utf-8','replace'))
          sports=[]
          for s in program if isinstance(program,list) else []:
            if isinstance(s,dict) and 'giocator' in str(s.get('n','')).lower(): sports.append(s)
          cats=[]; tournaments=[]
          for s in sports:
            for c in s.get('lc') or []:
              if not isinstance(c,dict): continue
              cr={k:c.get(k) for k in ('id','n','nEfT','ne','o','img')}; cr['sport_id']=s.get('id'); cr['sport_name']=s.get('n'); cats.append(cr)
              for t in c.get('lts') or []:
                if not isinstance(t,dict): continue
                tournaments.append({
                  'sport_id':s.get('id'),'sport_name':s.get('n'),'category_id':c.get('id'),'category_name':c.get('n'),
                  'tournament_id':t.get('id'),'tournament_name':t.get('n'),'event_counts':t.get('nEfT'),'number_events':t.get('ne'),
                  'order':t.get('o'),'osi':t.get('osi'),'active':not bool(t.get('c'))
                })
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'sport_count':len(sports),'sports':[{k:s.get(k) for k in ('id','n','nEfT','ne','chId','vrt','img')} for s in sports],'categories':cats,'tournament_count':len(tournaments),'tournaments':tournaments}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/player-tournament-catalog.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/player-tournament-catalog.json
          git diff --cached --quiet && exit 0
          git commit -m 'Catalog dynamic Giocatori Calcio tournaments'
          git push
