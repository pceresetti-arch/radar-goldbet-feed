name: Historical Backtest Denmark Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/historical-backtest-denmark-bootstrap.yml'
      - 'tools/historical_ingest_denmark.py'

permissions:
  contents: write

concurrency:
  group: historical-backtest-denmark-bootstrap
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and profile Denmark historical source
        run: python tools/historical_ingest_denmark.py
      - name: Preserve generated evidence
        run: |
          rm -rf /tmp/denmark-history
          cp -R feed/historical/denmark /tmp/denmark-history
      - name: Commit historical discovery evidence
        run: |
          git config user.name "radar-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf feed/historical/denmark
            mkdir -p feed/historical
            cp -R /tmp/denmark-history feed/historical/denmark
            git add feed/historical/denmark
            if git diff --cached --quiet; then
              echo "No discovery changes"
              exit 0
            fi
            git commit -m "Update Denmark historical source discovery"
            if git push; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
