name: Track Radar odds movement

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'odds-movement-trigger.json'

permissions:
  contents: write

concurrency:
  group: radar-odds-movement
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
      - name: Capture GoldBet and player-prop price history
        env:
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, re, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo

          NOW=datetime.now(timezone.utc)
          NOW_ISO=NOW.isoformat()
          ROME=ZoneInfo('Europe/Rome')
          token=os.environ.get('BRIDGE_TOKEN','').strip()
          if not token: raise SystemExit('Missing BRIDGE_TOKEN')

          STATE=pathlib.Path('feed/odds-movement-state.json')
          SUMMARY=pathlib.Path('feed/odds-movement-current.json')
          STATE.parent.mkdir(exist_ok=True)
          try:
            old=json.loads(STATE.read_text(encoding='utf-8')) if STATE.exists() else {}
          except Exception:
            old={}
          records=old.get('records') if isinstance(old,dict) else {}
          if not isinstance(records,dict): records={}

          def parse_dt(s, local=False):
            if not s: return None
            try:
              if local:
                return datetime.strptime(str(s),'%d-%m-%Y %H:%M').replace(tzinfo=ROME).astimezone(timezone.utc)
              return datetime.fromisoformat(str(s).replace('Z','+00:00')).astimezone(timezone.utc)
            except Exception:
              return None

          def minutes_to(start):
            d=parse_dt(start)
            return None if not d else round((d-NOW).total_seconds()/60,1)

          def stable_key(parts):
            raw='|'.join('' if x is None else str(x) for x in parts)
            return hashlib.sha1(raw.encode('utf-8')).hexdigest()[:20]

          checkpoints=[120,75,60,40,30,15]
          observations=[]
          errors=[]

          # Direct GoldBet standard markets from the existing bridge.
          base='https://radar-goldbet.p-ceresetti.workers.dev/odds'
          offsets=list(range(0,20000,2000))
          def page(off):
            qs=urllib.parse.urlencode({'token':token,'bookmakers':'goldbet','state':'prematch','limit':'2000','offset':str(off)})
            req=urllib.request.Request(base+'?'+qs,headers={'Accept':'application/json','User-Agent':'RadarMovement/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=75) as r:
                d=json.loads(r.read().decode('utf-8','replace'))
                return {'offset':off,'count':d.get('count'),'rows':d.get('odds') or [],'error':None}
            except Exception as e:
              return {'offset':off,'count':None,'rows':[],'error':type(e).__name__+': '+str(e)[:180]}

          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
            pages=list(ex.map(page,offsets))
          total=max([p.get('count') or 0 for p in pages] or [0])
          std_rows=[]
          for p in pages:
            if p['error']: errors.append({'source':'goldbet','offset':p['offset'],'error':p['error']})
            if total==0 or p['offset']<total: std_rows.extend(p['rows'])

          def relevant_standard_market(name):
            s=str(name or '').lower()
            return any(x in s for x in ('1x2','over','under','goal','btts','double','doppia','total','totale'))

          for r in std_rows:
            if not isinstance(r,dict): continue
            market=str(r.get('market') or '')
            if not relevant_standard_market(market): continue
            start=r.get('commence_time')
            sd=parse_dt(start)
            if sd and (sd < NOW-timedelta(hours=12) or sd > NOW+timedelta(days=14)): continue
            bms=r.get('bookmakers') or []
            bm=None
            if isinstance(bms,list):
              bm=next((b for b in bms if isinstance(b,dict) and str(b.get('key','')).lower()=='goldbet'),None)
            elif isinstance(bms,dict): bm=bms.get('goldbet') or bms
            if not isinstance(bm,dict): continue
            outcomes=bm.get('outcomes') or {}
            if not isinstance(outcomes,dict): continue
            for outcome,price in outcomes.items():
              try: price=float(price)
              except Exception: continue
              observations.append({
                'source':'GOLDBET_DIRECT_STANDARD','bookmaker':'goldbet','event_id':r.get('event_id'),
                'event':r.get('event') or f"{r.get('home_team','')} - {r.get('away_team','')}",
                'league':r.get('league'),'start_time':start,'market':market,'line':r.get('line'),
                'scope':r.get('scope'),'period':r.get('period'),'selection':str(outcome),'player':None,
                'price':price,'source_last_update':bm.get('last_update')
              })

          # Player props: autonomous shared AAMS feed already tied to real matches.
          pfile=pathlib.Path('feed/player-props-current.json')
          if pfile.exists():
            try:
              pdata=json.loads(pfile.read_text(encoding='utf-8'))
              for r in pdata.get('rows') or []:
                if not isinstance(r,dict) or r.get('odd') is None: continue
                try: price=float(r.get('odd'))
                except Exception: continue
                start=r.get('match_start')
                sd=parse_dt(start,local=True)
                start_iso=sd.isoformat() if sd else None
                observations.append({
                  'source':'SHARED_AAMS_PLAYER','bookmaker':'shared_aams_goldbet_aligned',
                  'event_id':r.get('match_event_id') or r.get('match_market_id'),'event':r.get('match') or r.get('match_code'),
                  'league':r.get('league'),'start_time':start_iso,'market':r.get('market'),'line':r.get('line'),
                  'scope':'player','period':None,'selection':r.get('selection'),'player':r.get('player'),
                  'price':price,'source_last_update':r.get('fetched_at')
                })
            except Exception as e:
              errors.append({'source':'player_props','error':type(e).__name__+': '+str(e)[:180]})

          new_count=0; changed_count=0; checkpoint_count=0
          seen_keys=set()
          for o in observations:
            key=stable_key([o['source'],o['bookmaker'],o['event_id'],o['market'],o['line'],o['scope'],o['period'],o['player'],o['selection']])
            seen_keys.add(key)
            mt=minutes_to(o.get('start_time'))
            rec=records.get(key)
            if not isinstance(rec,dict):
              rec={
                'key':key,'source':o['source'],'bookmaker':o['bookmaker'],'event_id':o['event_id'],'event':o['event'],'league':o['league'],
                'start_time':o['start_time'],'market':o['market'],'line':o['line'],'scope':o['scope'],'period':o['period'],
                'player':o['player'],'selection':o['selection'],'first_seen_at':NOW_ISO,'open_price':o['price'],
                'current_price':o['price'],'last_change_at':NOW_ISO,'change_count':0,'min_price':o['price'],'max_price':o['price'],
                'checkpoints':{},'source_last_update':o.get('source_last_update')
              }
              records[key]=rec; new_count+=1
            else:
              oldp=rec.get('current_price')
              try: different=abs(float(oldp)-float(o['price']))>1e-9
              except Exception: different=oldp!=o['price']
              if different:
                rec['current_price']=o['price']; rec['last_change_at']=NOW_ISO; rec['change_count']=int(rec.get('change_count') or 0)+1
                rec['min_price']=min(float(rec.get('min_price',o['price'])),o['price'])
                rec['max_price']=max(float(rec.get('max_price',o['price'])),o['price'])
                rec['source_last_update']=o.get('source_last_update'); changed_count+=1
            if mt is not None:
              cps=rec.setdefault('checkpoints',{})
              for cp in checkpoints:
                ck=f'T-{cp}'
                if ck not in cps and mt <= cp and mt > cp-12:
                  cps[ck]={'price':o['price'],'captured_at':NOW_ISO,'minutes_to_start':mt}
                  checkpoint_count+=1

          # Keep recent completed events for post-match/retro use; prune stale active state after 7 days.
          pruned={}
          for k,rec in records.items():
            sd=parse_dt(rec.get('start_time'))
            if sd and sd < NOW-timedelta(days=7): continue
            pruned[k]=rec
          records=pruned

          movers=[]
          for rec in records.values():
            try:
              op=float(rec['open_price']); cp=float(rec['current_price'])
              pp=round((1/cp-1/op)*100,3) if op>0 and cp>0 else 0
              delta=round(cp-op,3)
            except Exception: continue
            if rec.get('change_count',0)>0:
              movers.append({
                'event':rec.get('event'),'start_time':rec.get('start_time'),'market':rec.get('market'),'line':rec.get('line'),
                'player':rec.get('player'),'selection':rec.get('selection'),'source':rec.get('source'),'open':op,'current':cp,
                'price_delta':delta,'implied_probability_delta_pp':pp,'changes':rec.get('change_count'),
                'T-40':(rec.get('checkpoints') or {}).get('T-40'),'T-30':(rec.get('checkpoints') or {}).get('T-30')
              })
          movers.sort(key=lambda x:abs(x['implied_probability_delta_pp']),reverse=True)

          state={
            'generated_at':NOW_ISO,'method':'FIRST_SEEN -> every price change -> T-120/T-75/T-60/T-40/T-30/T-15 checkpoints',
            'standard_source':'GoldBet direct bridge, same bookmaker only','player_source':'shared AAMS player feed; GoldBet-aligned but not independently player-certified',
            'records':dict(sorted(records.items()))
          }
          summary={
            'generated_at':NOW_ISO,'standard_bridge_total':total,'standard_rows_fetched':len(std_rows),'observations':len(observations),
            'tracked_selections':len(records),'new_selections':new_count,'price_changes_this_run':changed_count,
            'checkpoints_captured_this_run':checkpoint_count,'errors':errors,'top_movers':movers[:100]
          }
          STATE.write_text(json.dumps(state,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          SUMMARY.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Commit movement state
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git pull --rebase || true
          git add feed/odds-movement-state.json feed/odds-movement-current.json
          git diff --cached --quiet && exit 0
          git commit -m 'Track Radar odds movement'
          git push
