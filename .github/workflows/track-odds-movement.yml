name: Track Radar odds movement

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'odds-movement-trigger.json'
      - 'feed/diretta-goldbet-true-open-index.json'

permissions:
  contents: write

concurrency:
  group: radar-odds-movement
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
      - name: Capture GoldBet and player-prop price history
        env:
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo

          NOW=datetime.now(timezone.utc); NOW_ISO=NOW.isoformat(); ROME=ZoneInfo('Europe/Rome')
          token=os.environ.get('BRIDGE_TOKEN','').strip()
          if not token: raise SystemExit('Missing BRIDGE_TOKEN')
          STATE=pathlib.Path('feed/odds-movement-state.json'); SUMMARY=pathlib.Path('feed/odds-movement-current.json')
          TRUEOPEN=pathlib.Path('feed/diretta-goldbet-true-open-index.json')
          STATE.parent.mkdir(exist_ok=True)
          try: old=json.loads(STATE.read_text(encoding='utf-8')) if STATE.exists() else {}
          except Exception: old={}
          records=old.get('records') if isinstance(old,dict) else {}
          if not isinstance(records,dict): records={}
          try: toidx=json.loads(TRUEOPEN.read_text(encoding='utf-8')) if TRUEOPEN.exists() else {}
          except Exception: toidx={}
          true_events=toidx.get('events') if isinstance(toidx,dict) else {}
          if not isinstance(true_events,dict): true_events={}

          def parse_dt(s,local=False):
            if not s:return None
            try:
              if local:return datetime.strptime(str(s),'%d-%m-%Y %H:%M').replace(tzinfo=ROME).astimezone(timezone.utc)
              return datetime.fromisoformat(str(s).replace('Z','+00:00')).astimezone(timezone.utc)
            except Exception:return None
          def minutes_to(s):
            d=parse_dt(s); return None if not d else round((d-NOW).total_seconds()/60,1)
          def key(parts):return hashlib.sha1('|'.join('' if x is None else str(x) for x in parts).encode()).hexdigest()[:20]
          def fnum(v):
            try:return float(v)
            except:return None
          def same_line(a,b):
            if a is None and b is None:return True
            aa=fnum(a);bb=fnum(b)
            if aa is not None and bb is not None:return abs(aa-bb)<1e-9
            return str(a)==str(b)

          for rec in records.values():
            cps=rec.get('checkpoints') or {}; a=cps.get('T-40'); b=cps.get('T-30')
            if isinstance(a,dict) and isinstance(b,dict) and a.get('captured_at')==b.get('captured_at'):
              ma=a.get('minutes_to_start'); mb=b.get('minutes_to_start')
              try:
                if abs(float(ma)-40) <= abs(float(mb)-30): cps.pop('T-30',None)
                else: cps.pop('T-40',None)
              except Exception: cps.pop('T-40',None)

          observations=[]; errors=[]
          base='https://radar-goldbet.p-ceresetti.workers.dev/odds'; offsets=list(range(0,20000,2000))
          def page(off):
            qs=urllib.parse.urlencode({'token':token,'bookmakers':'goldbet','state':'prematch','limit':'2000','offset':str(off)})
            req=urllib.request.Request(base+'?'+qs,headers={'Accept':'application/json','User-Agent':'RadarMovement/3.1'})
            try:
              with urllib.request.urlopen(req,timeout=75) as r:
                d=json.loads(r.read().decode('utf-8','replace')); return {'offset':off,'count':d.get('count'),'rows':d.get('odds') or [],'error':None}
            except Exception as e:return {'offset':off,'count':None,'rows':[],'error':type(e).__name__+': '+str(e)[:180]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex: pages=list(ex.map(page,offsets))
          total=max([p.get('count') or 0 for p in pages] or [0]); std=[]
          for p in pages:
            if p['error']:errors.append({'source':'goldbet','offset':p['offset'],'error':p['error']})
            if total==0 or p['offset']<total:std.extend(p['rows'])
          def relevant(m):
            s=str(m or '').lower(); return any(x in s for x in ('1x2','over','under','goal','btts','double','doppia','total','totale'))
          for r in std:
            if not isinstance(r,dict) or not relevant(r.get('market')):continue
            start=r.get('commence_time'); sd=parse_dt(start)
            if sd and (sd<NOW-timedelta(hours=12) or sd>NOW+timedelta(days=14)):continue
            bms=r.get('bookmakers') or []; bm=None
            if isinstance(bms,list):bm=next((b for b in bms if isinstance(b,dict) and str(b.get('key','')).lower()=='goldbet'),None)
            elif isinstance(bms,dict):bm=bms.get('goldbet') or bms
            if not isinstance(bm,dict):continue
            outs=bm.get('outcomes') or {}
            if not isinstance(outs,dict):continue
            for sel,price in outs.items():
              try:price=float(price)
              except Exception:continue
              observations.append({'source':'GOLDBET_DIRECT_STANDARD','bookmaker':'goldbet','event_id':r.get('event_id'),'event':r.get('event') or f"{r.get('home_team','')} - {r.get('away_team','')}",'league':r.get('league'),'start_time':start,'market':r.get('market'),'line':r.get('line'),'scope':r.get('scope'),'period':r.get('period'),'selection':str(sel),'player':None,'price':price,'source_last_update':bm.get('last_update')})

          pf=pathlib.Path('feed/player-props-current.json')
          if pf.exists():
            try:
              pd=json.loads(pf.read_text(encoding='utf-8'))
              for r in pd.get('rows') or []:
                if not isinstance(r,dict) or r.get('odd') is None:continue
                try:price=float(r.get('odd'))
                except Exception:continue
                sd=parse_dt(r.get('match_start'),local=True); start=sd.isoformat() if sd else None
                observations.append({'source':'SHARED_AAMS_PLAYER','bookmaker':'shared_aams_goldbet_aligned','event_id':r.get('match_event_id') or r.get('match_market_id'),'event':r.get('match') or r.get('match_code'),'league':r.get('league'),'start_time':start,'market':r.get('market'),'line':r.get('line'),'scope':'player','period':None,'selection':r.get('selection'),'player':r.get('player'),'price':price,'source_last_update':r.get('fetched_at')})
            except Exception as e:errors.append({'source':'player_props','error':type(e).__name__+': '+str(e)[:180]})

          checkpoints=[120,75,60,40,30,15]
          new_count=changed_count=checkpoint_count=0
          for o in observations:
            k=key([o['source'],o['bookmaker'],o['event_id'],o['market'],o['line'],o['scope'],o['period'],o['player'],o['selection']]); mt=minutes_to(o.get('start_time')); rec=records.get(k)
            if not isinstance(rec,dict):
              rec={'key':k,'source':o['source'],'bookmaker':o['bookmaker'],'event_id':o['event_id'],'event':o['event'],'league':o['league'],'start_time':o['start_time'],'market':o['market'],'line':o['line'],'scope':o['scope'],'period':o['period'],'player':o['player'],'selection':o['selection'],'first_seen_at':NOW_ISO,'first_seen_price':o['price'],'open_price':o['price'],'current_price':o['price'],'last_change_at':NOW_ISO,'change_count':0,'min_price':o['price'],'max_price':o['price'],'checkpoints':{},'source_last_update':o.get('source_last_update')}
              records[k]=rec; new_count+=1
            else:
              if rec.get('first_seen_price') is None:rec['first_seen_price']=rec.get('open_price')
              try:different=abs(float(rec.get('current_price'))-float(o['price']))>1e-9
              except Exception:different=rec.get('current_price')!=o['price']
              if different:
                rec['current_price']=o['price']; rec['last_change_at']=NOW_ISO; rec['change_count']=int(rec.get('change_count') or 0)+1; rec['min_price']=min(float(rec.get('min_price',o['price'])),o['price']); rec['max_price']=max(float(rec.get('max_price',o['price'])),o['price']); rec['source_last_update']=o.get('source_last_update'); changed_count+=1
            rec['last_observed_at']=NOW_ISO; rec['last_observed_minutes_to_start']=mt
            if mt is not None:
              cps=rec.setdefault('checkpoints',{})
              for cp in checkpoints:
                ck=f'T-{cp}'
                if ck not in cps and (cp-5) < mt <= (cp+5):
                  cps[ck]={'price':o['price'],'captured_at':NOW_ISO,'minutes_to_start':mt,'target_minutes':cp,'distance_from_target_min':round(abs(mt-cp),1)}; checkpoint_count+=1

          true_open_attached=0
          def true_open_match(rec,row):
            if not isinstance(row,dict):return False
            m=str(rec.get('market') or '').lower(); sel=str(rec.get('selection') or '').upper(); period=str(rec.get('period') or '').lower(); scope=str(rec.get('scope') or '').lower()
            if period and period not in ('full_time','fulltime','match','ft'):return False
            bt=row.get('market'); rsel=str(row.get('selection') or '').upper()
            if sel!=rsel:return False
            if bt=='HOME_DRAW_AWAY':return m=='1x2'
            if bt=='BOTH_TEAMS_TO_SCORE':return m in ('btts','both_teams_to_score','goal_no_goal') or 'btts' in m or 'goal' in m
            if bt=='OVER_UNDER':
              if 'team' in m or scope in ('home_team','away_team'):return False
              if not ('total' in m or 'over' in m or 'under' in m):return False
              return same_line(rec.get('line'),row.get('line'))
            if bt=='DOUBLE_CHANCE':return 'double' in m or 'doppia' in m
            return False
          for rec in records.values():
            if rec.get('source')!='GOLDBET_DIRECT_STANDARD':continue
            tev=true_events.get(str(rec.get('event_id') or ''))
            if not isinstance(tev,dict) or tev.get('status')!='TRUE_OPEN_CERTIFIED':continue
            for row in tev.get('rows') or []:
              if true_open_match(rec,row):
                rec['true_open_price']=row.get('true_open'); rec['true_open_status']='TRUE_OPEN_CERTIFIED'; rec['true_open_source']='Diretta/Flashscore GoldBet'; rec['true_open_flashscore_event_id']=tev.get('flashscore_event_id'); rec['true_open_certified_at']=tev.get('certified_at'); rec['diretta_current_at_capture']=row.get('diretta_current'); true_open_attached+=1; break

          records={k:r for k,r in records.items() if not (parse_dt(r.get('start_time')) and parse_dt(r.get('start_time'))<NOW-timedelta(days=7))}
          movers=[]
          for r in records.values():
            try:
              first=float(r.get('first_seen_price',r.get('open_price'))); current=float(r['current_price'])
              certified=r.get('true_open_status')=='TRUE_OPEN_CERTIFIED' and r.get('true_open_price') is not None
              benchmark=float(r['true_open_price']) if certified else first
              pp=round((1/current-1/benchmark)*100,3); delta=round(current-benchmark,3)
            except Exception:continue
            if r.get('change_count',0)>0 or certified:
              movers.append({'event':r.get('event'),'start_time':r.get('start_time'),'market':r.get('market'),'line':r.get('line'),'player':r.get('player'),'selection':r.get('selection'),'source':r.get('source'),'opening_quality':'TRUE_OPEN_CERTIFIED' if certified else 'OPEN_RADAR_PROXY','true_open':r.get('true_open_price') if certified else None,'first_seen':first,'current':current,'benchmark_open':benchmark,'price_delta_from_benchmark':delta,'implied_probability_delta_pp_from_benchmark':pp,'changes':r.get('change_count'),'T-40':(r.get('checkpoints') or {}).get('T-40'),'T-30':(r.get('checkpoints') or {}).get('T-30')})
          movers.sort(key=lambda x:abs(x['implied_probability_delta_pp_from_benchmark']),reverse=True)
          state={'generated_at':NOW_ISO,'method':'TRUE OPEN CERTIFIED (when available) -> distinct T-40 -> T-30 -> CURRENT; FIRST_SEEN retained only as proxy/fallback','standard_source':'GoldBet direct bridge, same bookmaker only','true_open_source':'Diretta/Flashscore GoldBet ope2, bookmakerId 188, project 400 Italy','player_source':'shared AAMS player feed; GoldBet-aligned but not independently player-certified','records':dict(sorted(records.items()))}
          summary={'generated_at':NOW_ISO,'standard_bridge_total':total,'standard_rows_fetched':len(std),'observations':len(observations),'tracked_selections':len(records),'new_selections':new_count,'price_changes_this_run':changed_count,'checkpoints_captured_this_run':checkpoint_count,'true_open_index_events':len(true_events),'true_open_attached_records':true_open_attached,'errors':errors,'top_movers':movers[:100]}
          STATE.write_text(json.dumps(state,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8'); SUMMARY.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8'); print(json.dumps(summary,ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Commit movement state safely
        shell: bash
        run: |
          set -e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/odds-movement-state.json feed/odds-movement-current.json
          git diff --cached --quiet && exit 0
          git commit -m 'Track Radar odds movement'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo 'Unable to persist movement state after retries' >&2
          exit 1
