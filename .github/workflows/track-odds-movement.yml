name: Track GoldBet standard odds movement

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'odds-movement-trigger.json'
      - 'feed/diretta-goldbet-true-open-index.json'

permissions:
  contents: write

concurrency:
  group: goldbet-standard-odds-movement
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Capture GoldBet standard price history only
        env:
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta

          NOW = datetime.now(timezone.utc)
          NOW_ISO = NOW.isoformat()
          token = os.environ.get('BRIDGE_TOKEN','').strip()
          if not token:
              print('::warning::Missing BRIDGE_TOKEN; GoldBet standard lane skipped')
              raise SystemExit(0)

          STATE = pathlib.Path('feed/odds-movement-state.json')
          SUMMARY = pathlib.Path('feed/odds-movement-current.json')
          TRUEOPEN = pathlib.Path('feed/diretta-goldbet-true-open-index.json')
          STATE.parent.mkdir(exist_ok=True)

          def parse_dt(s):
              if not s: return None
              try: return datetime.fromisoformat(str(s).replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception: return None

          def key(parts):
              return hashlib.sha1('|'.join('' if x is None else str(x) for x in parts).encode()).hexdigest()[:20]

          try:
              old = json.loads(STATE.read_text(encoding='utf-8')) if STATE.exists() else {}
          except Exception:
              old = {}

          # V2 separation: retain ONLY GoldBet standard records in this state.
          records = {
              k:v for k,v in (old.get('records') or {}).items()
              if isinstance(v,dict) and v.get('source') == 'GOLDBET_DIRECT_STANDARD'
          }

          # Keep a compact rolling window; player props have their own BetFlag V7 lane.
          cutoff = NOW - timedelta(days=3)
          records = {
              k:v for k,v in records.items()
              if not parse_dt(v.get('start_time')) or parse_dt(v.get('start_time')) >= cutoff
          }

          try:
              toidx = json.loads(TRUEOPEN.read_text(encoding='utf-8')) if TRUEOPEN.exists() else {}
          except Exception:
              toidx = {}
          true_events = toidx.get('events') if isinstance(toidx,dict) else {}
          if not isinstance(true_events,dict): true_events = {}

          base = 'https://radar-goldbet.p-ceresetti.workers.dev/odds'
          errors=[]; std=[]; total=0

          def fetch_page(offset):
              qs = urllib.parse.urlencode({
                  'token':token,'bookmakers':'goldbet','state':'prematch',
                  'limit':'2000','offset':str(offset)
              })
              req = urllib.request.Request(base+'?'+qs, headers={
                  'Accept':'application/json','User-Agent':'RadarMovementV2/5.0'
              })
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return json.loads(r.read().decode('utf-8','replace'))
                  except urllib.error.HTTPError as e:
                      if e.code == 429 and attempt < 3:
                          time.sleep(3 * (attempt + 1))
                          continue
                      errors.append({'source':'goldbet','offset':offset,'error':f'HTTP {e.code}'})
                      return None
                  except Exception as e:
                      errors.append({'source':'goldbet','offset':offset,'error':type(e).__name__})
                      return None

          # Sequential paging deliberately reduces 429 pressure.
          for offset in range(0, 12000, 2000):
              data = fetch_page(offset)
              if not isinstance(data,dict):
                  if offset == 0: break
                  continue
              count = int(data.get('count') or 0)
              total = max(total, count)
              rows = data.get('odds') or []
              if isinstance(rows,list): std.extend(rows)
              if count and offset + 2000 >= count: break
              time.sleep(0.8)

          observations=[]
          def relevant(m):
              s=str(m or '').lower()
              return any(x in s for x in ('1x2','over','under','goal','btts','double','doppia','total','totale'))

          for r in std:
              if not isinstance(r,dict) or not relevant(r.get('market')): continue
              start=r.get('commence_time'); sd=parse_dt(start)
              if sd and (sd < NOW-timedelta(hours=12) or sd > NOW+timedelta(days=7)): continue
              bms=r.get('bookmakers') or []
              bm=None
              if isinstance(bms,list):
                  bm=next((b for b in bms if isinstance(b,dict) and str(b.get('key','')).lower()=='goldbet'),None)
              elif isinstance(bms,dict):
                  bm=bms.get('goldbet') or bms
              if not isinstance(bm,dict): continue
              outs=bm.get('outcomes') or {}
              if not isinstance(outs,dict): continue
              for sel,price in outs.items():
                  try: price=float(price)
                  except Exception: continue
                  observations.append({
                      'source':'GOLDBET_DIRECT_STANDARD','bookmaker':'goldbet',
                      'event_id':r.get('event_id'),
                      'event':r.get('event') or f"{r.get('home_team','')} - {r.get('away_team','')}",
                      'league':r.get('league'),'start_time':start,'market':r.get('market'),
                      'line':r.get('line'),'scope':r.get('scope'),'period':r.get('period'),
                      'selection':str(sel),'price':price,'source_last_update':bm.get('last_update')
                  })

          new_count=changed_count=checkpoint_count=0
          checkpoints=[120,75,60,40,30,15]
          for o in observations:
              k=key([o['source'],o['event_id'],o['market'],o['line'],o['scope'],o['period'],o['selection']])
              sd=parse_dt(o.get('start_time'))
              mt=None if not sd else round((sd-NOW).total_seconds()/60,1)
              rec=records.get(k)
              if not isinstance(rec,dict):
                  rec={
                      'key':k,'source':'GOLDBET_DIRECT_STANDARD','bookmaker':'goldbet',
                      'event_id':o['event_id'],'event':o['event'],'league':o['league'],
                      'start_time':o['start_time'],'market':o['market'],'line':o['line'],
                      'scope':o['scope'],'period':o['period'],'selection':o['selection'],
                      'first_seen_at':NOW_ISO,'first_seen_price':o['price'],
                      'current_price':o['price'],'last_change_at':NOW_ISO,'change_count':0,
                      'min_price':o['price'],'max_price':o['price'],'checkpoints':{}
                  }
                  records[k]=rec; new_count += 1
              elif rec.get('current_price') != o['price']:
                  rec['current_price']=o['price']; rec['last_change_at']=NOW_ISO
                  rec['change_count']=int(rec.get('change_count') or 0)+1
                  rec['min_price']=min(float(rec.get('min_price',o['price'])),o['price'])
                  rec['max_price']=max(float(rec.get('max_price',o['price'])),o['price'])
                  changed_count += 1
              rec['last_observed_at']=NOW_ISO
              rec['source_last_update']=o.get('source_last_update')
              if mt is not None:
                  for cp in checkpoints:
                      ck=f'T-{cp}'
                      if ck not in rec['checkpoints'] and (cp-5) < mt <= (cp+5):
                          rec['checkpoints'][ck]={'price':o['price'],'captured_at':NOW_ISO,'minutes_to_start':mt}
                          checkpoint_count += 1

          # Attach TRUE OPEN only to GoldBet standard records.
          attached=0
          for rec in records.values():
              tev=true_events.get(str(rec.get('event_id') or ''))
              if not isinstance(tev,dict) or tev.get('status')!='TRUE_OPEN_CERTIFIED': continue
              for row in tev.get('rows') or []:
                  if str(row.get('selection') or '').upper() != str(rec.get('selection') or '').upper(): continue
                  bt=row.get('market'); m=str(rec.get('market') or '').lower()
                  ok=(bt=='HOME_DRAW_AWAY' and m=='1x2') or (bt=='BOTH_TEAMS_TO_SCORE' and ('btts' in m or 'goal' in m)) or (bt=='DOUBLE_CHANCE' and ('double' in m or 'doppia' in m))
                  if bt=='OVER_UNDER':
                      try: ok=('over' in m or 'under' in m or 'total' in m) and abs(float(rec.get('line'))-float(row.get('line')))<1e-9
                      except Exception: ok=False
                  if ok:
                      rec['true_open_price']=row.get('true_open')
                      rec['true_open_status']='TRUE_OPEN_CERTIFIED'
                      rec['true_open_source']='Diretta/Flashscore GoldBet'
                      attached += 1
                      break

          movers=[]
          for r in records.values():
              try:
                  first=float(r.get('first_seen_price')); cur=float(r.get('current_price'))
                  certified=r.get('true_open_status')=='TRUE_OPEN_CERTIFIED' and r.get('true_open_price') is not None
                  benchmark=float(r['true_open_price']) if certified else first
                  delta=round(cur-benchmark,3)
                  pp=round((1/cur-1/benchmark)*100,3)
              except Exception: continue
              if r.get('change_count',0)>0 or certified:
                  movers.append({'event':r.get('event'),'market':r.get('market'),'line':r.get('line'),'selection':r.get('selection'),'true_open':r.get('true_open_price'),'first_seen':first,'current':cur,'price_delta_from_benchmark':delta,'implied_probability_delta_pp_from_benchmark':pp,'T-40':(r.get('checkpoints') or {}).get('T-40'),'T-30':(r.get('checkpoints') or {}).get('T-30')})
          movers.sort(key=lambda x:abs(x['implied_probability_delta_pp_from_benchmark']),reverse=True)

          state={
              'generated_at':NOW_ISO,
              'lane':'GOLDBET_STANDARD_ONLY',
              'player_lane':'BETFLAG_V7_SEPARATE_NOT_READ_HERE',
              'method':'TRUE OPEN -> T-40 -> T-30 -> CURRENT; same bookmaker only',
              'records':dict(sorted(records.items()))
          }
          summary={
              'generated_at':NOW_ISO,'lane':'GOLDBET_STANDARD_ONLY',
              'standard_bridge_total':total,'standard_rows_fetched':len(std),
              'observations':len(observations),'tracked_selections':len(records),
              'new_selections':new_count,'price_changes_this_run':changed_count,
              'checkpoints_captured_this_run':checkpoint_count,
              'true_open_attached_records':attached,'errors':errors,'top_movers':movers[:100]
          }

          # If GoldBet is rate-limited/unavailable, preserve prior state and report warning.
          if not observations and errors:
              SUMMARY.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
              print('::warning::GoldBet standard upstream unavailable/rate-limited; last movement state preserved')
          else:
              STATE.write_text(json.dumps(state,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              SUMMARY.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2)[:12000])
          PY

      - name: Persist standard movement state without noisy failure
        shell: bash
        run: |
          set +e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/odds-movement-state.json feed/odds-movement-current.json
          git diff --cached --quiet && exit 0
          git commit -m 'Track GoldBet standard odds movement' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main >/dev/null 2>&1 || { git rebase --abort >/dev/null 2>&1; sleep $((attempt*3)); continue; }
            git push origin main && exit 0
            git rebase --abort >/dev/null 2>&1
            sleep $((attempt*3))
          done
          echo '::warning::Movement state not persisted due to concurrent repository writes; next run will retry.'
          exit 0
