name: GoldBet service config probe

on:
  push:
    paths:
      - goldbet-service-config-probe-trigger.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public service configuration endpoint
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.error
          from datetime import datetime, timezone
          urls=[
            'https://www.goldbet.it/api/games/app/getSportServiceConfiguration',
            'https://www.goldbet.it/api/sport/promptbet/health'
          ]
          out=[]
          for u in urls:
              req=urllib.request.Request(u,headers={'Accept':'application/json,text/plain,*/*','User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read().decode('utf-8','replace')
                      out.append({'url':u,'status':r.status,'content_type':r.headers.get('content-type'),'body':raw[:20000]})
              except urllib.error.HTTPError as e:
                  out.append({'url':u,'status':e.code,'content_type':e.headers.get('content-type'),'body':e.read().decode('utf-8','replace')[:5000]})
              except Exception as e:
                  out.append({'url':u,'error':repr(e)})
          result={'generated_at':datetime.now(timezone.utc).isoformat(),'results':out}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/goldbet-service-config-probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit result
        run: |
          git config user.name "radar-goldbet-bot"
          git config user.email "radar-goldbet-bot@users.noreply.github.com"
          git add feed/goldbet-service-config-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe GoldBet public service config"
          git push
