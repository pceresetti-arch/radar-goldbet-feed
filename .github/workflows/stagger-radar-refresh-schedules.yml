name: Stagger Radar refresh schedules

on:
  push:
    paths:
      - '.github/workflows/stagger-radar-refresh-schedules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 5
      - name: Stagger schedules to reduce collisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          changes={
            '.github/workflows/refresh-current-lineups.yml':("cron: '*/5 * * * *'","cron: '3,13,23,33,43,53 * * * *'"),
            '.github/workflows/refresh-current-player-props.yml':("cron: '*/5 * * * *'","cron: '6,16,26,36,46,56 * * * *'"),
            '.github/workflows/build-deep-analysis-readiness.yml':("cron: '*/5 * * * *'","cron: '8,18,28,38,48,58 * * * *'"),
          }
          for fn,(old,new) in changes.items():
            p=Path(fn); s=p.read_text(encoding='utf-8')
            if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
            elif new not in s:
              raise SystemExit(f'cron anchor missing: {fn}')
          PY
      - name: Commit safely
        shell: bash
        run: |
          set -e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add .github/workflows/refresh-current-lineups.yml .github/workflows/refresh-current-player-props.yml .github/workflows/build-deep-analysis-readiness.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Stagger Radar refresh schedules'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*2))
          done
          exit 1
