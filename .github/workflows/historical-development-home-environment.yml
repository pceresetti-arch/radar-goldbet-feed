name: Historical development home-environment audit

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/historical_development_home_environment_rolling_v1.py"
      - ".github/workflows/historical-development-home-environment.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic numeric dependency
        run: python -m pip install "numpy==2.1.3"
      - name: Run development-only rolling-origin audit
        run: python tools/historical_development_home_environment_rolling_v1.py
      - name: Persist report
        run: |
          git config user.name "radar-history-bot"
          git config user.email "radar-history-bot@users.noreply.github.com"
          git add feed/historical/calibration/development-home-environment-rolling-v1.json
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Add development-only home-environment rolling audit"
            published=false
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                published=true
                break
              fi
              sleep 3
            done
            test "$published" = true
          fi
