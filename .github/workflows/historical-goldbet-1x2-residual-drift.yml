name: Historical GoldBet 1X2 Residual Drift

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/historical_goldbet_1x2_residual_drift.py
      - .github/workflows/historical-goldbet-1x2-residual-drift.yml

permissions:
  contents: write

concurrency:
  group: historical-goldbet-1x2-residual-drift
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze residual drift
        run: python tools/historical_goldbet_1x2_residual_drift.py
      - name: Commit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/historical/open-close/goldbet-1x2-residual-drift-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "historical: analyze GoldBet 1X2 residual drift"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
