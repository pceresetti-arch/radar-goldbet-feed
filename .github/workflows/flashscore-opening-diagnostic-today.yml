name: Flashscore opening odds diagnostic today

on:
  push:
    paths:
      - '.github/workflows/flashscore-opening-diagnostic-today.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe today's Flashscore/Diretta opening odds
        shell: bash
        run: |
          python - <<'PY'
          import json,re,unicodedata,requests

          targets=[('Chelsea','Brighton'),('Leeds','Brentford'),('Sunderland','Fulham'),('Manchester United','Ipswich'),('Napoli','Como'),('Cagliari','Inter'),('Lazio','Genoa')]
          H={'x-fsign':'SW9D1eZo','User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Referer':'https://www.flashscore.com/','Origin':'https://www.flashscore.com','Accept':'*/*','Accept-Language':'it-IT,it;q=0.9,en;q=0.8'}

          def norm(s):
              s=unicodedata.normalize('NFKD',s or '')
              s=''.join(c for c in s if not unicodedata.combining(c))
              s=re.sub(r'[^a-z0-9]+',' ',s.lower()).strip()
              aliases={'manchester united':'man utd','brighton and hove albion':'brighton','internazionale':'inter','inter milan':'inter'}
              return aliases.get(s,s)

          def parse_feed(raw):
              out=[]
              for sec in raw.split('~'):
                  d={}
                  for p in sec.split(chr(0xAC)):
                      if chr(0xF7) in p:
                          k,v=p.split(chr(0xF7),1); d[k]=v
                  if d.get('AA') and d.get('AE') and d.get('AF'):
                      out.append({'event_id':d['AA'],'home':d['AE'],'away':d['AF'],'ts':d.get('AD'),'status':d.get('AB')})
              return out

          s=requests.Session()
          feed_url='https://www.flashscore.com/x/feed/f_1_0_3_en_1'
          r=s.get(feed_url,headers=H,timeout=20)
          print('FEED',r.status_code,len(r.content),r.text[:80])
          r.raise_for_status()
          matches=parse_feed(r.text)
          print('MATCH_COUNT',len(matches))

          for home,away in targets:
              nh,na=norm(home),norm(away); found=None
              for m in matches:
                  mh,ma=norm(m['home']),norm(m['away'])
                  if (nh in mh or mh in nh) and (na in ma or ma in na):
                      found=m; break
              print('\nTARGET',home,'vs',away,'FOUND',bool(found),found)
              if not found: continue

              params={'_hash':'oce','eventId':found['event_id'],'projectId':'2','geoIpCode':'IT'}
              rr=s.get('https://global.ds.lsapp.eu/odds/pq_graphql',params=params,headers=H,timeout=20)
              print('ODDS_HTTP',rr.status_code,'BYTES',len(rr.content),'PREFIX',rr.text[:180])
              if not rr.ok: continue
              try: js=rr.json()
              except Exception as e:
                  print('JSON_ERROR',repr(e)); continue
              fo=(js.get('data') or {}).get('findOddsByEventId') or {}
              print('ODDS_ROWS',len(fo.get('odds') or []))
              bmap={}
              for x in (fo.get('settings') or {}).get('bookmakers',[]):
                  b=(x or {}).get('bookmaker') or {}
                  if b.get('id') is not None: bmap[str(b['id'])]=b.get('name')
              print('BOOKMAKERS',sorted(bmap.values()))
              gold=[]
              for item in fo.get('odds') or []:
                  bn=bmap.get(str(item.get('bookmakerId','')),'')
                  if 'gold' not in (bn or '').lower(): continue
                  outs=[{'value':o.get('value'),'opening':o.get('opening'),'active':o.get('active'),'change':o.get('change'),'handicap':o.get('handicap')} for o in (item.get('odds') or [])]
                  gold.append({'bookmaker':bn,'type':item.get('bettingType'),'scope':item.get('bettingScope'),'odds':outs})
              print('GOLDBET_ROWS',json.dumps(gold,ensure_ascii=False))
          PY
