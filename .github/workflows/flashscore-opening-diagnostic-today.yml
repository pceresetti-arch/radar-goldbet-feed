name: Flashscore opening odds diagnostic today

on:
  push:
    paths:
      - '.github/workflows/flashscore-opening-diagnostic-today.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe odds endpoint matrix
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,itertools
          event='fHs9cG8L'  # Napoli-Como, 30 Aug 2026
          H={'x-fsign':'SW9D1eZo','User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Referer':'https://www.flashscore.com/','Origin':'https://www.flashscore.com','Accept':'*/*','Accept-Language':'it-IT,it;q=0.9,en;q=0.8'}
          hosts=['https://global.ds.lsapp.eu/odds/pq_graphql','https://2.ds.lsapp.eu/pq_graphql']
          hashes=['ope','oce']
          geos=[('IT',None),('IT','IT'),('GB',None),('PT','PT13')]
          for host,hsh,(geo,sub) in itertools.product(hosts,hashes,geos):
              q={'_hash':hsh,'eventId':event,'projectId':'2','geoIpCode':geo}
              if sub: q['geoIpSubdivisionCode']=sub
              try:
                  r=requests.get(host,params=q,headers=H,timeout=20)
                  print('\nTRY',host,hsh,geo,sub,'HTTP',r.status_code,'BYTES',len(r.content))
                  print('URL',r.url)
                  print('PREFIX',r.text[:220].replace('\n',' '))
                  if r.ok:
                      try:
                          js=r.json(); fo=(js.get('data') or {}).get('findOddsByEventId') or {}
                          print('ROWS',len(fo.get('odds') or []),'SETTINGS',bool(fo.get('settings')))
                          if fo.get('odds'):
                              bmap={}
                              for x in (fo.get('settings') or {}).get('bookmakers',[]):
                                  b=(x or {}).get('bookmaker') or {}
                                  if b.get('id') is not None:bmap[str(b['id'])]=b.get('name')
                              print('BOOKMAKERS',sorted(bmap.values()))
                              gold=[]
                              for item in fo.get('odds') or []:
                                  bn=bmap.get(str(item.get('bookmakerId','')),'')
                                  if 'gold' in (bn or '').lower():
                                      gold.append({'bookmaker':bn,'type':item.get('bettingType'),'scope':item.get('bettingScope'),'odds':item.get('odds')})
                              print('GOLDBET',json.dumps(gold,ensure_ascii=False)[:5000])
                      except Exception as e: print('JSONERR',repr(e))
              except Exception as e: print('ERR',repr(e))
          PY
