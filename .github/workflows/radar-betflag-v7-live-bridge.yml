name: Radar BetFlag v7 live bridge

on:
  push:
    paths:
      - 'radar-betflag-v7-live-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-betflag-v7-live-bridge
  cancel-in-progress: false

jobs:
  fetch-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Query canonical BetFlag v7 Worker live
        shell: bash
        env:
          WORKER_BASE: https://radar-betflag-v7.p-ceresetti.workers.dev
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, urllib.error, time, os
          from datetime import datetime, timezone

          BASE=os.environ['WORKER_BASE'].rstrip('/')
          req_path=pathlib.Path('radar-betflag-v7-live-request.json')
          req=json.loads(req_path.read_text(encoding='utf-8'))
          mode=str(req.get('mode') or 'player_props').strip().lower()
          if mode not in ('player_props','player_price','health'):
              raise SystemExit(f'unsupported mode: {mode}')

          def now(): return datetime.now(timezone.utc).isoformat()
          def get_json(url, timeout=35):
              started=time.monotonic(); status=None; body=None; error=None
              headers={'Accept':'application/json','User-Agent':'RadarBetFlagV7LiveBridge/1.0'}
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=timeout)
                  status=r.status; raw=r.read(20_000_000).decode('utf-8','replace')
                  try: body=json.loads(raw)
                  except Exception: body={'raw':raw}
              except urllib.error.HTTPError as e:
                  status=e.code; raw=e.read(20_000_000).decode('utf-8','replace')
                  try: body=json.loads(raw)
                  except Exception: body={'raw':raw}
                  error=f'HTTPError {e.code}'
              except Exception as e:
                  error=f'{type(e).__name__}: {e}'
              return {'url':url,'http_status':status,'fetched_at':now(),'elapsed_ms':round((time.monotonic()-started)*1000),'error':error,'body':body}

          health=get_json(BASE+'/health')
          calls=[]
          if mode=='health':
              calls=[]
          elif mode=='player_props':
              queries=req.get('queries')
              if not isinstance(queries,list) or not queries:
                  queries=[req.get('params') or {}]
              if len(queries)>40:
                  raise SystemExit('too many discovery queries; max 40')
              for params in queries:
                  params={k:v for k,v in (params or {}).items() if v is not None and str(v)!=''}
                  params.setdefault('limit', req.get('limit', 500))
                  url=BASE+'/live/player-props?'+urllib.parse.urlencode(params, doseq=True)
                  calls.append(get_json(url))
          else:
              params={k:v for k,v in (req.get('params') or {}).items() if v is not None and str(v)!=''}
              if not params:
                  raise SystemExit('player_price requires params')
              url=BASE+'/live/player-price?'+urllib.parse.urlencode(params, doseq=True)
              calls=[get_json(url)]

          generated=now()
          health_body=health.get('body') if isinstance(health.get('body'),dict) else {}
          payload={
              'schema_version':'radar-betflag-v7-live-bridge-v1',
              'bridge_mode':'ON_DEMAND_WORKER_LIVE_NO_CACHE',
              'requested_at':req.get('requested_at'),
              'request_id':req.get('request_id'),
              'generated_at':generated,
              'worker_base':BASE,
              'mode':mode,
              'health':health,
              'health_contract_ok':bool(health.get('http_status')==200 and health_body.get('ok') is True and health_body.get('version')=='7.0-betflag-operational'),
              'calls':calls,
              'no_cache_fallback':True,
              'github_sha':os.environ.get('GITHUB_SHA')
          }
          out=pathlib.Path('feed/radar-betflag-v7-live-response.json')
          out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY

      - name: Commit live response
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/radar-betflag-v7-live-response.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record on-demand BetFlag v7 live response'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
