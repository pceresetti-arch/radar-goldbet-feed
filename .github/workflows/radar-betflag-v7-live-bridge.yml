name: Radar BetFlag v7 live bridge

on:
  push:
    paths:
      - 'radar-betflag-v7-live-request.json'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: radar-betflag-v7-live-bridge
  cancel-in-progress: false

jobs:
  fetch-live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve bridge mode
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,os,re
          req=json.loads(pathlib.Path('radar-betflag-v7-live-request.json').read_text(encoding='utf-8'))
          mode='fixture_feed' if os.environ.get('GITHUB_EVENT_NAME')=='schedule' else str(req.get('mode') or 'player_index').strip().lower()
          request_id=str(req.get('request_id') or f"run-{os.environ.get('GITHUB_RUN_ID','unknown')}")
          safe=re.sub(r'[^A-Za-z0-9._-]+','-',request_id).strip('-')[:160] or f"run-{os.environ.get('GITHUB_RUN_ID','unknown')}"
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('RADAR_BRIDGE_MODE='+mode+'\n')
              f.write('RADAR_REQUEST_FILE='+safe+'.json\n')
          print('mode='+mode+' request_file='+safe+'.json')
          PY

      - name: Materialize full BetFlag fixture feed from v7 Worker
        if: env.RADAR_BRIDGE_MODE == 'fixture_feed'
        run: python collector/betflag_worker_fixture_feed.py

      - name: Query canonical BetFlag v7 Worker live
        if: env.RADAR_BRIDGE_MODE != 'fixture_feed'
        shell: bash
        env:
          WORKER_BASE: https://radar-betflag-v7.p-ceresetti.workers.dev
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, urllib.error, time, os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          BASE=os.environ['WORKER_BASE'].rstrip('/')
          req=json.loads(pathlib.Path('radar-betflag-v7-live-request.json').read_text(encoding='utf-8'))
          mode=os.environ.get('RADAR_BRIDGE_MODE') or str(req.get('mode') or 'player_index').strip().lower()
          if mode not in ('player_index','standard_index','player_props','player_price','health'):
              raise SystemExit(f'unsupported mode: {mode}')
          def now(): return datetime.now(timezone.utc).isoformat()
          def get_json(url, timeout=60):
              started=time.monotonic(); status=None; body=None; error=None
              headers={'Accept':'application/json','Cache-Control':'no-cache','User-Agent':'RadarBetFlagV7LiveBridge/3.0'}
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=timeout)
                  status=r.status; raw=r.read(25_000_000).decode('utf-8','replace')
                  try: body=json.loads(raw)
                  except Exception: body={'raw':raw}
              except urllib.error.HTTPError as e:
                  status=e.code; raw=e.read(25_000_000).decode('utf-8','replace')
                  try: body=json.loads(raw)
                  except Exception: body={'raw':raw}
                  error=f'HTTPError {e.code}'
              except Exception as e:
                  error=f'{type(e).__name__}: {e}'
              return {'url':url,'http_status':status,'fetched_at':now(),'elapsed_ms':round((time.monotonic()-started)*1000),'error':error,'body':body}
          health=get_json(BASE+'/health')
          calls=[]
          params={k:v for k,v in (req.get('params') or {}).items() if v is not None and str(v)!=''}
          if mode in ('player_index','standard_index'):
              params.setdefault('date',datetime.now(ZoneInfo('Europe/Rome')).strftime('%d-%m-%Y'))
              endpoint='/live/player-index' if mode=='player_index' else '/live/standard-index'
              calls=[get_json(BASE+endpoint+'?'+urllib.parse.urlencode(params))]
          elif mode=='player_props':
              queries=req.get('queries') if isinstance(req.get('queries'),list) and req.get('queries') else [params]
              for q in queries[:40]:
                  q={k:v for k,v in (q or {}).items() if v is not None and str(v)!=''}; q.setdefault('full','1'); q.setdefault('limit',1000)
                  calls.append(get_json(BASE+'/live/player-props?'+urllib.parse.urlencode(q,doseq=True)))
          elif mode=='player_price':
              if not params: raise SystemExit('player_price requires params')
              calls=[get_json(BASE+'/live/player-price?'+urllib.parse.urlencode(params,doseq=True))]
          payload={'schema_version':'radar-betflag-v7-live-bridge-v3','bridge_mode':'ON_DEMAND_WORKER_LIVE_NO_CACHE','requested_at':req.get('requested_at'),'request_id':req.get('request_id'),'generated_at':now(),'worker_base':BASE,'mode':mode,'health':health,'calls':calls,'no_cache_fallback':True,'github_sha':os.environ.get('GITHUB_SHA')}
          outdir=pathlib.Path('feed/radar-betflag-v7-live-responses'); outdir.mkdir(parents=True,exist_ok=True)
          unique=outdir/os.environ['RADAR_REQUEST_FILE']
          unique.write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'mode':mode,'health_status':health.get('http_status'),'calls':len(calls),'output':str(unique)},ensure_ascii=False))
          PY

      - name: Validate fixture feed
        if: env.RADAR_BRIDGE_MODE == 'fixture_feed'
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('feed/betflag-fixtures-index.json').read_text(encoding='utf-8'))
          assert d.get('operationally_usable') is True, d
          status=d.get('feed_status')
          assert status in ('READY_FULL_SCAN','READY_DEGRADED_OR_STANDARD_ONLY','NO_PREMATCH_FIXTURES_AVAILABLE'), d
          print(json.dumps({
            'feed_status':status,
            'source_healthy':d.get('source_healthy'),
            'player_discovery_healthy':d.get('player_discovery_healthy'),
            'coverage_complete':d.get('coverage_complete'),
            'fixture_count':d.get('fixture_count'),
            'full_scan_ready_count':d.get('full_scan_ready_count'),
            'full_market_coverage_ready_count':d.get('full_market_coverage_ready_count'),
            'generated_at':d.get('generated_at')
          },indent=2))
          PY

      - name: Validate Radar consumer quote path
        if: env.RADAR_BRIDGE_MODE == 'fixture_feed'
        run: python scripts/validate_radar_quote_consumer.py --index feed/betflag-fixtures-index.json --output feed/radar-quote-consumer-health.json

      - name: Commit bridge output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          if [ "$RADAR_BRIDGE_MODE" = "fixture_feed" ]; then
            git add feed/betflag-fixtures-index.json feed/betflag-fixtures feed/radar-quote-consumer-health.json
            msg='Refresh Worker-backed BetFlag fixture feeds'
          else
            git add "feed/radar-betflag-v7-live-responses/$RADAR_REQUEST_FILE"
            msg="Record BetFlag v7 response $RADAR_REQUEST_FILE"
          fi
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "$msg"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*2))
          done
          exit 1
