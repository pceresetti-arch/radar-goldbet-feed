name: Discover GoldBet network endpoints

on:
  push:
    paths:
      - goldbet-network-trigger.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
      - name: Capture GoldBet network
        run: |
          python - <<'PY'
          import asyncio, json, pathlib
          from datetime import datetime, timezone
          from playwright.async_api import async_playwright

          trigger=json.loads(pathlib.Path('goldbet-network-trigger.json').read_text())
          target=trigger['url']
          captures=[]
          console=[]

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  context=await browser.new_context(
                      locale='it-IT',
                      timezone_id='Europe/Rome',
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                      viewport={'width':1440,'height':1000},
                  )
                  page=await context.new_page()
                  page.on('console', lambda msg: console.append({'type':msg.type,'text':msg.text[:500]}))

                  async def on_response(resp):
                      try:
                          req=resp.request
                          rt=req.resource_type
                          url=resp.url
                          ctype=(resp.headers.get('content-type') or '').lower()
                          interesting = rt in ('xhr','fetch') or 'json' in ctype or any(x in url.lower() for x in ('api','event','market','odd','sport','bet'))
                          if not interesting:
                              return
                          item={'url':url,'status':resp.status,'resource_type':rt,'content_type':ctype}
                          if ('json' in ctype or rt in ('xhr','fetch')) and resp.status < 500:
                              try:
                                  txt=await resp.text()
                                  item['body_sample']=txt[:4000]
                              except Exception as e:
                                  item['body_error']=str(e)[:300]
                          captures.append(item)
                      except Exception as e:
                          captures.append({'capture_error':str(e)[:300]})

                  page.on('response', on_response)
                  nav_error=None
                  try:
                      response=await page.goto(target, wait_until='domcontentloaded', timeout=60000)
                      await page.wait_for_timeout(18000)
                      status=response.status if response else None
                  except Exception as e:
                      nav_error=str(e)
                      status=None
                  title=''
                  body=''
                  try: title=await page.title()
                  except: pass
                  try: body=(await page.locator('body').inner_text())[:10000]
                  except: pass
                  await browser.close()

                  out={
                      'generated_at':datetime.now(timezone.utc).isoformat(),
                      'target':target,
                      'navigation_status':status,
                      'navigation_error':nav_error,
                      'title':title,
                      'body_sample':body,
                      'capture_count':len(captures),
                      'captures':captures,
                      'console':console[:100],
                  }
                  pathlib.Path('feed').mkdir(exist_ok=True)
                  pathlib.Path('feed/goldbet-network.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')

          asyncio.run(main())
          PY
      - name: Commit discovery
        run: |
          git config user.name "radar-goldbet-bot"
          git config user.email "radar-goldbet-bot@users.noreply.github.com"
          git add feed/goldbet-network.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture GoldBet network endpoints"
          git push
