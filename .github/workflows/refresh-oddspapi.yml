name: Refresh OddsPapi GoldBet feed

on:
  push:
    paths:
      - oddspapi-trigger.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-oddspapi-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GoldBet player props from OddsPapi v5
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          from datetime import datetime, timezone

          key=os.environ.get('ODDSPAPI_KEY','').strip()
          if not key:
              raise SystemExit('Missing GitHub Actions secret: ODDSPAPI_KEY')

          t=json.loads(pathlib.Path('oddspapi-trigger.json').read_text(encoding='utf-8'))
          sport_id=int(t.get('sportId',10))
          bookmaker=str(t.get('bookmaker','goldbet.it'))
          terms=t.get('match_terms',[]) or []
          if isinstance(terms,str): terms=[terms]
          terms=[str(x).strip().lower() for x in terms if str(x).strip()]

          def epoch(s):
              s=str(s).replace('Z','+00:00')
              return int(datetime.fromisoformat(s).timestamp())

          start_from=epoch(t['from'])
          start_to=epoch(t['to'])
          BASE='https://v5.oddspapi.io/en'

          def get(path, params):
              q=dict(params); q['apiKey']=key
              url=BASE+path+'?'+urllib.parse.urlencode(q)
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'RadarGoldBet/5.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return json.loads(r.read().decode('utf-8'))

          fixtures=get('/fixtures',{
              'sportId':sport_id,
              'bookmakers':bookmaker,
              'startTimeFrom':start_from,
              'startTimeTo':start_to,
          })
          if not isinstance(fixtures,list): fixtures=[]

          def ftxt(f):
              p=f.get('participants') or {}
              tr=f.get('tournament') or {}
              vals=[p.get('participant1Name'),p.get('participant2Name'),p.get('participant1ShortName'),p.get('participant2ShortName'),tr.get('tournamentName'),tr.get('categoryName')]
              return ' '.join(str(x) for x in vals if x).lower()

          matches=[f for f in fixtures if all(term in ftxt(f) for term in terms)] if terms else fixtures
          outdir=pathlib.Path('feed'); outdir.mkdir(exist_ok=True)
          now=datetime.now(timezone.utc).isoformat()
          out={
              'generated_at':now,
              'api':'OddsPapi v5',
              'bookmaker':bookmaker,
              'match_terms':terms,
              'fixtures_returned':len(fixtures),
              'matches_found':len(matches),
          }

          if not matches:
              out['sample_fixtures']=[{
                  'fixtureId':f.get('fixtureId'),
                  'participant1Name':(f.get('participants') or {}).get('participant1Name'),
                  'participant2Name':(f.get('participants') or {}).get('participant2Name'),
                  'tournamentName':(f.get('tournament') or {}).get('tournamentName'),
                  'startTime':f.get('startTime'),
              } for f in fixtures[:40]]
          else:
              f=matches[0]
              fid=f.get('fixtureId')
              od=get('/fixtures/odds',{'fixtureId':fid,'bookmakers':bookmaker})
              markets=get('/markets',{'sportId':sport_id})
              mmap={str(m.get('marketId')):m for m in markets if isinstance(m,dict)} if isinstance(markets,list) else {}
              raw=(od.get('odds') or {}).get(bookmaker,{}) if isinstance(od,dict) else {}
              if not isinstance(raw,dict): raw={}

              rows=[]; player_ids=set(); market_ids=set()
              for odds_id,sel in raw.items():
                  if not isinstance(sel,dict): continue
                  mid=sel.get('marketId'); pid=sel.get('playerId')
                  meta=mmap.get(str(mid),{})
                  is_player=bool(meta.get('playerProp')) or (pid not in (None,0,'0'))
                  if not is_player: continue
                  if pid not in (None,0,'0'): player_ids.add(str(pid))
                  market_ids.add(str(mid))
                  rows.append({
                      'oddsId':str(odds_id),
                      'marketId':mid,
                      'marketName':meta.get('marketName'),
                      'marketNameShort':meta.get('marketNameShort'),
                      'marketType':meta.get('marketType'),
                      'period':meta.get('period'),
                      'playerProp':bool(meta.get('playerProp')),
                      'playerId':pid,
                      'outcomeId':sel.get('outcomeId'),
                      'price':sel.get('price'),
                      'active':sel.get('active'),
                      'marketActive':sel.get('marketActive'),
                      'mainLine':sel.get('mainLine'),
                      'bookmakerOutcomeId':sel.get('bookmakerOutcomeId'),
                      'bookmakerMarketId':sel.get('bookmakerMarketId'),
                      'changedAt':sel.get('changedAt'),
                  })

              pmap={}
              ids=sorted(player_ids)
              for i in range(0,len(ids),100):
                  pdata=get('/players',{'playerIds':','.join(ids[i:i+100])})
                  if isinstance(pdata,list):
                      for p in pdata:
                          if isinstance(p,dict): pmap[str(p.get('playerId'))]=p.get('playerName')
              for r in rows:
                  r['playerName']=pmap.get(str(r.get('playerId')))

              bm=(od.get('bookmakers') or {}).get(bookmaker,{}) if isinstance(od,dict) else {}
              out.update({
                  'fixtureId':fid,
                  'participant1Name':(od.get('participants') or {}).get('participant1Name'),
                  'participant2Name':(od.get('participants') or {}).get('participant2Name'),
                  'tournamentName':(od.get('tournament') or {}).get('tournamentName'),
                  'startTime':od.get('startTime'),
                  'bookmakerFixtureId':bm.get('bookmakerFixtureId'),
                  'fixturePath':bm.get('fixturePath'),
                  'hasOdds':bm.get('hasOdds'),
                  'suspended':bm.get('suspended'),
                  'total_goldbet_selections':len(raw),
                  'player_selection_count':len(rows),
                  'player_market_ids':sorted(market_ids),
                  'player_selections':rows,
              })

          outdir.joinpath('oddspapi-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          meta={
              'generated_at':now,
              'trigger_id':t.get('trigger_id'),
              'api':'OddsPapi v5',
              'bookmaker':bookmaker,
              'from':t.get('from'),'to':t.get('to'),'match_terms':terms,
          }
          outdir.joinpath('oddspapi-meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Commit OddsPapi feed
        run: |
          git config user.name "radar-goldbet-bot"
          git config user.email "radar-goldbet-bot@users.noreply.github.com"
          git add feed/oddspapi-summary.json feed/oddspapi-meta.json
          if git diff --cached --quiet; then
            echo "OddsPapi feed unchanged"
            exit 0
          fi
          git commit -m "Refresh OddsPapi v5 GoldBet player feed"
          git push
