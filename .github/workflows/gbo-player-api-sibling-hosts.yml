name: GBO player API sibling hosts probe

on:
  push:
    paths:
      - gbo-player-api-sibling-hosts-trigger.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe same AAMS event endpoint on sibling brands
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.error
          from datetime import datetime, timezone
          cfg=json.loads(pathlib.Path('gbo-player-api-sibling-hosts-trigger.json').read_text())
          path=cfg['path']
          hosts=cfg.get('hosts') or []
          results=[]
          for host in hosts:
              u='https://'+host+path
              req=urllib.request.Request(u,headers={'Accept':'application/json,text/plain,*/*','User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1','Referer':'https://'+host+'/'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      body=r.read().decode('utf-8','replace')
                      results.append({'host':host,'status':r.status,'content_type':r.headers.get('content-type'),'body':body[:30000]})
              except urllib.error.HTTPError as e:
                  results.append({'host':host,'status':e.code,'content_type':e.headers.get('content-type'),'body':e.read().decode('utf-8','replace')[:5000]})
              except Exception as e:
                  results.append({'host':host,'error':repr(e)})
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'path':path,'results':results}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/gbo-player-api-sibling-hosts.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit result
        run: |
          git config user.name "radar-goldbet-bot"
          git config user.email "radar-goldbet-bot@users.noreply.github.com"
          git add feed/gbo-player-api-sibling-hosts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe GBO sibling player API hosts"
          git push
