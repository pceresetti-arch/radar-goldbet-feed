name: Build Radar deep-analysis readiness

on:
  # Event-driven is the primary path. This low-frequency cron is only a safety net.
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows:
      - 'Enrich current lineups tactical'
      - 'Build player matchup context'
      - 'Radar BetFlag v7 live bridge'
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - 'deep-analysis-readiness-trigger.json'
      - 'scripts/build_deep_analysis_readiness.py'
      - 'scripts/hydrate_live_betflag_index.py'
      - 'scripts/filter_official_lineups_for_tactical.py'
      - 'RADAR_FULL_ANALYSIS_GATE_V2.md'

permissions:
  contents: write

concurrency:
  group: radar-deep-analysis-readiness
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Hydrate fresh BetFlag live index
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin betflag-live:refs/remotes/origin/betflag-live
          mkdir -p feed
          if ! git show origin/betflag-live:feed/betflag-residential-fixtures-index.json > feed/betflag-residential-fixtures-index.json; then
            echo 'Missing betflag-live fixture index: hard data gap' >&2
            exit 2
          fi
          if git show origin/betflag-live:feed/betflag-live-status.json > feed/betflag-live-status.json 2>/dev/null; then
            echo 'Hydrated live status'
          else
            echo 'Live status file unavailable; fixture index health remains authoritative for this build' >&2
          fi
          python scripts/hydrate_live_betflag_index.py

      - name: Rebuild certified-XI tactical input
        shell: bash
        run: |
          set -euo pipefail
          python scripts/filter_official_lineups_for_tactical.py

      - name: Build machine-readable BetFlag-only readiness gate
        run: python scripts/build_deep_analysis_readiness.py

      - name: Persist readiness safely
        shell: bash
        run: |
          set -e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          # Hydrated BetFlag/XI adapter files are runtime-only. Persist only readiness outputs.
          git reset -- feed/betflag-live-status.json feed/betflag-residential-fixtures-index.json feed/betflag-fixtures-index.json feed/lineups-official-for-tactical.json 2>/dev/null || true
          git add feed/deep-analysis-readiness.json feed/deep-analysis-readiness-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh deep-analysis readiness gate'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo 'Unable to persist readiness feed after retries' >&2
          exit 1
