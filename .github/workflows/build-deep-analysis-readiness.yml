name: Build Radar deep-analysis readiness

on:
  # Event-driven is the primary path. This low-frequency cron is only a safety net.
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows:
      - 'Enrich current lineups tactical'
      - 'Build player matchup context'
      - 'Player synergy position context'
      - 'Radar BetFlag v7 live bridge'
      - 'BetFlag market coverage audit'
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - 'deep-analysis-readiness-trigger.json'
      - 'scripts/build_deep_analysis_readiness.py'
      - 'scripts/build_deep_analysis_readiness_v3.py'
      - 'scripts/build_player_synergy_position_context.py'
      - 'scripts/enrich_player_synergy_position_context.py'
      - 'scripts/apply_player_final_gate_overlay.py'
      - 'scripts/enforce_full_analysis_gate_v2.py'
      - 'scripts/build_acquisition_recovery_queue.py'
      - 'scripts/harden_lineup_evidence.py'
      - 'scripts/validate_radar_pipeline.py'
      - 'scripts/hydrate_live_betflag_index.py'
      - 'scripts/filter_official_lineups_for_tactical.py'
      - 'RADAR_FULL_ANALYSIS_GATE_V2.md'
      - 'RADAR_DATA_ACQUISITION_HARDENING_V1.md'

permissions:
  contents: write

# Keep the active readiness build alive when bursts of upstream workflows finish.
# A newer pending run may replace an older pending run, but it must not cancel the
# run already computing/persisting the current XI + BetFlag + player context.
concurrency:
  group: radar-deep-analysis-readiness
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # Full history is unnecessary and costly in this bot-updated repository.
          # Keep enough recent ancestry for the persistence pull --rebase retries.
          fetch-depth: 20

      - name: Install synergy acquisition dependency
        run: pip install curl_cffi

      - name: Hydrate fresh BetFlag live index
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin betflag-live:refs/remotes/origin/betflag-live
          mkdir -p feed
          if ! git show origin/betflag-live:feed/betflag-residential-fixtures-index.json > feed/betflag-residential-fixtures-index.json; then
            echo 'Missing betflag-live fixture index: hard data gap' >&2
            exit 2
          fi
          if git show origin/betflag-live:feed/betflag-live-status.json > feed/betflag-live-status.json 2>/dev/null; then
            echo 'Hydrated live status'
          else
            echo 'Live status file unavailable; fixture index health remains authoritative for this build' >&2
          fi
          python scripts/hydrate_live_betflag_index.py

      - name: Harden lineup source evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/harden_lineup_evidence.py

      - name: Rebuild certified-XI tactical input
        shell: bash
        run: |
          set -euo pipefail
          python scripts/filter_official_lineups_for_tactical.py

      - name: Refresh player synergy and position context
        shell: bash
        run: |
          set +e
          python scripts/build_player_synergy_position_context.py
          build_rc=$?
          if [ $build_rc -ne 0 ]; then
            echo "Synergy acquisition returned rc=$build_rc; v3 readiness will use the last persisted artifact and mark the player lane stale if required." >&2
          fi
          if [ -f feed/player-synergy-position-current.json ]; then
            python scripts/enrich_player_synergy_position_context.py || echo 'Synergy enrichment failed; player lane will be gated by v3 readiness.' >&2
          else
            echo 'No synergy artifact available; player lane will be gated by v3 readiness.' >&2
          fi
          exit 0

      - name: Build source-aware BetFlag-only readiness gate
        run: python scripts/build_deep_analysis_readiness_v3.py

      - name: Apply per-player XI and scorer-allocation final gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_player_final_gate_overlay.py

      - name: Enforce hardened FULL-analysis gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/enforce_full_analysis_gate_v2.py

      - name: Build acquisition recovery queue
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_acquisition_recovery_queue.py

      - name: Validate Radar pipeline integrity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_radar_pipeline.py

      - name: Persist readiness safely
        shell: bash
        run: |
          set -e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          # Hydrated BetFlag adapter files are runtime-only. Persist XI hardening, synergy and audit outputs.
          git reset -- feed/betflag-live-status.json feed/betflag-residential-fixtures-index.json feed/betflag-fixtures-index.json feed/lineups-official-for-tactical.json 2>/dev/null || true
          git add feed/lineups-current.json feed/lineups-last-certified.json feed/player-synergy-position-current.json feed/player-synergy-position-current-summary.json feed/deep-analysis-readiness.json feed/deep-analysis-readiness-summary.json feed/acquisition-recovery-queue.json feed/radar-pipeline-validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh hardened XI synergy readiness and pipeline validation'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo 'Unable to persist readiness feed after retries' >&2
          exit 1
