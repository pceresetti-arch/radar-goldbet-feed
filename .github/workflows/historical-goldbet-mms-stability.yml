name: Historical GoldBet MMS Stability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/historical_goldbet_mms_stability.py"
      - ".github/workflows/historical-goldbet-mms-stability.yml"

permissions:
  contents: write

concurrency:
  group: historical-goldbet-mms-stability
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze MMS stability
        run: python tools/historical_goldbet_mms_stability.py
      - name: Commit evidence
        run: |
          git config user.name "radar-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed/historical/open-close/goldbet-mms-stability-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist GoldBet MMS stability audit"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
