name: Refresh current player props [LEGACY MANUAL]

# Radar V2 authoritative player path:
#   discovery -> BetFlag V7 /live/player-props
#   exact price -> BetFlag V7 /live/player-price
# player-props-current* remains cache/history only and must never gate a live run.
# Automatic legacy collection is retired to prevent duplicate polling, stale
# cache confusion, GitHub write collisions and failure-notification spam.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy_notice:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy player cache collector retired
        run: |
          echo "Automatic player-props cache refresh is retired in Radar V2."
          echo "Primary live discovery: BetFlag V7 /live/player-props."
          echo "Exact candidate certification: BetFlag V7 /live/player-price."
