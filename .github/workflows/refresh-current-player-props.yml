name: Refresh current player props

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'refresh-current-player-props-trigger.json'

permissions:
  contents: write

concurrency:
  group: refresh-current-player-props
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Fetch and normalize current player markets
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re, urllib.request, time, hashlib
          from datetime import datetime, timezone

          BASE='https://sportservice.betflag.it/api/sport/pregame'
          H={
            'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*',
            'x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0',
            'Origin':'https://www.betflag.it','Referer':'https://www.betflag.it/'
          }
          AGG_TOURNAMENT=1334500001  # Eventi Oggi-Domani
          TARGETS=[
            (2484,13825,'Marcatore Plus'),
            (2484,19405,'Marcatore o Sostituto'),
            (2484,22884,'Marc'),
            (2484,13819,'1° Marcatore'),
            (2484,19403,'1° Marcatore o Sostituto'),
            (2484,13820,'Marcatore 1T'),
            (2484,13826,'Marcatore 2T'),
            (2484,13821,'Doppietta'),
            (2484,13822,'Tripletta'),
            (2487,13509,'U/O Parate Giocatore'),
          ]

          def fetch(tab,slot):
            url=f'{BASE}/getOverviewEventsAams/0/-1/0/{AGG_TOURNAMENT}/{tab}/{slot}/0?channelId=0'
            req=urllib.request.Request(url,headers=H)
            try:
              with urllib.request.urlopen(req,timeout=35) as r:
                return r.status,json.loads(r.read(14000000).decode('utf-8','replace')),url,None
            except Exception as e:
              return None,{},url,type(e).__name__+': '+str(e)[:220]

          def parse_player_event_name(name):
            s=str(name or '').strip()
            m=re.match(r'^\(([^)]+)\)\s*(.*)$',s)
            return (m.group(1).strip(),m.group(2).strip()) if m else ('',s)

          def market_rows(event):
            rows=[]
            mm=event.get('mmkW')
            markets=mm.values() if isinstance(mm,dict) else (mm if isinstance(mm,list) else [])
            for market in markets:
              if not isinstance(market,dict): continue
              mn=str(market.get('mn') or '').strip()
              spd=market.get('spd')
              spreads=spd.items() if isinstance(spd,dict) else enumerate(spd or []) if isinstance(spd,list) else []
              for spread_key, spread in spreads:
                if not isinstance(spread,dict): continue
                for q in spread.get('asl') or []:
                  if not isinstance(q,dict): continue
                  rows.append({
                    'market':mn,
                    'line':None if str(spread_key)=='0.0' else spread_key,
                    'selection':q.get('sn'),
                    'odd':q.get('ov'),
                    'selection_id':q.get('si'),
                    'selection_type':q.get('sti'),
                    'market_type':q.get('mti'),
                    'market_id':q.get('mi'),
                    'odds_id':q.get('oi')
                  })
            return rows

          all_rows=[]; calls=[]; event_keys=set()
          now=datetime.now(timezone.utc).isoformat()
          for idx,(tab,slot,label) in enumerate(TARGETS):
            status,data,url,error=fetch(tab,slot)
            if idx: time.sleep(0.12)
            count_before=len(all_rows)
            seen_events=0
            def walk(x):
              nonlocal seen_events
              if isinstance(x,dict):
                if 'ei' in x and 'en' in x and str(x.get('sn','')).lower().startswith('giocatori'):
                  seen_events+=1
                  code,player=parse_player_event_name(x.get('en'))
                  base={
                    'event_id':x.get('ei'),'player_event':x.get('en'),'match_code':code,'player':player,
                    'start_time':x.get('ed'),'league':x.get('td'),'tournament_id':x.get('ti'),
                    'category_id':x.get('ci'),'authority_id':x.get('tai'),'match_market_id':x.get('mi'),
                    'source_sport':x.get('sn'),'source_category':x.get('cd'),'market_count_hint':x.get('nmK'),
                    'requested_tab':tab,'requested_slot':slot,'requested_market':label
                  }
                  odds=market_rows(x)
                  for o in odds:
                    if o.get('odd') is None: continue
                    row={**base,**o,'fetched_at':now}
                    key=(row['event_id'],row['market'],str(row['line']),row['selection'],row['odd'],row['odds_id'])
                    if key not in event_keys:
                      event_keys.add(key); all_rows.append(row)
                for v in x.values(): walk(v)
              elif isinstance(x,list):
                for v in x: walk(v)
            walk(data)
            calls.append({
              'tab':tab,'slot':slot,'label':label,'status':status,'error':error,
              'success':data.get('success') if isinstance(data,dict) else None,
              'tn':data.get('tn') if isinstance(data,dict) else None,
              'events_seen':seen_events,'rows_added':len(all_rows)-count_before,'url':url
            })

          all_rows.sort(key=lambda r:(str(r.get('start_time')),str(r.get('league')),str(r.get('match_code')),str(r.get('player')),str(r.get('market')),str(r.get('line')),str(r.get('selection'))))
          by_match={}
          for r in all_rows:
            k=r.get('match_code') or str(r.get('match_market_id'))
            m=by_match.setdefault(k,{'match_code':r.get('match_code'),'start_time':r.get('start_time'),'league':r.get('league'),'tournament_id':r.get('tournament_id'),'authority_id':r.get('authority_id'),'players':{}})
            p=m['players'].setdefault(r.get('player'),[])
            p.append({k:r.get(k) for k in ('market','line','selection','odd','event_id','selection_id','market_type','market_id','odds_id','requested_market')})

          payload_for_hash=[{k:v for k,v in r.items() if k!='fetched_at'} for r in all_rows]
          digest=hashlib.sha256(json.dumps(payload_for_hash,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          out={
            'generated_at':now,
            'source':'shared AAMS player service',
            'scope':'Eventi Oggi-Domani',
            'goldbet_alignment':'standard-market fingerprint STRONG_EXACT_MATCH; player prices not independently exposed by OddsPapi',
            'row_count':len(all_rows),'match_count':len(by_match),'content_sha256':digest,
            'calls':calls,'rows':all_rows
          }
          compact={
            'generated_at':now,'source':out['source'],'scope':out['scope'],'goldbet_alignment':out['goldbet_alignment'],
            'row_count':len(all_rows),'match_count':len(by_match),'content_sha256':digest,
            'calls':calls,'matches':list(by_match.values())
          }
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/player-props-current.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          pathlib.Path('feed/player-props-current-by-match.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:compact[k] for k in ('generated_at','row_count','match_count','content_sha256','calls')},ensure_ascii=False,indent=2))
          PY
      - name: Commit current feed
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/player-props-current.json feed/player-props-current-by-match.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh current player props feed'
          git push
