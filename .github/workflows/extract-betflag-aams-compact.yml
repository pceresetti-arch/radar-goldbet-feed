name: Extract compact Betflag AAMS callers

on:
  push:
    paths:
      - 'betflag-aams-compact-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract compact call contexts
        run: |
          python - <<'PY'
          import json,pathlib,re,urllib.request
          from datetime import datetime,timezone
          u='https://cdn-ltm.betflag.it/site/scripts/sport/bundle.min.js?263'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          low=text.lower(); needle='getdetailseventaams'
          contexts=[]
          for m in re.finditer(needle,low):
            contexts.append(text[max(0,m.start()-1800):m.end()+3500])
          # Keep only contexts where it appears to be invoked rather than solely defined.
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'count':len(contexts),'contexts':contexts[:20]}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/betflag-aams-calls-compact.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('count',len(contexts),'bytes',sum(len(x) for x in contexts[:20]))
          PY
      - name: Commit
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/betflag-aams-calls-compact.json
          git diff --cached --quiet && exit 0
          git commit -m 'Extract compact Betflag AAMS callers'
          git push
