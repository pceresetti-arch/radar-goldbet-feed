name: OddsPapi v5 GoldBet player scan

on:
  push:
    paths:
      - oddspapi-v5-player-scan-trigger.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan GoldBet player props via OddsPapi v5
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.parse, urllib.request
          from datetime import datetime, timezone

          key=os.environ.get('ODDSPAPI_KEY','').strip()
          if not key:
              raise SystemExit('Missing ODDSPAPI_KEY')

          base='https://v5.oddspapi.io/en'

          def get(path, params):
              p=dict(params)
              p['apiKey']=key
              url=base+path+'?'+urllib.parse.urlencode(p)
              req=urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'RadarGoldBet/3.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode())

          now=int(time.time())
          # Broad enough to include just-started and upcoming evening matches, but keep quota sane.
          fixtures=get('/fixtures', {
              'sportId':10,
              'bookmakers':'goldbet.it',
              'startTimeFrom':now-3*3600,
              'startTimeTo':now+7*3600
          })
          if isinstance(fixtures,dict):
              fixtures=fixtures.get('data') or fixtures.get('fixtures') or []
          if not isinstance(fixtures,list):
              fixtures=[]

          markets=get('/markets', {'sportId':10})
          if isinstance(markets,dict):
              markets=markets.get('data') or markets.get('markets') or []
          mmap={str(m.get('marketId')):m for m in markets if isinstance(m,dict)}

          results=[]
          checked=0
          failures=[]

          def event_name(f):
              p=f.get('participants') or {}
              a=p.get('participant1Name') or f.get('participant1Name') or '?'
              b=p.get('participant2Name') or f.get('participant2Name') or '?'
              return f'{a} - {b}'

          # Prefer fixtures closest to now.
          fixtures=sorted(fixtures, key=lambda f: abs(int(f.get('startTime') or now)-now))[:30]

          for f in fixtures:
              fid=f.get('fixtureId')
              if not fid: continue
              try:
                  od=get('/fixtures/odds', {'fixtureId':fid,'bookmakers':'goldbet.it'})
              except Exception as e:
                  failures.append({'fixtureId':fid,'event':event_name(f),'error':str(e)[:300]})
                  continue
              checked+=1
              bookmeta=(od.get('bookmakers') or {}).get('goldbet.it',{}) if isinstance(od,dict) else {}
              raw=(od.get('odds') or {}) if isinstance(od,dict) else {}
              # v5 shape is bookmaker -> oddsId -> selection. Be defensive for alternate wrappers.
              gb=raw.get('goldbet.it') if isinstance(raw,dict) else None
              if gb is None and isinstance(raw,dict):
                  # Sometimes the returned object is already the bookmaker selection map.
                  gb=raw
              rows=[]
              if isinstance(gb,dict):
                  for odds_id,sel in gb.items():
                      if not isinstance(sel,dict):
                          continue
                      mid=sel.get('marketId')
                      pid=sel.get('playerId')
                      meta=mmap.get(str(mid),{})
                      is_player=bool(meta.get('playerProp')) or (pid not in (None,0,'0'))
                      if is_player:
                          rows.append({
                              'oddsId':str(odds_id),
                              'marketId':mid,
                              'marketName':meta.get('marketName'),
                              'marketNameShort':meta.get('marketNameShort'),
                              'marketType':meta.get('marketType'),
                              'period':meta.get('period'),
                              'playerProp':bool(meta.get('playerProp')),
                              'playerId':pid,
                              'playerName':sel.get('playerName'),
                              'outcomeId':sel.get('outcomeId'),
                              'price':sel.get('price'),
                              'active':sel.get('active'),
                              'marketActive':sel.get('marketActive'),
                              'mainLine':sel.get('mainLine'),
                              'changedAt':sel.get('changedAt'),
                              'bookmakerOutcomeId':sel.get('bookmakerOutcomeId')
                          })
              results.append({
                  'fixtureId':fid,
                  'event':event_name(f),
                  'startTime':f.get('startTime'),
                  'status':f.get('status'),
                  'bookmakerFixtureId':bookmeta.get('bookmakerFixtureId'),
                  'fixturePath':bookmeta.get('fixturePath'),
                  'hasOdds':bookmeta.get('hasOdds'),
                  'selection_count':len(gb) if isinstance(gb,dict) else 0,
                  'player_selection_count':len(rows),
                  'player_selections':rows[:300]
              })
              # A handful of matches is enough once we have positive proof.
              if sum(x['player_selection_count'] for x in results)>=20:
                  break
              time.sleep(0.55)

          out={
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'api':'OddsPapi v5',
              'fixture_window':{'from':now-3*3600,'to':now+7*3600},
              'fixtures_returned':len(fixtures),
              'fixtures_checked':checked,
              'total_player_selections':sum(x['player_selection_count'] for x in results),
              'positive_fixtures':sum(1 for x in results if x['player_selection_count']>0),
              'results':results,
              'failures':failures[:20]
          }
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/oddspapi-v5-player-scan.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit result
        run: |
          git config user.name "radar-goldbet-bot"
          git config user.email "radar-goldbet-bot@users.noreply.github.com"
          git add feed/oddspapi-v5-player-scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Scan OddsPapi v5 GoldBet player props"
          git push
