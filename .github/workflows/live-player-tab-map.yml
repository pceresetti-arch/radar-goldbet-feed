name: Live Betflag player tab map

on:
  push:
    paths:
      - 'live-player-tab-map-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch one real detail response and map lmtW
        run: |
          python - <<'PY'
          import json,pathlib,urllib.request
          from datetime import datetime,timezone
          url='https://sportservice.betflag.it/api/sport/pregame/getDetailsEventAams/21/93/36351.2616/16037202/0/0?channelId=0'
          headers={
            'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*',
            'x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0',
            'Origin':'https://www.betflag.it','Referer':'https://www.betflag.it/'
          }
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r:
            body=r.read(1000000).decode('utf-8','replace'); status=r.status
          obj=json.loads(body)
          tabs=[]
          for t in obj.get('lmtW') or []:
            if not isinstance(t,dict): continue
            slots=[]
            for s in t.get('lotb') or []:
              if isinstance(s,dict):
                slots.append({k:s.get(k) for k in ('sn','ti','pl','ao','lt','img','isbb') if k in s})
            tabs.append({
              'tbN':t.get('tbN'),'tbI':t.get('tbI'),'si':t.get('si'),'img':t.get('img'),'lt':t.get('lt'),
              'pl':t.get('pl'),'ao':t.get('ao'),'isbb':t.get('isbb'),'slots':slots
            })
          candidates=[]
          for t in tabs:
            txt=json.dumps(t,ensure_ascii=False).lower()
            if t.get('pl') is True or any(s.get('pl') is True for s in t.get('slots',[])) or any(k in txt for k in ('player','giocator','marcat','scorer','assist','tiro','tiri')):
              candidates.append(t)
          out={
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'status':status,'success':obj.get('success'),'eventId':obj.get('eventId'),'tai':obj.get('tai'),
            'tab_count':len(tabs),'tabs':tabs,'player_candidate_tabs':candidates
          }
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/live-player-tab-map.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/live-player-tab-map.json
          git diff --cached --quiet && exit 0
          git commit -m 'Map live Betflag player tabs'
          git push
