name: Test Odds-API.io secret aliases

on:
  push:
    paths:
      - 'odds-api-io-secret-alias-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test configured aliases without exposing keys
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python - <<'PY'
          import os,json,pathlib,urllib.parse,urllib.request,urllib.error
          from datetime import datetime,timezone
          aliases=['ODDS_API_IO_KEY','ODDSPAPI_KEY','ODDS_API_KEY','API_KEY']
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'aliases':{}}
          for name in aliases:
            key=os.getenv(name,'').strip()
            rec={'configured':bool(key)}
            if key:
              url='https://api.odds-api.io/v3/events?'+urllib.parse.urlencode({'sport':'football','apiKey':key})
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'RadarSecretAliasTest/1.0'})
              try:
                with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read(2000).decode('utf-8','replace'); rec.update({'status':r.status,'body_prefix':body[:500]})
              except urllib.error.HTTPError as e:
                body=e.read(2000).decode('utf-8','replace'); rec.update({'status':e.code,'body_prefix':body[:500]})
              except Exception as e: rec['error']=type(e).__name__+': '+str(e)[:200]
            out['aliases'][name]=rec
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/odds-api-io-secret-alias-test.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/odds-api-io-secret-alias-test.json
          git diff --cached --quiet && exit 0
          git commit -m 'Test Odds-API.io secret aliases'
          git push
