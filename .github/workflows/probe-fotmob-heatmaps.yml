name: Probe FotMob heatmaps

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_fotmob_heatmaps.py'
      - 'heatmap-probe-trigger.json'

permissions:
  contents: write

concurrency:
  group: radar-fotmob-heatmap-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install browser-like client
        run: pip install -q curl_cffi
      - name: Probe FotMob heatmap payload
        run: python scripts/probe_fotmob_heatmaps.py
      - name: Persist probe safely
        shell: bash
        run: |
          set -e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/fotmob-heatmap-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Probe FotMob heatmap payload'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
