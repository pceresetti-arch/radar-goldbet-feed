name: Cloudflare deploy diagnostic

on:
  push:
    paths:
      - 'cloudflare-deploy-diagnostic-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ODSS_API_KEY: ${{ secrets.ODSS_API_KEY }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          out={k:bool(os.environ.get(k,'').strip()) for k in ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','ODSS_API_KEY','BRIDGE_TOKEN']}
          out['worker_source_exists']=pathlib.Path('worker/src/index.mjs').exists()
          out['wrangler_exists']=pathlib.Path('wrangler.toml').exists() or pathlib.Path('wrangler.jsonc').exists() or pathlib.Path('worker/wrangler.toml').exists() or pathlib.Path('worker/wrangler.jsonc').exists()
          out['root_files']=[p.name for p in pathlib.Path('.').iterdir() if p.name.startswith('wrangler')]
          out['worker_files']=[str(p) for p in pathlib.Path('worker').rglob('wrangler*')] if pathlib.Path('worker').exists() else []
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/cloudflare-deploy-diagnostic.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/cloudflare-deploy-diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'Diagnose Cloudflare Worker deploy prerequisites'
          git push
