name: Discover GoldBet public service hosts

on:
  push:
    paths:
      - 'goldbet-service-host-discovery-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan public GoldBet/Lottomatica config files
        run: |
          python - <<'PY'
          import json, pathlib, re, urllib.request, urllib.error
          from datetime import datetime, timezone

          bases=[
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/Config/gb/',
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/Config/gb/produzione/'
          ]
          names=[
            'config.json','configuration.json','appconfig.json','app-config.json','environment.json','env.json',
            'serviceconfig.json','services.json','sportconfig.json','sportserviceconfig.json','sportServiceConfiguration.json',
            'urls.json','endpoints.json','api.json','apis.json','settings.json','settings.prod.json',
            'scommesseconfig.json','marketconfig.json','baseSettingsPlayBetsJson.json'
          ]
          keywords=re.compile(r'(https?://[^\"\'<>\\s]+|(?:api|service|sport|aams|prematch|player|giocatori|marcatori|endpoint|host|url)[A-Za-z0-9_.:/?&=%-]*)',re.I)
          found=[]
          for base in bases:
            for name in names:
              url=base+name
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'})
              try:
                with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read().decode('utf-8','replace')
                  status=r.status
                  ctype=r.headers.get('content-type')
              except urllib.error.HTTPError as e:
                status=e.code; ctype=e.headers.get('content-type'); body=e.read().decode('utf-8','replace')[:1000]
              except Exception as e:
                found.append({'url':url,'error':repr(e)}); continue
              if status!=200: continue
              hits=[]
              for m in keywords.finditer(body):
                v=m.group(0)
                if v not in hits: hits.append(v)
                if len(hits)>=200: break
              found.append({'url':url,'status':status,'content_type':ctype,'bytes':len(body),'hits':hits,'sample':body[:10000]})
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'results':found}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/goldbet-service-host-discovery.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit discovery
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/goldbet-service-host-discovery.json
          git diff --cached --quiet && exit 0
          git commit -m 'Discover GoldBet service hosts'
          git push
