name: Extract Diretta GoldBet opening odds

on:
  push:
    paths:
      - 'diretta-goldbet-opening-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Extract Diretta Italian GoldBet opening/current odds
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, requests
          from datetime import datetime, timezone

          trigger={}
          try: trigger=json.loads(pathlib.Path('diretta-goldbet-opening-trigger.json').read_text(encoding='utf-8'))
          except: pass
          event_id=str(trigger.get('event_id') or 'xAQCcf1s')
          event=str(trigger.get('event') or 'Valencia - Real Betis')
          subdivision=str(trigger.get('subdivision') or 'IT21')
          base='https://global.ds.lsapp.eu/odds/pq_graphql'
          H={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139.0.0.0 Safari/537.36',
            'Accept':'*/*','Accept-Language':'it-IT,it;q=0.9,en;q=0.8',
            'Referer':'https://www.diretta.it/','Origin':'https://www.diretta.it',
            'Cache-Control':'no-cache','Pragma':'no-cache'
          }
          s=requests.Session(); s.headers.update(H)
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'event_id':event_id,'event':event,'geo':'IT','subdivision':subdivision,'projectId':400,'menu_hash':'pobtm','detail_hash':'ope2'}

          def get(params):
            r=s.get(base,params=params,timeout=25)
            data=None
            if r.status_code==200:
              try:data=r.json()
              except:pass
            return r,data

          # Current Diretta.it Italian bookmaker/market menu. Subdivision is required.
          r,data=get({'_hash':'pobtm','eventId':event_id,'projectId':'400','geoIpCode':'IT','geoIpSubdivisionCode':subdivision})
          out['menu_status']=r.status_code; out['menu_url']=r.url; out['menu_body_prefix']=r.text[:1200]
          menu=((data or {}).get('data') or {}).get('getPrematchOddsBettingTypeMenu') or {}
          settings=(menu.get('settings') or {}) if isinstance(menu,dict) else {}
          bookmakers=[]
          for be in settings.get('bookmakers') or []:
            inn=(be or {}).get('bookmaker') or {}
            bid=inn.get('id'); name=inn.get('name')
            if bid is not None and name: bookmakers.append({'id':bid,'name':name})
          out['bookmakers']=bookmakers
          gold=[b for b in bookmakers if 'gold' in str(b.get('name') or '').lower()]
          out['goldbet_candidates']=gold
          items=[]
          for it in menu.get('items') or []:
            if not isinstance(it,dict): continue
            items.append({'bettingType':it.get('bettingType'),'bettingScope':it.get('bettingScope'),'isDefault':it.get('isDefault'),'bookmakerIds':it.get('bookmakerIds')})
          out['market_menu']=items

          rows=[]
          if gold:
            gold.sort(key=lambda x:(0 if str(x['name']).lower() in ('goldbet','gold bet') else 1, str(x['name'])))
            gb=gold[0]; gbid=str(gb['id']); out['goldbet_selected']=gb
            seen=set()
            # Query every market/scope that Diretta declares available for GoldBet.
            for it in items:
              bt=it.get('bettingType'); bs=it.get('bettingScope'); ids=[str(x) for x in (it.get('bookmakerIds') or [])]
              if not bt or not bs or (bt,bs) in seen or (ids and gbid not in ids): continue
              seen.add((bt,bs))
              params={'_hash':'ope2','eventId':event_id,'bookmakerId':gbid,'betType':bt,'betScope':bs}
              rr,dd=get(params)
              payload=((dd or {}).get('data') or {}).get('findPrematchOddsForBookmaker') if isinstance(dd,dict) else None
              rec={'bettingType':bt,'bettingScope':bs,'status':rr.status_code,'url':rr.url,'payload':payload}
              rows.append(rec)
          out['goldbet_markets']=rows
          out['goldbet_market_count']=sum(1 for x in rows if x.get('payload') is not None)
          out['true_open_available']=any('opening' in json.dumps(x.get('payload'),ensure_ascii=False) for x in rows if x.get('payload') is not None)
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/diretta-goldbet-opening.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'menu_status':out.get('menu_status'),'goldbet':out.get('goldbet_selected'),'goldbet_market_count':out['goldbet_market_count'],'true_open_available':out['true_open_available'],'markets':rows},ensure_ascii=False,indent=2)[:50000])
          PY
      - name: Commit result
        if: always()
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          [ -f feed/diretta-goldbet-opening.json ] || echo '{"status":"no_result"}' > feed/diretta-goldbet-opening.json
          git pull --rebase || true
          git add feed/diretta-goldbet-opening.json
          git diff --cached --quiet && exit 0
          git commit -m 'Extract Diretta GoldBet opening odds'
          git push
