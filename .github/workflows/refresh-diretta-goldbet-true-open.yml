name: Refresh Diretta GoldBet TRUE OPEN

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'diretta-true-open-trigger.json'

permissions:
  contents: write

concurrency:
  group: radar-diretta-true-open
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
      - name: Build GoldBet TRUE OPEN index from Diretta
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, difflib, json, pathlib, re, unicodedata, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta

          NOW=datetime.now(timezone.utc); NOW_ISO=NOW.isoformat()
          OUT=pathlib.Path('feed/diretta-goldbet-true-open-index.json')
          MOV=pathlib.Path('feed/odds-movement-state.json')
          try: old=json.loads(OUT.read_text(encoding='utf-8')) if OUT.exists() else {}
          except: old={}
          old_events=old.get('events') if isinstance(old,dict) else {}
          if not isinstance(old_events,dict): old_events={}

          def parse_dt(s):
            try:return datetime.fromisoformat(str(s).replace('Z','+00:00')).astimezone(timezone.utc)
            except:return None
          def norm(s):
            s=unicodedata.normalize('NFKD',str(s or '')).encode('ascii','ignore').decode().lower()
            aliases={
              'real betis':'betis','athletico pr':'atletico pr','athletico paranaense':'atletico paranaense',
              'internazionale':'inter','fc internazionale':'inter','ac milan':'milan','ssc napoli':'napoli',
              'as roma':'roma','ss lazio':'lazio','parma calcio':'parma','cagliari calcio':'cagliari',
              'udinese calcio':'udinese','hellas verona':'verona','torino fc':'torino','juventus fc':'juventus'
            }
            for a,b in aliases.items():s=s.replace(a,b)
            toks=re.findall(r'[a-z0-9]+',s)
            stop={'fc','cf','ac','sc','afc','calcio','club','de','da','do','the'}
            return ' '.join(t for t in toks if t not in stop)
          def side_score(a,b):
            a=norm(a); b=norm(b)
            if not a or not b:return 0
            seq=difflib.SequenceMatcher(None,a,b).ratio()
            A=set(a.split());B=set(b.split()); jac=len(A&B)/max(1,len(A|B))
            contain=1.0 if a in b or b in a else 0.0
            return max(seq,.65*seq+.35*jac,.75*seq+.25*contain)
          def split_event(name):
            s=str(name or '')
            if ' - ' in s:return tuple(s.split(' - ',1))
            if ' – ' in s:return tuple(s.split(' – ',1))
            return (s,'')

          targets={}
          try:
            mv=json.loads(MOV.read_text(encoding='utf-8'))
            for r in (mv.get('records') or {}).values():
              if not isinstance(r,dict) or r.get('source')!='GOLDBET_DIRECT_STANDARD':continue
              st=parse_dt(r.get('start_time'))
              if not st or st < NOW+timedelta(minutes=5) or st > NOW+timedelta(hours=48):continue
              eid=str(r.get('event_id') or '')
              if not eid:continue
              targets.setdefault(eid,{'event_id':eid,'event':r.get('event'),'league':r.get('league'),'start_time':r.get('start_time')})
          except Exception as e:
            raise SystemExit('Cannot read movement state: '+repr(e))

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139.0.0.0 Safari/537.36'
          def http(url,headers=None,cap=8000000):
            h={'User-Agent':UA,'Accept':'*/*','Accept-Language':'it-IT,it;q=0.9,en;q=0.8','Referer':'https://www.diretta.it/','x-fsign':'SW9D1eZo'}
            if headers:h.update(headers)
            req=urllib.request.Request(url,headers=h)
            try:
              with urllib.request.urlopen(req,timeout=25) as r:return r.status,r.read(cap).decode('utf-8','replace')
            except urllib.error.HTTPError as e:return e.code,e.read(100000).decode('utf-8','replace')
            except Exception:return None,''

          feed_urls=[
            'https://www.flashscore.com/x/feed/f_1_0_3_en_1',
            'https://www.flashscore.com/x/feed/f_1_0_3_it_1',
            'https://local-global.flashscore.ninja/2/x/feed/f_1_0_3_it_1'
          ]
          feed=''; feed_url=None; feed_statuses=[]
          for u in feed_urls:
            st,body=http(u)
            feed_statuses.append({'url':u,'status':st,'bytes':len(body)})
            if st==200 and 'AA÷' in body:
              feed=body; feed_url=u; break
          if not feed:raise SystemExit('Flashscore football feed unavailable: '+json.dumps(feed_statuses))

          def fields(sec):
            d={}
            for p in sec.split(chr(0xAC)):
              if chr(0xF7) in p:
                k,_,v=p.partition(chr(0xF7));d[k]=v
            return d
          fs=[]; tourn=''
          for sec in feed.split('~'):
            f=fields(sec)
            if 'ZA' in f:tourn=f.get('ZA','')
            if 'AA' in f and ('AE' in f or 'AF' in f):
              try:ts=int(f.get('AD') or 0)
              except:ts=0
              if ts:fs.append({'id':f.get('AA'),'home':f.get('AE'),'away':f.get('AF'),'ts':ts,'tournament':tourn})

          matched=[]; unmatched=[]
          for t in sorted(targets.values(),key=lambda x:x['start_time']):
            th,ta=split_event(t['event']); td=parse_dt(t['start_time']); best=None
            for f in fs:
              fd=datetime.fromtimestamp(f['ts'],timezone.utc); dm=abs((fd-td).total_seconds())/60
              if dm>20:continue
              hs=side_score(th,f['home']);as_=side_score(ta,f['away']);score=.5*hs+.5*as_
              if min(hs,as_)<.48:continue
              cand=(score,-dm,hs,as_,f)
              if best is None or cand[:2]>best[:2]:best=cand
            if best and best[0]>=.62:
              score,negdm,hs,as_,f=best
              matched.append({**t,'flashscore_event_id':f['id'],'flashscore_home':f['home'],'flashscore_away':f['away'],'flashscore_tournament':f['tournament'],'match_score':round(score,4),'home_score':round(hs,4),'away_score':round(as_,4),'time_diff_min':round(-negdm,1)})
            else:unmatched.append(t)

          base='https://global.ds.lsapp.eu/odds/pq_graphql'
          H={'User-Agent':UA,'Accept':'*/*','Accept-Language':'it-IT,it;q=0.9,en;q=0.8','Referer':'https://www.diretta.it/','Origin':'https://www.diretta.it'}
          def api(params):
            url=base+'?'+urllib.parse.urlencode(params); st,body=http(url,H,3000000)
            try:d=json.loads(body) if st==200 else None
            except:d=None
            return st,d
          def flatten(bt,payload):
            rows=[]
            def add(sel,item,line=None):
              if not isinstance(item,dict) or item.get('opening') in (None,''):return
              try:op=float(item.get('opening'))
              except:return
              try:cur=float(item.get('value')) if item.get('value') not in (None,'') else None
              except:cur=None
              rows.append({'market':bt,'period':'full_time','line':line,'selection':sel,'true_open':op,'diretta_current':cur,'change':item.get('change')})
            if bt=='HOME_DRAW_AWAY':
              add('HOME',payload.get('home'));add('DRAW',payload.get('draw'));add('AWAY',payload.get('away'))
            elif bt=='OVER_UNDER':
              for opp in payload.get('opportunities') or []:
                if not isinstance(opp,dict):continue
                h=opp.get('handicap') or {}; line=h.get('value')
                try:line=float(line)
                except:pass
                add('OVER',opp.get('over'),line);add('UNDER',opp.get('under'),line)
            elif bt=='BOTH_TEAMS_TO_SCORE':
              add('YES',payload.get('yes'));add('NO',payload.get('no'))
            elif bt=='DOUBLE_CHANCE':
              for k,sel in [('homeDraw','HOME_DRAW'),('homeAway','HOME_AWAY'),('drawAway','DRAW_AWAY')]:add(sel,payload.get(k))
            return rows

          todo=[]
          for m in matched:
            prev=old_events.get(m['event_id'])
            if isinstance(prev,dict) and prev.get('status')=='TRUE_OPEN_CERTIFIED' and prev.get('rows'):continue
            todo.append(m)
          todo=todo[:80]

          def one(m):
            fid=m['flashscore_event_id']
            st,md=api({'_hash':'pobtm','eventId':fid,'projectId':'400','geoIpCode':'IT','geoIpSubdivisionCode':'IT21'})
            menu=((md or {}).get('data') or {}).get('getPrematchOddsBettingTypeMenu') or {} if isinstance(md,dict) else {}
            bks=[]
            for be in ((menu.get('settings') or {}).get('bookmakers') or []):
              inn=(be or {}).get('bookmaker') or {}
              if inn.get('id') is not None and inn.get('name'):bks.append({'id':inn['id'],'name':inn['name']})
            gb=next((b for b in bks if str(b['name']).lower()=='goldbet'),None) or next((b for b in bks if 'gold' in str(b['name']).lower()),None)
            rec={**m,'attempted_at':NOW_ISO,'menu_status':st,'bookmaker':gb,'rows':[],'status':'NO_GOLDBET' if not gb else 'PARTIAL'}
            if not gb:return rec
            gbid=str(gb['id']); seen=set()
            for it in menu.get('items') or []:
              if not isinstance(it,dict):continue
              bt=it.get('bettingType');bs=it.get('bettingScope');ids=[str(x) for x in (it.get('bookmakerIds') or [])]
              if not bt or not bs or bs!='FULL_TIME' or bt not in ('HOME_DRAW_AWAY','OVER_UNDER','BOTH_TEAMS_TO_SCORE','DOUBLE_CHANCE') or (bt,bs) in seen:continue
              if ids and gbid not in ids:continue
              seen.add((bt,bs)); _,dd=api({'_hash':'ope2','eventId':fid,'bookmakerId':gbid,'betType':bt,'betScope':bs})
              payload=((dd or {}).get('data') or {}).get('findPrematchOddsForBookmaker') if isinstance(dd,dict) else None
              if isinstance(payload,dict):rec['rows'].extend(flatten(bt,payload))
            if rec['rows']:
              rec['status']='TRUE_OPEN_CERTIFIED';rec['source']='Diretta/Flashscore ope2';rec['certified_at']=NOW_ISO
            return rec

          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:fresh=list(ex.map(one,todo)) if todo else []
          events=dict(old_events)
          for r in fresh:events[r['event_id']]=r
          keep={}
          for eid,r in events.items():
            dt=parse_dt(r.get('start_time'))
            if dt and dt>=NOW-timedelta(days=7):keep[eid]=r
          events=keep
          out={'generated_at':NOW_ISO,'method':'Diretta project 400 / Italy IT21 / GoldBet bookmakerId from menu / ope2 opening','source':'Diretta/Flashscore','bookmaker':'GoldBet','bookmaker_id_expected':188,'feed_url':feed_url,'feed_statuses':feed_statuses,'target_count':len(targets),'flashscore_event_count':len(fs),'matched_count':len(matched),'unmatched_count':len(unmatched),'queried_this_run':len(todo),'certified_this_run':sum(1 for x in fresh if x.get('status')=='TRUE_OPEN_CERTIFIED'),'certified_total':sum(1 for x in events.values() if x.get('status')=='TRUE_OPEN_CERTIFIED'),'unmatched':unmatched[:80],'events':events}
          OUT.parent.mkdir(exist_ok=True);OUT.write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps({k:out[k] for k in ('feed_url','target_count','flashscore_event_count','matched_count','unmatched_count','queried_this_run','certified_this_run','certified_total')},ensure_ascii=False,indent=2))
          PY
      - name: Commit TRUE OPEN index
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git pull --rebase || true
          git add feed/diretta-goldbet-true-open-index.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Diretta GoldBet TRUE OPEN index'
          git push
