name: Repair BetFlag discovery completeness

on:
  push:
    paths:
      - '.github/workflows/repair-betflag-discovery-v8.yml'
      - 'scripts/repair_betflag_discovery_v8.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 10
      - name: Apply discovery patch
        run: python scripts/repair_betflag_discovery_v8.py
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add worker/src/index.mjs .github/workflows/radar-betflag-v7-live-bridge.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Fix BetFlag full discovery pagination and player search'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
