name: Deploy radar-goldbet Worker

on:
  push:
    paths:
      - 'cloudflare-deploy-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy patched Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live player-prop forwarding
        env:
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          from datetime import datetime, timezone

          base='https://radar-goldbet.p-ceresetti.workers.dev'
          token=os.environ.get('BRIDGE_TOKEN','').strip()
          if not token:
              raise SystemExit('Missing GitHub secret BRIDGE_TOKEN')

          def get(path, params=None):
              url=base+path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'RadarPostDeployVerify/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return r.status, json.loads(r.read().decode('utf-8','replace'))

          hs, health=get('/health')
          ps, player=get('/odds', {
              'token':token,
              'bookmakers':'goldbet',
              'state':'prematch',
              'content':'player',
              'limit':'500',
              'offset':'0'
          })

          rows=player.get('odds',[]) if isinstance(player,dict) else []
          player_rows=[x for x in rows if isinstance(x,dict) and x.get('player')]
          markets=sorted({str(x.get('market')) for x in player_rows if x.get('market')})
          samples=[]
          for x in player_rows[:30]:
              samples.append({
                  'event_id':x.get('event_id'),
                  'event':x.get('event'),
                  'market':x.get('market'),
                  'line':x.get('line'),
                  'scope':x.get('scope'),
                  'period':x.get('period'),
                  'player':x.get('player'),
                  'player_id':x.get('player_id'),
                  'bookmakers':x.get('bookmakers')
              })

          out={
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'health_status':hs,
              'health_version':health.get('version') if isinstance(health,dict) else None,
              'player_props_forwarding':health.get('player_props_forwarding') if isinstance(health,dict) else None,
              'odds_status':ps,
              'response_count':player.get('count') if isinstance(player,dict) else None,
              'returned':player.get('returned') if isinstance(player,dict) else None,
              'player_row_count':len(player_rows),
              'unique_player_markets':markets,
              'samples':samples
          }

          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/live-player-props-verification.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')

          if hs != 200 or out['health_version'] != '5.0-player-props':
              raise SystemExit('Patched Worker health contract not live')
          print(json.dumps({k:v for k,v in out.items() if k!='samples'},ensure_ascii=False,indent=2))
          PY

      - name: Commit verification result
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/live-player-props-verification.json
          git diff --cached --quiet && exit 0
          git commit -m 'Verify live GoldBet player props'
          git push
