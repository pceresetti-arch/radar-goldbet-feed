name: BetFlag fixture identity probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/betflag-mapping-probe.yml'
      - 'collector/betflag_mapping_probe.py'
      - 'betflag-mapping-probe-trigger.json'

permissions:
  contents: write

concurrency:
  group: betflag-mapping-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, windows, betflag-residential]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure transport dependency
        shell: powershell
        run: python -m pip install --disable-pip-version-check playwright
      - name: Probe exact BetFlag identity fields
        shell: powershell
        run: python collector/betflag_mapping_probe.py
      - name: Commit probe
        shell: powershell
        run: |
          git config user.name "radar-betflag-residential-bot"
          git config user.email "radar-betflag-residential-bot@users.noreply.github.com"
          git add feed/betflag-mapping-probe.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record BetFlag fixture identity probe"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
