name: Summarize corrected player AAMS result

on:
  push:
    paths:
      - 'correct-player-aams-summary-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Produce compact player-only summary
        run: |
          python - <<'PY'
          import json,pathlib
          src=json.loads(pathlib.Path('feed/correct-player-aams-pipeline.json').read_text(encoding='utf-8'))
          def mini(x):
            return {
              'candidate_tai':x.get('candidate_tai'),'tab':x.get('tab'),'slot':x.get('slot'),'section':x.get('section'),
              'status':x.get('status'),'bytes':x.get('bytes'),'success':x.get('success'),'tai':x.get('tai'),'tn':x.get('tn'),
              'leo_count':x.get('leo_count'),'lmtW_count':x.get('lmtW_count'),'eventId':x.get('eventId'),
              'events':(x.get('events') or [])[:15],
              'market_names':(x.get('market_names') or [])[:100],
              'selection_samples':(x.get('selection_samples') or [])[:120],
              'tabs':(x.get('tabs') or [])[:60],
              'player_signal_count':x.get('player_signal_count'),
              'player_hits':(x.get('player_hits') or [])[:80],
              'error':x.get('error')
            }
          out={
            'player_overviews':[mini(x) for x in src.get('player_overviews',[])],
            'best_details':[mini(x)|{'event':x.get('event'),'macroTab':x.get('macroTab'),'source_overview':x.get('source_overview')} for x in src.get('best_details',[])],
            'detail_attempts_count':src.get('detail_attempts_count')
          }
          pathlib.Path('feed/correct-player-aams-player-only.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:60000])
          PY
      - name: Commit
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/correct-player-aams-player-only.json
          git diff --cached --quiet && exit 0
          git commit -m 'Summarize corrected player AAMS result'
          git push
