name: Compare GoldBet and shared sportservice prices

on:
  push:
    paths:
      - 'compare-goldbet-shared-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare identical events and 1X2 prices
        env:
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, re, unicodedata, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          token=os.environ.get('BRIDGE_TOKEN','').strip()
          if not token: raise SystemExit('Missing BRIDGE_TOKEN')

          targets=[
            ('Milan','Venezia'),
            ('Real Madrid','Real Sociedad'),
            ('Cagliari','Inter'),
            ('Barcellona','Athletic Bilbao'),
            ('Juventus','Parma'),
            ('Bayern Monaco','Stoccarda')
          ]

          def norm(s):
            s=unicodedata.normalize('NFKD',str(s)).encode('ascii','ignore').decode().lower()
            s=s.replace('barcelona','barcellona').replace('bayern munich','bayern monaco').replace('stuttgart','stoccarda')
            return re.sub(r'[^a-z0-9]+',' ',s).strip()

          def matches(name,a,b):
            n=norm(name); aa=norm(a); bb=norm(b)
            return all(tok in n for tok in aa.split()[-2:]) and all(tok in n for tok in bb.split()[-2:])

          # Shared sportservice current snapshot.
          sh_headers={
            'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*',
            'x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0',
            'Origin':'https://www.betflag.it','Referer':'https://www.betflag.it/'
          }
          req=urllib.request.Request('https://sportservice.betflag.it/api/sport/pregame/getOverviewDefault/1?channelId=0',headers=sh_headers)
          with urllib.request.urlopen(req,timeout=30) as r:
            shared=json.loads(r.read(8000000).decode('utf-8','replace'))

          shared_events=[]
          def walk_shared(x):
            if isinstance(x,dict):
              if 'ei' in x and 'en' in x:
                prices=[]
                mm=x.get('mmkW')
                vals=mm.values() if isinstance(mm,dict) else (mm if isinstance(mm,list) else [])
                for m in vals:
                  if not isinstance(m,dict) or str(m.get('mn','')).strip().upper()!='1X2': continue
                  spd=m.get('spd'); spreads=spd.values() if isinstance(spd,dict) else (spd if isinstance(spd,list) else [])
                  for s in spreads:
                    if isinstance(s,dict):
                      prices=[(q.get('sn'),q.get('ov')) for q in (s.get('asl') or []) if isinstance(q,dict)]
                shared_events.append({'ei':x.get('ei'),'en':x.get('en'),'ti':x.get('ti'),'tai':x.get('tai'),'mi':x.get('mi'),'1x2':prices})
              for v in x.values(): walk_shared(v)
            elif isinstance(x,list):
              for v in x: walk_shared(v)
          walk_shared(shared)

          # GoldBet bridge: scan every page to avoid first-2000 blind spot.
          bridge='https://radar-goldbet.p-ceresetti.workers.dev/odds'
          all_rows=[]; offset=0; page_meta=[]
          for _ in range(12):
            qs=urllib.parse.urlencode({'token':token,'bookmakers':'goldbet','state':'prematch','limit':'2000','offset':str(offset)})
            req=urllib.request.Request(bridge+'?'+qs,headers={'Accept':'application/json','User-Agent':'RadarGoldBetCompare/1.0'})
            with urllib.request.urlopen(req,timeout=90) as r:
              data=json.loads(r.read().decode('utf-8','replace'))
            rows=data.get('odds',[]) if isinstance(data,dict) else []
            all_rows.extend(rows)
            page_meta.append({'offset':offset,'returned':len(rows),'count':data.get('count') if isinstance(data,dict) else None})
            if len(rows)<2000: break
            offset+=len(rows)

          def event_name(row):
            for k in ('event','event_name','name','match','fixture'):
              if row.get(k): return str(row[k])
            home=row.get('home') or row.get('home_team') or row.get('team_home')
            away=row.get('away') or row.get('away_team') or row.get('team_away')
            return f'{home} - {away}' if home or away else ''

          def extract_goldbet_prices(row):
            # Preserve raw relevant fields; bridge schemas have varied during development.
            out={k:row.get(k) for k in ('event_id','event','event_name','home','away','market','market_name','line','scope','period','selection','name','price','odd','odds') if k in row}
            bm=row.get('bookmakers')
            if isinstance(bm,dict):
              out['bookmakers']=bm
            elif isinstance(bm,list):
              out['bookmakers']=bm
            return out

          comparison=[]
          for a,b in targets:
            se=[e for e in shared_events if matches(e.get('en',''),a,b)]
            gr=[]
            for row in all_rows:
              if not isinstance(row,dict): continue
              if not matches(event_name(row),a,b): continue
              m=str(row.get('market') or row.get('market_name') or '').lower()
              # keep all rows for the event; comparator below highlights 1X2-like records
              gr.append(extract_goldbet_prices(row))
            one_x_two=[]
            for r in gr:
              m=str(r.get('market') or r.get('market_name') or '').lower()
              if any(k in m for k in ('1x2','moneyline','match winner','esito finale')):
                one_x_two.append(r)
            comparison.append({'target':f'{a} - {b}','shared':se[:5],'goldbet_rows':gr[:120],'goldbet_1x2_rows':one_x_two[:40],'goldbet_row_count':len(gr)})

          out={
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'bridge_pages':page_meta,
            'bridge_total_rows':len(all_rows),
            'comparison':comparison
          }
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/goldbet-vs-shared-prices.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          compact={'bridge_total_rows':len(all_rows),'comparison':[{
            'target':x['target'],'shared':x['shared'],'goldbet_row_count':x['goldbet_row_count'],'goldbet_1x2_rows':x['goldbet_1x2_rows']
          } for x in comparison]}
          pathlib.Path('feed/goldbet-vs-shared-prices-summary.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(compact,ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Commit comparison
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/goldbet-vs-shared-prices.json feed/goldbet-vs-shared-prices-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'Compare GoldBet and shared sportservice prices'
          git push
