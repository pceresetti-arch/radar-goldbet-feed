name: Historical GoldBet Fixture MMS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/historical_goldbet_fixture_level_mms.py"
      - ".github/workflows/historical-goldbet-fixture-mms.yml"

permissions:
  contents: write

concurrency:
  group: historical-goldbet-fixture-mms
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze fixture-level MMS
        run: python tools/historical_goldbet_fixture_level_mms.py
      - name: Commit evidence
        run: |
          git config user.name "radar-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed/historical/open-close/goldbet-fixture-level-mms-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist fixture-level GoldBet MMS diagnostic"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
