name: Diagnose player detail markets

on:
  push:
    paths:
      - 'diagnose-player-detail-markets-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect all markets for one real player event
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,urllib.request,re
          from datetime import datetime,timezone
          t=json.loads(pathlib.Path('diagnose-player-detail-markets-trigger.json').read_text())
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0','Origin':'https://www.betflag.it','Referer':'https://www.betflag.it/'}
          B='https://sportservice.betflag.it/api/sport/pregame'
          url=f"{B}/getDetailsEventAams/{t['tai']}/{t['ti']}/{t['mi']}/{t['ei']}/0/0?channelId=0"
          with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=35) as r:data=json.loads(r.read(12000000).decode('utf-8','replace'))
          markets=[];tabs=[];slots=[];sels=[];hits=[]
          words=('assist','tir','porta','gol','marcat','sost','parate','fall','cartell','pass','contr','fuorigioco','mvp')
          def walk(x,path='root'):
            if isinstance(x,dict):
              if isinstance(x.get('mn'),str):
                markets.append(x.get('mn'))
                if any(w in x.get('mn').lower() for w in words): hits.append({'kind':'market','path':path,'name':x.get('mn'),'obj':{k:x.get(k) for k in ('mn','slI','sslI','pl','ao','lt')}})
              if 'tbI' in x and 'tbN' in x: tabs.append({k:x.get(k) for k in ('tbI','tbN','pl','isbb','si')})
              if 'slI' in x and ('slN' in x or 'sn' in x): slots.append({k:x.get(k) for k in ('slI','slN','sn','pl','ao','lt')})
              if isinstance(x.get('sn'),str) and 'ov' in x:
                sels.append({k:x.get(k) for k in ('sn','ov','si','sti','mti','mi','oi')})
                if any(w in x.get('sn').lower() for w in words): hits.append({'kind':'selection','path':path,'name':x.get('sn'),'odd':x.get('ov')})
              for k,v in x.items():walk(v,path+'.'+str(k))
            elif isinstance(x,list):
              for i,v in enumerate(x):walk(v,path+f'[{i}]')
          walk(data)
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'target':t,'url':url,'success':data.get('success') if isinstance(data,dict) else None,'root_keys':list(data.keys()) if isinstance(data,dict) else None,'market_count':len(set(markets)),'market_names':list(dict.fromkeys(markets)),'tabs':list({(x.get('tbI'),x.get('tbN')):x for x in tabs}.values()),'slots':list({(x.get('slI'),x.get('slN') or x.get('sn')):x for x in slots}.values()),'selection_count':len(sels),'selection_samples':sels[:200],'relevant_hits':hits[:400]}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/player-detail-market-diagnostic.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:60000])
          PY
      - name: Commit
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/player-detail-market-diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'Diagnose all markets for real player event'
          git push
