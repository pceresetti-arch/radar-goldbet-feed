name: Compact BetFlag live index

on:
  push:
    paths:
      - 'radar-betflag-v7-live-summary-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build compact upcoming player-prop summary
        run: |
          python - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          src=json.loads(pathlib.Path('feed/radar-betflag-v7-live-response.json').read_text())
          calls=src.get('calls') or []
          body=(calls[0].get('body') if calls and isinstance(calls[0],dict) else {}) or {}
          rome=ZoneInfo('Europe/Rome'); now_rome=datetime.now(rome)
          fixtures=[]; shortlist=[]
          for f in body.get('fixtures') or []:
              st=f.get('start_time'); dt=None
              if st:
                  s=str(st).strip()
                  for parser in ('iso','dmy'):
                      try:
                          if parser=='iso':
                              dt=datetime.fromisoformat(s.replace('Z','+00:00'))
                              if dt.tzinfo is None: dt=dt.replace(tzinfo=rome)
                              dt=dt.astimezone(rome)
                          else:
                              dt=datetime.strptime(s,'%d-%m-%Y %H:%M').replace(tzinfo=rome)
                          break
                      except Exception: dt=None
              if not dt or dt <= now_rome: continue
              allrows=[]; markets_present=set()
              for p in f.get('players') or []:
                  for m in p.get('markets') or []:
                      mk=m.get('market'); markets_present.add(str(mk))
                      for q in m.get('quotes') or []:
                          if q.get('odd') is None: continue
                          allrows.append({'player':p.get('player'),'market':mk,'line':q.get('line'),'selection':q.get('selection'),'odd':q.get('odd')})
              # retain the most market-relevant/short-priced rows per family for fast human/model review
              priority=['Marc','Marcatore o Sostituto','Marcatore Plus','Marcatore 1T','Marcatore 2T','1° Marcatore','Gol e Assist','Assist','U/O Tiri Totali Giocatore','U/O Tiri In Porta Giocatore','U/O Tiri Totali Plus','U/O Tiri in porta Plus']
              top={}
              for mk in priority:
                  rows=[r for r in allrows if r['market']==mk]
                  def k(r):
                      try: return float(r['odd'])
                      except: return 99999
                  rows.sort(key=k)
                  if rows: top[mk]=rows[:8]
              rec={'match_market_id':f.get('match_market_id'),'match_event_id':f.get('match_event_id'),'match':f.get('match'),'start_rome':dt.isoformat(),'league':f.get('league'),'markets_present':sorted(markets_present),'top_quotes':top,'quote_rows':len(allrows)}
              fixtures.append(rec)
          fixtures.sort(key=lambda x:x['start_rome'])
          out={'generated_at':src.get('generated_at'),'request_id':src.get('request_id'),'health_contract_ok':src.get('health_contract_ok'),'index_generated_at':body.get('generated_at'),'source_healthy':body.get('source_healthy'),'freshness':body.get('freshness'),'coverage_complete':body.get('coverage_complete'),'coverage':body.get('coverage'),'asof_rome':now_rome.isoformat(),'upcoming_fixture_count':len(fixtures),'fixtures':fixtures}
          p=pathlib.Path('feed/radar-betflag-v7-live-upcoming-summary.json'); p.write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit compact summary
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/radar-betflag-v7-live-upcoming-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'Compact live BetFlag upcoming player index'
          git pull --rebase origin main
          git push origin HEAD:main
