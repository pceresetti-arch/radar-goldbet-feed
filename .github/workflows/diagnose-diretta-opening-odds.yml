name: Diagnose Diretta/Flashscore opening odds

on:
  workflow_dispatch:
  push:
    paths:
      - 'diretta-opening-trigger.json'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Probe football odds feed for current and opening prices
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, urllib.parse, urllib.request, urllib.error, time
          from datetime import datetime, timezone

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36'
          H={
            'User-Agent':UA,
            'Accept':'*/*',
            'Accept-Language':'it-IT,it;q=0.9,en;q=0.8',
            'Referer':'https://www.flashscore.it/',
            'Origin':'https://www.flashscore.it',
            'x-fsign':'SW9D1eZo',
          }

          def get(url, cap=8000000):
            req=urllib.request.Request(url,headers=H)
            try:
              with urllib.request.urlopen(req,timeout=25) as r:
                raw=r.read(cap)
                return {'status':r.status,'ctype':r.headers.get('content-type'),'body':raw.decode('utf-8','replace')}
            except urllib.error.HTTPError as e:
              return {'status':e.code,'ctype':e.headers.get('content-type'),'body':e.read(200000).decode('utf-8','replace')}
            except Exception as e:
              return {'status':None,'error':type(e).__name__+': '+str(e),'body':''}

          # Flashscore football feed, today + upcoming.
          feed_urls=[
            'https://www.flashscore.com/x/feed/f_1_0_3_en_1',
            'https://www.flashscore.com/x/feed/f_1_0_3_it_1',
            'https://local-global.flashscore.ninja/2/x/feed/f_1_0_3_it_1',
          ]
          feed=None; feed_url=None
          for u in feed_urls:
            rec=get(u)
            if rec.get('status')==200 and 'AA÷' in rec.get('body',''):
              feed=rec['body']; feed_url=u; break

          def parse_fields(section):
            out={}
            for part in section.split(chr(0xAC)):
              if chr(0xF7) in part:
                k,_,v=part.partition(chr(0xF7)); out[k]=v
            return out

          events=[]; current_tournament=''
          if feed:
            for sec in feed.split('~'):
              f=parse_fields(sec)
              if 'ZA' in f: current_tournament=f.get('ZA','')
              if 'AA' in f and ('AE' in f or 'AF' in f):
                try: ts=int(f.get('AD') or 0)
                except: ts=0
                events.append({'event_id':f.get('AA'),'home':f.get('AE'),'away':f.get('AF'),'start_ts':ts,'tournament':current_tournament,'status':f.get('AB')})

          now_ts=int(datetime.now(timezone.utc).timestamp())
          upcoming=[e for e in events if e['start_ts']>=now_ts-3600]
          upcoming.sort(key=lambda x:x['start_ts'])
          chosen=upcoming[:12]

          probes=[]; bookmaker_names=set(); goldbet_hits=[]; opening_examples=[]
          for ev in chosen:
            best=None
            for hsh in ('ope','oce'):
              params={'_hash':hsh,'eventId':ev['event_id'],'projectId':'2','geoIpCode':'IT'}
              url='https://global.ds.lsapp.eu/odds/pq_graphql?'+urllib.parse.urlencode(params)
              rec=get(url)
              item={'hash':hsh,'status':rec.get('status'),'error':rec.get('error')}
              if rec.get('status')==200:
                try:
                  data=json.loads(rec['body'])
                  eo=((data.get('data') or {}).get('findOddsByEventId') or {})
                  item['top_keys']=list(eo.keys())[:20] if isinstance(eo,dict) else []
                  if isinstance(eo,dict) and eo:
                    best=eo; item['usable']=True
                except Exception as e:
                  item['parse_error']=type(e).__name__+': '+str(e)
              probes.append({'event':ev,'probe':item})
              if best: break
            if not best: continue

            bmap={}
            for be in ((best.get('settings') or {}).get('bookmakers') or []):
              inner=(be or {}).get('bookmaker') or {}
              bid=str(inner.get('id') or '')
              name=str(inner.get('name') or '')
              if bid: bmap[bid]=name
              if name: bookmaker_names.add(name)

            for market in best.get('odds') or []:
              if not isinstance(market,dict): continue
              bid=str(market.get('bookmakerId') or '')
              bname=bmap.get(bid,'')
              odds=market.get('odds') or []
              vals=[]
              for o in odds:
                if not isinstance(o,dict): continue
                vals.append({'value':o.get('value'),'opening':o.get('opening'),'movement':o.get('movement')})
              row={
                'event':f"{ev.get('home')} - {ev.get('away')}",
                'event_id':ev.get('event_id'),
                'bookmaker_id':bid,
                'bookmaker_name':bname,
                'betting_type':market.get('bettingType'),
                'betting_scope':market.get('bettingScope'),
                'line':market.get('handicap'),
                'odds':vals,
              }
              if any(v.get('opening') not in (None,'') for v in vals): opening_examples.append(row)
              if 'gold' in bname.lower(): goldbet_hits.append(row)

          out={
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'feed_url':feed_url,
            'feed_event_count':len(events),
            'chosen_events':chosen,
            'probe_count':len(probes),
            'bookmakers':sorted(bookmaker_names),
            'goldbet_market_rows':goldbet_hits[:100],
            'opening_examples':opening_examples[:150],
            'opening_example_count':len(opening_examples),
            'goldbet_market_row_count':len(goldbet_hits),
            'probes':probes[:40],
          }
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/diretta-opening-diagnostic.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:out[k] for k in ('feed_url','feed_event_count','opening_example_count','goldbet_market_row_count','bookmakers')},ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Commit diagnostic
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/diretta-opening-diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'Diagnose Diretta opening odds feed'
          git push
