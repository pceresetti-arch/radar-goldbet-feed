name: OddsPapi v4 soccer player market catalog

on:
  push:
    paths:
      - oddspapi-v4-soccer-player-markets-trigger.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch v4 soccer player market catalog
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          from datetime import datetime, timezone
          key=os.environ.get('ODDSPAPI_KEY','').strip()
          url='https://api.oddspapi.io/v4/markets?'+urllib.parse.urlencode({'apiKey':key,'language':'en'})
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'RadarGoldBet/4.2'})
          with urllib.request.urlopen(req,timeout=90) as r: data=json.loads(r.read().decode())
          rows=data if isinstance(data,list) else data.get('data',[]) if isinstance(data,dict) else []
          soccer=[m for m in rows if isinstance(m,dict) and int(m.get('sportId') or -1)==10]
          pp=[m for m in soccer if bool(m.get('playerProp'))]
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'all_markets':len(rows),'soccer_markets':len(soccer),'soccer_player_prop_markets':len(pp),'player_prop_markets':pp}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/oddspapi-v4-soccer-player-markets.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit catalog
        run: |
          git config user.name "radar-goldbet-bot"
          git config user.email "radar-goldbet-bot@users.noreply.github.com"
          git add feed/oddspapi-v4-soccer-player-markets.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inspect OddsPapi v4 soccer player markets"
          git push
