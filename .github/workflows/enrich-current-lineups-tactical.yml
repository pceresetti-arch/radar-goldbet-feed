name: Enrich current lineups tactical

on:
  workflow_run:
    workflows: ["Refresh current lineups"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - 'tactical-lineup-trigger.json'

permissions:
  contents: write

concurrency:
  group: enrich-current-lineups-tactical
  cancel-in-progress: true

jobs:
  enrich:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Build tactical positioning feed
        run: python scripts/enrich_lineups_tactical.py
      - name: Cross-check inferred roles with provider usual positions
        run: python scripts/add_tactical_role_sanity.py
      - name: Commit tactical lineup feed safely
        shell: bash
        run: |
          set -e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/lineups-tactical-current.json feed/lineups-tactical-current-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh tactical lineup positioning'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo 'Unable to persist tactical lineup feed after retries' >&2
          exit 1
