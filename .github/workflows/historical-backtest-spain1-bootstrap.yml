name: Historical Backtest Spain 1 Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/historical-backtest-spain1-bootstrap.yml'
      - 'tools/historical_ingest_spain1.py'
      - 'tools/historical_build_spain1_baseline.py'
      - 'tools/historical_model_spain1_structural.py'

permissions:
  contents: write

concurrency:
  group: historical-backtest-spain1-bootstrap
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and profile Spain 1 historical source
        run: python tools/historical_ingest_spain1.py
      - name: Build frozen Spain 1 baseline
        run: python tools/historical_build_spain1_baseline.py
      - name: Build Spain 1 structural OOS model
        run: python tools/historical_model_spain1_structural.py
      - name: Preserve generated evidence
        run: |
          rm -rf /tmp/spain1-history
          cp -R feed/historical/spain1 /tmp/spain1-history
      - name: Commit historical discovery evidence
        run: |
          git config user.name "radar-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf feed/historical/spain1
            mkdir -p feed/historical
            cp -R /tmp/spain1-history feed/historical/spain1
            git add feed/historical/spain1
            if git diff --cached --quiet; then
              echo "No discovery changes"
              exit 0
            fi
            git commit -m "Update Spain 1 historical source discovery"
            if git push; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
