name: BetFlag browser recovery

on:
  push:
    paths:
      - 'betflag-browser-recovery-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: betflag-browser-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser collector
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect BetFlag browser session and player APIs
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json, pathlib, re
          from datetime import datetime, timezone
          from playwright.async_api import async_playwright

          OUT={'generated_at':datetime.now(timezone.utc).isoformat(),'page':{},'responses':[],'direct':[]}
          PLAYER_MARKETS=[('scorer',2484,22884),('goal_assist',2484,13824),('assist',2484,13823),('scorer_1h',2484,13820),('scorer_2h',2484,13826),('shots_on_target',2484,13495),('shots_total',2484,13496)]
          AGG=1334500001

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--disable-blink-features=AutomationControlled'])
              ctx=await browser.new_context(
                locale='it-IT', timezone_id='Europe/Rome',
                user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
                viewport={'width':1440,'height':1100},
                extra_http_headers={'Accept-Language':'it-IT,it;q=0.9,en;q=0.8'}
              )
              page=await ctx.new_page()
              async def on_response(resp):
                u=resp.url
                if '/api/sport/' in u or 'sportservice.betflag.it' in u:
                  row={'url':u,'status':resp.status,'content_type':resp.headers.get('content-type')}
                  try:
                    if 'application/json' in (row['content_type'] or ''):
                      txt=await resp.text(); row['body_preview']=txt[:1500]
                  except Exception as e: row['read_error']=repr(e)
                  OUT['responses'].append(row)
              page.on('response',on_response)
              try:
                r=await page.goto('https://www.betflag.it/sport',wait_until='domcontentloaded',timeout=60000)
                OUT['page']['initial_status']=r.status if r else None
                OUT['page']['url']=page.url
                OUT['page']['title']=await page.title()
                await page.wait_for_timeout(8000)
              except Exception as e:
                OUT['page']['error']=repr(e)

              cookies=await ctx.cookies()
              OUT['page']['cookies']=[{'name':c['name'],'domain':c['domain']} for c in cookies]

              # Execute API fetches inside the established browser context so browser cookies,
              # origin and TLS/client characteristics are preserved.
              for name,tab,slot in PLAYER_MARKETS:
                url=f'https://sportservice.betflag.it/api/sport/pregame/getOverviewEventsAams/0/-1/0/{AGG}/{tab}/{slot}/0?channelId=0'
                try:
                  res=await page.evaluate("""async ({url}) => {
                    const r=await fetch(url,{credentials:'include',headers:{'Accept':'application/json,text/plain,*/*','x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0'}});
                    return {status:r.status,ctype:r.headers.get('content-type'),text:(await r.text()).slice(0,4000)};
                  }""",{'url':url})
                  OUT['direct'].append({'name':name,'url':url,**res})
                except Exception as e:
                  OUT['direct'].append({'name':name,'url':url,'error':repr(e)})

              # Also test same-origin proxy and program endpoint.
              for name,url in [
                ('program_same_origin','https://www.betflag.it/api/sport/pregame/getProgram?channelId=0'),
                ('program_service','https://sportservice.betflag.it/api/sport/pregame/getProgram?channelId=0')]:
                try:
                  res=await page.evaluate("""async ({url}) => {const r=await fetch(url,{credentials:'include',headers:{'Accept':'application/json,text/plain,*/*','x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0'}});return {status:r.status,ctype:r.headers.get('content-type'),text:(await r.text()).slice(0,4000)};}""",{'url':url})
                  OUT['direct'].append({'name':name,'url':url,**res})
                except Exception as e: OUT['direct'].append({'name':name,'url':url,'error':repr(e)})
              await browser.close()

          asyncio.run(main())
          p=pathlib.Path('feed/betflag-browser-recovery-latest.json'); p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps(OUT,ensure_ascii=False,indent=2))
          print(json.dumps(OUT,ensure_ascii=False,indent=2))
          PY
      - name: Commit recovery diagnostic
        shell: bash
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/betflag-browser-recovery-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record BetFlag browser recovery diagnostic'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main || { git fetch origin main; git rebase origin/main; git push origin HEAD:main; }
