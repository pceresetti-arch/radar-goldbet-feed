name: Historical GoldBet 1X2 Drift Decomposition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/historical_goldbet_1x2_drift_decomposition.py
      - .github/workflows/historical-goldbet-1x2-drift-decomposition.yml

permissions:
  contents: write

concurrency:
  group: historical-goldbet-1x2-drift-decomposition
  cancel-in-progress: false

jobs:
  decompose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run drift decomposition
        run: python tools/historical_goldbet_1x2_drift_decomposition.py
      - name: Commit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/historical/open-close/goldbet-1x2-drift-decomposition-v1.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "historical: decompose GoldBet 1X2 timing drift"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
