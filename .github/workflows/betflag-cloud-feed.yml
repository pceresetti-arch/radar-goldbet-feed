name: BetFlag cloud fixture feed

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/betflag-cloud-feed.yml'
      - 'collector/betflag_residential_collector.py'
      - 'collector/betflag_standard_market_collector.py'
      - 'collector/betflag_hot_feed.py'

permissions:
  contents: write

concurrency:
  group: betflag-cloud-fixture-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect BetFlag player markets
        run: python collector/betflag_residential_collector.py
      - name: Collect BetFlag standard markets
        run: python collector/betflag_standard_market_collector.py
      - name: Build per-fixture BetFlag feeds
        run: python collector/betflag_hot_feed.py
      - name: Commit cloud BetFlag feeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-betflag-cloud-bot'
          git config user.email 'radar-betflag-cloud-bot@users.noreply.github.com'
          git add feed/betflag-residential-current.json feed/betflag-opening-field-diagnostics.json feed/betflag-standard-current.json feed/betflag-hot-feed.json feed/betflag-fixtures-index.json feed/betflag-fixtures
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh cloud BetFlag fixture feeds'
          for i in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((i*2))
          done
          exit 1
