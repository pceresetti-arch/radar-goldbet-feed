name: Patch and deploy BetFlag standard Worker (legacy manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-deploy-betflag-standard
  cancel-in-progress: false

jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Patch Worker standard BetFlag endpoint
        run: |
          python scripts/patch_betflag_standard_worker.py
          python scripts/patch_betflag_exact_event_identity.py

      - name: Syntax check Worker
        run: node --check worker/src/index.mjs

      - name: Deploy BetFlag v7 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config wrangler.v7.jsonc

      - name: Verify standard and player BetFlag endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,urllib.request,urllib.parse
          from datetime import datetime
          from zoneinfo import ZoneInfo
          base='https://radar-betflag-v7.p-ceresetti.workers.dev'
          date=datetime.now(ZoneInfo('Europe/Rome')).strftime('%d-%m-%Y')
          def get(path):
              req=urllib.request.Request(base+path,headers={'Accept':'application/json','Cache-Control':'no-cache','User-Agent':'RadarVerify/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.status,json.loads(r.read().decode())
          last=None
          for _ in range(8):
              try:
                  hs,h=get('/health?cb='+str(int(time.time()*1000)))
                  ss,s=get('/live/standard-index?'+urllib.parse.urlencode({'date':date,'cb':int(time.time()*1000)}))
                  ps,p=get('/live/player-index?'+urllib.parse.urlencode({'date':date,'cb':int(time.time()*1000)}))
                  last={'health':h,'standard':{'status':ss,'healthy':s.get('source_healthy'),'fixtures':(s.get('coverage') or {}).get('fixtures'),'freshness':s.get('freshness')},'player':{'status':ps,'healthy':p.get('source_healthy'),'fixtures':(p.get('coverage') or {}).get('fixtures'),'freshness':p.get('freshness')}}
                  print(json.dumps(last,ensure_ascii=False,indent=2))
                  if hs==200 and ss==200 and ps==200 and s.get('source_healthy') and (s.get('coverage') or {}).get('fixtures',0)>0 and p.get('source_healthy'):
                      raise SystemExit(0)
              except Exception as e:
                  last={'error':repr(e)}
              time.sleep(5)
          print(json.dumps(last,ensure_ascii=False,indent=2))
          raise SystemExit('BetFlag standard Worker verification failed')
          PY

      - name: Commit Worker patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add worker/src/index.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Apply BetFlag Worker patches'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*2))
          done
          exit 1
