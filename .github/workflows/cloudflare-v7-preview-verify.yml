name: Cloudflare v7 preview verify

on:
  push:
    paths:
      - '.github/workflows/cloudflare-v7-preview-verify.yml'
      - 'cloudflare-v7-preview-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5

      - name: Upload isolated v7 preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p feed
          npx --yes wrangler@4 versions upload --name radar-goldbet --preview-alias v7check --message "Radar v7 isolated preview verification" --keep-vars 2>&1 | tee feed/cloudflare-v7-preview-upload.txt
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.error, time
          from datetime import datetime, timezone

          base='https://v7check-radar-goldbet.p-ceresetti.workers.dev/health'
          attempts=[]
          final=None
          for attempt in range(1,9):
              url=f'{base}?cb={int(time.time()*1000)}-{attempt}'
              req=urllib.request.Request(url,headers={
                  'Accept':'application/json',
                  'User-Agent':'RadarV7PreviewVerify/2.0',
                  'Cache-Control':'no-cache, no-store, max-age=0',
                  'Pragma':'no-cache'
              })
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8','replace'); status=r.status; headers=dict(r.headers.items())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace'); status=e.code; headers=dict(e.headers.items())
              try: body=json.loads(raw)
              except Exception: body={'raw':raw[:2000]}
              verified=(
                  status==200 and isinstance(body,dict) and
                  body.get('version')=='7.0-betflag-operational' and
                  body.get('public_fast_path') is True and
                  body.get('exact_player_price_proof') is True
              )
              item={'attempt':attempt,'url':url,'status':status,'body':body,'headers':headers,'v7_verified':verified}
              attempts.append(item); final=item
              print(json.dumps(item,ensure_ascii=False))
              if verified: break
              time.sleep(5)
          out={
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'preview_base':base,
              'attempts':attempts,
              'final':final,
              'v7_verified':bool(final and final.get('v7_verified'))
          }
          pathlib.Path('feed/cloudflare-v7-preview-status.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['v7_verified']:
              raise SystemExit('v7 preview did not verify after retries')
          PY

      - name: Commit preview status
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/cloudflare-v7-preview-upload.txt feed/cloudflare-v7-preview-status.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Record isolated Cloudflare v7 preview status'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
