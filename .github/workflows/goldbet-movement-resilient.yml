name: GoldBet movement resilient

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'radar-movement-request.json'
      - 'goldbet-movement-resilient-trigger.json'
      - 'scripts/goldbet_diretta_on_demand.py'

permissions:
  contents: write

concurrency:
  group: goldbet-movement-resilient
  cancel-in-progress: true

jobs:
  capture-and-query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 10

      - name: Recover GoldBet TRUE OPEN and capture same-bookmaker current
        run: python scripts/goldbet_diretta_on_demand.py

      - name: Commit compact GoldBet movement proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/goldbet-diretta-movement-state.json feed/radar-movement-diretta-current.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh targeted GoldBet movement proof'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*2))
          done
          exit 1
