name: OddsPapi v4 GoldBet player probe

on:
  push:
    paths:
      - oddspapi-v4-player-probe-trigger.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe GoldBet player props on selected fixtures
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          from datetime import datetime, timezone

          key=os.environ.get('ODDSPAPI_KEY','').strip()
          if not key:
              raise SystemExit('Missing ODDSPAPI_KEY')

          cfg=json.loads(pathlib.Path('oddspapi-v4-player-probe-trigger.json').read_text())
          fixture_ids=cfg.get('fixtureIds') or []
          base='https://api.oddspapi.io/v4'

          def get(path, params):
              p=dict(params); p['apiKey']=key
              req=urllib.request.Request(base+path+'?'+urllib.parse.urlencode(p),headers={'Accept':'application/json','User-Agent':'RadarGoldBet/4.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return json.loads(r.read().decode())

          markets=get('/markets',{'language':'en'})
          cat=markets if isinstance(markets,list) else markets.get('data',[]) if isinstance(markets,dict) else []
          mmap={str(m.get('marketId')):m for m in cat if isinstance(m,dict)}

          out=[]
          for fid in fixture_ids:
              try:
                  odds=get('/odds',{'fixtureId':fid,'bookmakers':'goldbet.it','language':'en','oddsFormat':'decimal','verbosity':3})
                  book=(odds.get('bookmakerOdds') or {}).get('goldbet.it',{}) if isinstance(odds,dict) else {}
                  raw=book.get('markets') or {}
                  rows=[]
                  player_markets=[]
                  for mid,md in raw.items():
                      meta=mmap.get(str(mid),{})
                      if meta.get('playerProp'):
                          player_markets.append({'marketId':str(mid),'marketName':meta.get('marketName'),'marketType':meta.get('marketType'),'period':meta.get('period')})
                      outcomes=(md or {}).get('outcomes') or {}
                      for oid,od in outcomes.items():
                          players=(od or {}).get('players') or {}
                          for pid,sel in players.items():
                              if not isinstance(sel,dict):
                                  continue
                              if sel.get('playerName') or str(pid) not in ('0','None',''):
                                  rows.append({
                                      'marketId':str(mid),
                                      'marketName':meta.get('marketName'),
                                      'marketType':meta.get('marketType'),
                                      'period':meta.get('period'),
                                      'playerProp':bool(meta.get('playerProp')),
                                      'outcomeId':str(oid),
                                      'playerId':str(pid),
                                      'playerName':sel.get('playerName'),
                                      'price':sel.get('price'),
                                      'active':sel.get('active'),
                                      'bookmakerOutcomeId':sel.get('bookmakerOutcomeId')
                                  })
                  out.append({
                      'fixtureId':fid,
                      'participant1Name':odds.get('participant1Name'),
                      'participant2Name':odds.get('participant2Name'),
                      'tournamentName':odds.get('tournamentName'),
                      'categoryName':odds.get('categoryName'),
                      'bookmakerFixtureId':book.get('bookmakerFixtureId'),
                      'fixturePath':book.get('fixturePath'),
                      'market_count':len(raw),
                      'player_prop_market_count':len(player_markets),
                      'player_prop_markets':player_markets,
                      'player_selection_count':len(rows),
                      'player_selections':rows[:500]
                  })
              except Exception as e:
                  out.append({'fixtureId':fid,'error':repr(e)})

          result={
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'bookmaker':'goldbet.it',
              'fixtures_tested':len(fixture_ids),
              'positive_fixtures':sum(1 for x in out if x.get('player_selection_count',0)>0),
              'total_player_selections':sum(x.get('player_selection_count',0) for x in out),
              'results':out
          }
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/oddspapi-v4-player-probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit probe result
        run: |
          git config user.name "radar-goldbet-bot"
          git config user.email "radar-goldbet-bot@users.noreply.github.com"
          git add feed/oddspapi-v4-player-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe GoldBet player props via OddsPapi v4"
          git push
