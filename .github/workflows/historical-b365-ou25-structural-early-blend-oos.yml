name: Historical B365 Early O/U Structural Blend OOS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/historical-b365-ou25-structural-early-blend-oos.yml'
      - 'tools/historical_b365_ou25_structural_early_blend_oos.py'

permissions:
  contents: write

concurrency:
  group: historical-b365-ou25-structural-early-blend-oos
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select structural blend on development and freeze holdout
        run: python tools/historical_b365_ou25_structural_early_blend_oos.py
      - name: Preserve evidence
        run: |
          rm -rf /tmp/historical-markets
          cp -R feed/historical/markets /tmp/historical-markets
      - name: Commit evidence
        run: |
          git config user.name "radar-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p feed/historical
            rm -rf feed/historical/markets
            cp -R /tmp/historical-markets feed/historical/markets
            git add feed/historical/markets
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Add B365 early O/U structural blend OOS evidence"
            if git push; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
