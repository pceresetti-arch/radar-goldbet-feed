name: Force Cloudflare Worker version deploy

on:
  push:
    paths:
      - 'cloudflare-force-deploy-trigger.json'

permissions:
  contents: write

jobs:
  force-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5

      - name: Force selected Worker version to 100 percent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request, urllib.error
          from datetime import datetime, timezone

          req = json.loads(pathlib.Path('cloudflare-force-deploy-trigger.json').read_text())
          version_id = req['version_id']
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          script = 'radar-goldbet'
          api = f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{script}/deployments'
          body = json.dumps({
              'strategy':'percentage',
              'versions':[{'version_id':version_id,'percentage':100}],
              'annotations':{
                  'workers/message':'Force Radar v7 to 100% traffic',
                  'workers/triggered_by':'github-actions-reconcile'
              }
          }).encode()
          http_req = urllib.request.Request(api, data=body, method='POST', headers={
              'Authorization':f'Bearer {token}',
              'Content-Type':'application/json',
              'User-Agent':'RadarCloudflareReconcile/1.0'
          })
          try:
              with urllib.request.urlopen(http_req, timeout=45) as r:
                  deploy_body = json.loads(r.read().decode())
                  deploy_status = r.status
          except urllib.error.HTTPError as e:
              deploy_body = json.loads(e.read().decode('utf-8','replace'))
              deploy_status = e.code

          base='https://radar-goldbet.p-ceresetti.workers.dev'
          health=[]
          final_body=None
          for i in range(1,9):
              url=f'{base}/health?reconcile={int(time.time()*1000)}-{i}'
              hreq=urllib.request.Request(url, headers={'Accept':'application/json','Cache-Control':'no-cache','User-Agent':'RadarCloudflareReconcile/1.0'})
              try:
                  with urllib.request.urlopen(hreq,timeout=30) as r:
                      raw=r.read().decode('utf-8','replace')
                      try: hb=json.loads(raw)
                      except Exception: hb={'raw':raw[:1000]}
                      hs=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: hb=json.loads(raw)
                  except Exception: hb={'raw':raw[:1000]}
                  hs=e.code
              final_body=hb
              health.append({'attempt':i,'status':hs,'body':hb})
              if hs == 200 and isinstance(hb,dict) and hb.get('version') == '7.0-betflag-operational' and hb.get('exact_player_price_proof') is True:
                  break
              time.sleep(4)

          out={
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'requested_version_id':version_id,
              'deployment_http_status':deploy_status,
              'deployment_success':bool(deploy_body.get('success')) if isinstance(deploy_body,dict) else False,
              'deployment_result':deploy_body.get('result') if isinstance(deploy_body,dict) else None,
              'health_attempts':health,
              'live_verified':isinstance(final_body,dict) and final_body.get('version') == '7.0-betflag-operational' and final_body.get('exact_player_price_proof') is True
          }
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/cloudflare-force-deploy-status.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['deployment_success'] or not out['live_verified']:
              raise SystemExit('Forced Cloudflare version deployment did not verify v7 live')
          PY

      - name: Commit reconcile status
        if: always()
        run: |
          set -e
          [ -f feed/cloudflare-force-deploy-status.json ] || exit 0
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/cloudflare-force-deploy-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record forced Cloudflare Worker deployment status'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
