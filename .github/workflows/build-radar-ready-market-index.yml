name: Build Radar-ready market index [LEGACY PROXY MANUAL]

# Historical adapter built from player-props-current*/player-props-live-index.json.
# Those inputs are cross-brand proxy/cache data and are NOT price-gate eligible.
# The authoritative live player path is BetFlag V7/residential + exact player price.
# Keep this workflow only for forensic/manual compatibility.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-radar-ready-market-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build compact legacy Radar market input
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone

          idx_path=pathlib.Path('feed/player-props-live-index.json')
          if not idx_path.exists():
              raise SystemExit('missing feed/player-props-live-index.json')
          idx=json.loads(idx_path.read_text(encoding='utf-8'))
          generated=idx.get('generated_at')
          matches=[]
          for m in idx.get('matches',[]):
              markets=m.get('markets') or {}
              matches.append({
                  'match':m.get('match'),
                  'match_code':m.get('match_code'),
                  'match_event_id':m.get('match_event_id'),
                  'match_market_id':m.get('match_market_id'),
                  'start_time':m.get('start_time'),
                  'league':m.get('league'),
                  'player_count':m.get('player_count'),
                  'row_count':m.get('row_count'),
                  'markets':markets,
                  'market_names':sorted(markets.keys()),
                  'has_scorer':any(x in markets for x in ['Marc','Marcatore Plus','Marcatore o Sostituto','Marcatore 1T','Marcatore 2T']),
                  'has_assists':any(x in markets for x in ['Assist','Assist o Sostituto','Gol e Assist']),
                  'has_shots':any('Tiri' in x for x in markets),
                  'feed_file':m.get('file')
              })
          out={
              'generated_at':generated,
              'built_at':datetime.now(timezone.utc).isoformat(),
              'source':'LEGACY Radar Unico cross-brand player-props adapter',
              'authoritative_live':False,
              'price_gate_eligible':False,
              'decision_contract':'RADAR_UNICO_OPERATIONAL_CONTRACT.md',
              'goldbet_status':'legacy cross-brand proxy only; never use as direct BetFlag/GoldBet player price',
              'match_count':len(matches),
              'matches':matches
          }
          pathlib.Path('feed/radar-ready-market-index.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'match_count':len(matches),'generated_at':generated,'price_gate_eligible':False},ensure_ascii=False))
          PY
      - name: Commit legacy Radar-ready index
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/radar-ready-market-index.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh legacy proxy Radar-ready market index'
          git push
