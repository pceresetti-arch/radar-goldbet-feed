name: Historical GoldBet Snapshot Hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/historical_goldbet_snapshot_hygiene.py
      - .github/workflows/historical-goldbet-snapshot-hygiene.yml

permissions:
  contents: write
concurrency:
  group: historical-goldbet-snapshot-hygiene
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit snapshot hygiene
        run: python tools/historical_goldbet_snapshot_hygiene.py
      - name: Commit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/historical/open-close/goldbet-snapshot-hygiene-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "historical: quarantine GoldBet post-kickoff snapshots"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
