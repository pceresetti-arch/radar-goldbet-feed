name: BetFlag egress matrix probe

on:
  push:
    paths:
      - 'betflag-egress-matrix-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Probe BetFlag scorer
        shell: python
        run: |
          import json,urllib.request,urllib.error,pathlib,platform,socket
          from datetime import datetime,timezone
          url='https://sportservice.betflag.it/api/sport/pregame/getOverviewEventsAams/0/-1/0/1334500001/2484/22884/0?channelId=0'
          h={'Accept':'application/json,text/plain,*/*','x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0','Origin':'https://www.betflag.it','Referer':'https://www.betflag.it/','User-Agent':'Mozilla/5.0'}
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'os':platform.platform(),'hostname':socket.gethostname(),'url':url}
          try:
            req=urllib.request.Request(url,headers=h)
            with urllib.request.urlopen(req,timeout=20) as r:
              b=r.read();out.update({'status':r.status,'content_type':r.headers.get('content-type'),'bytes':len(b),'preview':b[:800].decode(errors='replace')})
          except urllib.error.HTTPError as e:
            b=e.read();out.update({'status':e.code,'content_type':e.headers.get('content-type'),'bytes':len(b),'preview':b[:800].decode(errors='replace')})
          except Exception as e:out['error']=repr(e)
          pathlib.Path('feed/egress-probes').mkdir(parents=True,exist_ok=True)
          name=platform.system().lower()
          pathlib.Path(f'feed/egress-probes/{name}.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,indent=2))
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: betflag-egress-${{ matrix.os }}
          path: feed/egress-probes/*.json
