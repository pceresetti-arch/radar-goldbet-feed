name: Diagnose Diretta opening variants

on:
  workflow_dispatch:
  push:
    paths:
      - 'diretta-opening-variants-trigger.json'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Probe current pre-match odds query variants
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, requests
          from datetime import datetime, timezone

          EVENT_ID='xAQCcf1s'
          EVENT_NAME='Valencia - Real Betis'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139.0.0.0 Safari/537.36'
          headers={
            'User-Agent':UA,'Accept':'*/*','Accept-Language':'en-GB,en;q=0.9',
            'Referer':'https://www.flashscore.com/','Origin':'https://www.flashscore.com',
            'x-fsign':'SW9D1eZo','Cache-Control':'no-cache','Pragma':'no-cache'
          }
          s=requests.Session(); s.headers.update(headers)
          warmups=[]
          for u in ('https://www.flashscore.com/','https://www.flashscore.com/match/football/betis-vJbTeCGP/valencia-CQeaytrD/?mid=xAQCcf1s'):
            try:
              r=s.get(u,timeout=20); warmups.append({'url':u,'status':r.status_code,'bytes':len(r.content)})
            except Exception as e: warmups.append({'url':u,'error':repr(e)})

          hosts=[
            'https://global.ds.lsapp.eu/odds/pq_graphql',
            'https://global.ds.lsapp.eu/pq_graphql',
            'https://2.ds.lsapp.eu/odds/pq_graphql',
            'https://2.ds.lsapp.eu/pq_graphql'
          ]
          targets=[
            ('2','IT',''),('2','GB',''),('2','DE',''),('2','PT','PT13'),('2','US','USNH'),
            ('46','IT',''),('46','GB','')
          ]
          hashes=['oce','ope']
          probes=[]; successes=[]
          for host in hosts:
            for pid,geo,sub in targets:
              for hsh in hashes:
                params={'_hash':hsh,'eventId':EVENT_ID,'projectId':pid,'geoIpCode':geo}
                if sub: params['geoIpSubdivisionCode']=sub
                try:
                  r=s.get(host,params=params,timeout=20)
                  rec={'host':host,'projectId':pid,'geo':geo,'sub':sub,'hash':hsh,'status':r.status_code,'url':r.url,'body_prefix':r.text[:500]}
                  if r.status_code==200:
                    try:
                      data=r.json(); eo=((data.get('data') or {}).get('findOddsByEventId') or {}) if isinstance(data,dict) else {}
                      rec['usable']=bool(eo)
                      if eo:
                        bks=[]; bmap={}
                        for be in ((eo.get('settings') or {}).get('bookmakers') or []):
                          inn=(be or {}).get('bookmaker') or {}; bid=str(inn.get('id') or ''); name=inn.get('name')
                          if bid and name: bmap[bid]=name
                          if name: bks.append(name)
                        rec['bookmakers']=bks
                        rec['goldbet_present']=any('gold' in str(x).lower() for x in bks)
                        opens=[]; gold=[]
                        for m in eo.get('odds') or []:
                          if not isinstance(m,dict): continue
                          vals=[]
                          for o in m.get('odds') or []:
                            if isinstance(o,dict):
                              vals.append({'value':o.get('value'),'opening':o.get('opening'),'movement':o.get('movement')})
                          if any(v.get('opening') not in (None,'') for v in vals):
                            row={'bookmakerId':m.get('bookmakerId'),'bookmaker':bmap.get(str(m.get('bookmakerId'))),'bettingType':m.get('bettingType'),'bettingScope':m.get('bettingScope'),'handicap':m.get('handicap'),'odds':vals}
                            opens.append(row)
                            if 'gold' in str(row.get('bookmaker') or '').lower(): gold.append(row)
                        rec['opening_market_count']=len(opens); rec['opening_examples']=opens[:30]; rec['goldbet_opening_rows']=gold[:30]
                        successes.append(rec)
                    except Exception as e: rec['parse_error']=repr(e)
                  probes.append(rec)
                except Exception as e:
                  probes.append({'host':host,'projectId':pid,'geo':geo,'sub':sub,'hash':hsh,'error':repr(e)})
                if successes: break
              if successes: break
            if successes: break

          out={'generated_at':datetime.now(timezone.utc).isoformat(),'event_id':EVENT_ID,'event':EVENT_NAME,'warmups':warmups,'successes':successes,'probes':probes}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/diretta-opening-variants.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'success_count':len(successes),'successes':successes[:2],'probe_count':len(probes)},ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Commit result
        if: always()
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git pull --rebase || true
          git add feed/diretta-opening-variants.json
          git diff --cached --quiet && exit 0
          git commit -m 'Probe Diretta opening odds variants'
          git push
