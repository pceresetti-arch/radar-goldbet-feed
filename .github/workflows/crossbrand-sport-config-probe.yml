name: Probe GBO sport service configuration cross-brand

on:
  push:
    paths:
      - 'crossbrand-sport-config-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe service config and player API paths
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.error
          from datetime import datetime,timezone

          hosts=['www.goldbet.it','goldbet.it','www.lottomatica.it','lottomatica.it','www.betflag.it','betflag.it']
          paths=[
            '/api/games/app/getSportServiceConfiguration',
            '/api/games/app/getSportServiceConfiguration/',
            '/api/sport/promptbet/health',
            '/api/sport/pregame/getDetailsEventAams/0/264/0/15996319/0/0'
          ]
          variants=[
            {'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.6 Mobile/15E148 Safari/604.1','Accept':'application/json,text/plain,*/*','Accept-Language':'it-IT,it;q=0.9,en;q=0.8'},
            {'User-Agent':'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/139.0.0.0 Mobile Safari/537.36','Accept':'application/json,text/plain,*/*','X-Requested-With':'XMLHttpRequest'},
          ]
          results=[]
          for host in hosts:
            for path in paths:
              for vi,h in enumerate(variants):
                url='https://'+host+path
                headers=dict(h)
                headers['Referer']='https://'+host+'/'
                headers['Origin']='https://'+host
                req=urllib.request.Request(url,headers=headers)
                try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                    body=r.read(200000).decode('utf-8','replace')
                    status=r.status; ctype=r.headers.get('content-type')
                except urllib.error.HTTPError as e:
                  status=e.code; ctype=e.headers.get('content-type'); body=e.read(5000).decode('utf-8','replace')
                except Exception as e:
                  results.append({'host':host,'path':path,'variant':vi,'error':repr(e)}); continue
                results.append({'host':host,'path':path,'variant':vi,'status':status,'content_type':ctype,'bytes':len(body),'body_prefix':body[:5000]})
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'results':results}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/crossbrand-sport-config-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit result
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/crossbrand-sport-config-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Probe GBO cross-brand sport config'
          git push
