name: Historical Backtest Sweden Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/historical-backtest-sweden-bootstrap.yml'
      - 'tools/historical_ingest_sweden.py'
      - 'tools/historical_build_sweden_baseline.py'
      - 'tools/historical_model_sweden_structural.py'

permissions:
  contents: write

concurrency:
  group: historical-backtest-sweden-bootstrap
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and profile Sweden historical source
        run: python tools/historical_ingest_sweden.py
      - name: Build frozen Sweden baseline
        run: python tools/historical_build_sweden_baseline.py
      - name: Build Sweden structural OOS model
        run: python tools/historical_model_sweden_structural.py
      - name: Commit historical discovery evidence
        run: |
          git config user.name "radar-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python tools/historical_ingest_sweden.py
            python tools/historical_build_sweden_baseline.py
            python tools/historical_model_sweden_structural.py
            git add feed/historical/sweden
            if git diff --cached --quiet; then
              echo "No discovery changes"
              exit 0
            fi
            git commit -m "Update Sweden historical source discovery"
            if git push; then
              exit 0
            fi
            echo "Push raced with another workflow; regenerating from latest main attempt ${attempt}/5"
            sleep $((attempt * 2))
          done
          echo "Unable to publish discovery evidence after bounded retries"
          exit 1
