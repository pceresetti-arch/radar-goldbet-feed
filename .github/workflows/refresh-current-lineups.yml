name: Refresh current lineups

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'refresh-current-lineups-trigger.json'
      - 'radar-runtime-request.json'
      - 'scripts/refresh_current_lineups_resilient.py'

permissions:
  contents: write

concurrency:
  group: refresh-current-lineups
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install browser-like client
        run: pip install -q curl_cffi
      - name: Build resilient autonomous lineup feed
        run: python scripts/refresh_current_lineups_resilient.py
      - name: Commit lineup feed safely
        shell: bash
        run: |
          set -e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/lineups-current.json feed/lineups-current-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh resilient current lineups'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo 'Unable to persist lineup feed after retries' >&2
          exit 1
