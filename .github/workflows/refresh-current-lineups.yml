name: Refresh current lineups

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'refresh-current-lineups-trigger.json'

permissions:
  contents: write

concurrency:
  group: refresh-current-lineups
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Install browser-like client
        run: pip install -q curl_cffi
      - name: Build autonomous lineup feed
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re, unicodedata, urllib.request, difflib, time
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from curl_cffi import requests

          ROME=ZoneInfo('Europe/Rome')
          NOW=datetime.now(timezone.utc)
          BET_BASE='https://sportservice.betflag.it/api/sport/pregame'
          AGG=1334500001
          BET_H={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0','Origin':'https://www.betflag.it','Referer':'https://www.betflag.it/'}
          FM_H={'Accept':'application/json,text/plain,*/*','Accept-Language':'it-IT,it;q=0.9,en;q=0.8','Referer':'https://www.fotmob.com/'}

          def bet_json(url,cap=18000000):
            req=urllib.request.Request(url,headers=BET_H)
            with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read(cap).decode('utf-8','replace'))
          def fm_json(url):
            r=requests.get(url,headers=FM_H,impersonate='chrome',timeout=25)
            r.raise_for_status(); return r.json(),r.status_code
          def norm(s):
            s=unicodedata.normalize('NFKD',str(s or '')).encode('ascii','ignore').decode().lower()
            s=re.sub(r'\b(fc|cf|sc|ac|afc|cd|fk|bk|calcio|club|deportivo|sporting|united|city|pr|sp|rj|mg)\b',' ',s)
            s=re.sub(r'[^a-z0-9]+',' ',s); return ' '.join(s.split())
          def side_score(a,b):
            a,b=norm(a),norm(b)
            if not a or not b:return 0
            seq=difflib.SequenceMatcher(None,a,b).ratio(); A=set(a.split()); B=set(b.split()); jac=len(A&B)/max(1,len(A|B)); cont=1 if a in b or b in a else 0
            return .62*seq+.23*jac+.15*cont
          def split_match(s):
            for sep in (' - ',' vs ',' v '):
              if sep in str(s): return tuple(x.strip() for x in str(s).split(sep,1))
            return str(s),''
          def parse_aams(s):
            try:return datetime.strptime(str(s),'%d-%m-%Y %H:%M').replace(tzinfo=ROME).astimezone(timezone.utc)
            except:return None
          def parse_iso(s):
            try:return datetime.fromisoformat(str(s).replace('Z','+00:00')).astimezone(timezone.utc)
            except:return None

          # AAMS slate, only matches approaching kickoff.
          std=bet_json(f'{BET_BASE}/getOverviewEventsAams/0/1/0/{AGG}/0/0/0?channelId=0')
          targets={}
          def walk(x):
            if isinstance(x,dict):
              if x.get('mi') is not None and x.get('en') and (x.get('si') in (1,'1') or str(x.get('sn','')).lower()=='calcio'):
                dt=parse_aams(x.get('ed')); name=str(x.get('en') or '')
                if dt and not name.startswith('('):
                  delta=(dt-NOW).total_seconds()/60
                  if -15 <= delta <= 120:
                    targets[str(x.get('mi'))]={'match_market_id':str(x.get('mi')),'match_event_id':x.get('ei'),'match':name,'start_time':x.get('ed'),'start_utc':dt.isoformat(),'league':x.get('td'),'minutes_to_start':round(delta,1)}
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(std)

          # Keep already confirmed XIs so the pipeline does not re-poll them.
          previous={}; oldp=pathlib.Path('feed/lineups-current.json')
          if oldp.exists():
            try:
              old=json.loads(oldp.read_text(encoding='utf-8')); previous={str(m.get('match_market_id')):m for m in old.get('matches',[]) if m.get('status') in ('SOURCE_CONFIRMED','CROSS_CONFIRMED')}
            except: pass

          dates=set()
          for t in targets.values():
            dt=parse_iso(t['start_utc']); dates.add(dt.astimezone(ROME).date()); dates.add(dt.date())
          events=[]; source_errors={}; schedule_stats=[]
          for d in sorted(dates):
            url=f'https://www.fotmob.com/api/data/matches?date={d.strftime("%Y%m%d")}&timezone=Europe%2FRome&ccode3=ITA'
            try:
              j,status=fm_json(url); cnt=0
              for lg in j.get('leagues',[]):
                for m in lg.get('matches',[]):
                  st=(m.get('status') or {}).get('utcTime'); dt=parse_iso(st)
                  if not dt:
                    raw=m.get('time')
                    try: dt=datetime.strptime(raw,'%d.%m.%Y %H:%M').replace(tzinfo=ROME).astimezone(timezone.utc)
                    except: dt=None
                  events.append({'id':m.get('id'),'home':(m.get('home') or {}).get('name'),'away':(m.get('away') or {}).get('name'),'start':dt,'league':lg.get('name')}); cnt+=1
              schedule_stats.append({'date':str(d),'status':status,'matches':cnt})
            except Exception as e: source_errors[f'fotmob_{d}']=type(e).__name__+': '+str(e)[:180]

          def best(t):
            th,ta=split_match(t['match']); tdt=parse_iso(t['start_utc']); best=None
            for e in events:
              if not e['home'] or not e['away'] or not e['start']: continue
              hs=side_score(th,e['home']); as_=side_score(ta,e['away']); mins=abs((e['start']-tdt).total_seconds())/60
              if mins>180 or hs<.40 or as_<.40: continue
              score=.86*((hs+as_)/2)+.14*max(0,1-mins/180)
              if best is None or score>best['score']: best={**e,'score':round(score,4),'home_score':round(hs,4),'away_score':round(as_,4),'time_delta_min':round(mins,1)}
            return best if best and best['score']>=.58 else None

          def player_name(row):
            return row.get('name') or (row.get('player') or {}).get('name') or (row.get('playerName') if isinstance(row,dict) else None)
          def parse_lineup(line):
            if not isinstance(line,dict) or not line:return {'present':False,'teams':[],'raw':line}
            rawteams=line.get('lineups') or line.get('teams') or []
            teams=[]
            for t in rawteams if isinstance(rawteams,list) else []:
              starters=[]; bench=[]
              plist=t.get('players') or t.get('starters') or []
              for r in plist if isinstance(plist,list) else []:
                if not isinstance(r,dict):continue
                n=player_name(r)
                if n: starters.append({'name':n,'id':r.get('id') or (r.get('player') or {}).get('id'),'shirt_number':r.get('shirt') or r.get('shirtNumber') or r.get('jerseyNumber'),'position':r.get('position') or r.get('usualPosition')})
              bl=t.get('bench') or t.get('substitutes') or []
              for r in bl if isinstance(bl,list) else []:
                if not isinstance(r,dict):continue
                n=player_name(r)
                if n: bench.append({'name':n,'id':r.get('id') or (r.get('player') or {}).get('id')})
              teams.append({'team_id':t.get('teamId'),'team_name':t.get('teamName'),'formation':t.get('formation'),'starters':starters[:11] if len(starters)>11 else starters,'bench':bench})
            confirmed=len(teams)>=2 and all(len(t.get('starters') or [])>=11 for t in teams[:2])
            return {'present':bool(rawteams),'confirmed':confirmed,'teams':teams,'raw_keys':list(line.keys())}

          results=[]
          for key,t in sorted(targets.items(),key=lambda kv:kv[1]['start_utc']):
            if key in previous:
              m=previous[key]; m['minutes_to_start']=t['minutes_to_start']; m['retained_from_previous']=True; results.append(m); continue
            fm=best(t); detail=None; err=None; parsed={'present':False,'teams':[]}
            if fm:
              try:
                d,_=fm_json(f'https://www.fotmob.com/api/data/matchDetails?matchId={fm["id"]}')
                detail=((d.get('content') or {}).get('lineup') or {}); parsed=parse_lineup(detail)
              except Exception as e: err=type(e).__name__+': '+str(e)[:180]
            status='SOURCE_CONFIRMED' if parsed.get('confirmed') else ('LINEUP_PRESENT' if parsed.get('present') else 'NOT_AVAILABLE')
            results.append({**t,'status':status,'retained_from_previous':False,'source':'FotMob','fotmob_match':None if not fm else {k:fm.get(k) for k in ('id','home','away','league','score','time_delta_min')},'lineup':parsed,'error':err})
            time.sleep(.10)

          counts={}
          for r in results:counts[r['status']]=counts.get(r['status'],0)+1
          payload={'generated_at':NOW.isoformat(),'window':'T-120 to T+15 minutes','source_strategy':'FotMob autonomous primary; second-source confirmation to be added when reachable','target_count':len(results),'status_counts':counts,'schedule_stats':schedule_stats,'source_errors':source_errors,'matches':results}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/lineups-current.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          summary={k:v for k,v in payload.items() if k!='matches'}; summary['matches']=[{k:r.get(k) for k in ('match','start_time','league','minutes_to_start','status','match_market_id')} for r in results]
          pathlib.Path('feed/lineups-current-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Commit lineup feed
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/lineups-current.json feed/lineups-current-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh current autonomous lineups'
          git push
