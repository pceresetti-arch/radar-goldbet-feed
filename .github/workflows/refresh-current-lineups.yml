name: Refresh current lineups

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'refresh-current-lineups-trigger.json'
      - 'radar-runtime-request.json'
      - 'scripts/refresh_current_lineups_resilient.py'
      - 'scripts/refresh_current_lineups_watchdog.py'
      - 'scripts/refresh_urgent_lineups.py'

permissions:
  contents: write

concurrency:
  group: refresh-current-lineups
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install browser-like client
        run: pip install -q curl_cffi
      - name: Promote dual-source XI checks to T-120
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          patches = {
              Path('scripts/refresh_current_lineups_watchdog.py'): [
                  ('URGENT_TO_MIN = 80.0', 'URGENT_TO_MIN = 120.0'),
              ],
              Path('scripts/refresh_urgent_lineups.py'): [
                  ('URGENT_TO_MIN = 85.0', 'URGENT_TO_MIN = 120.0'),
              ],
          }
          for path, reps in patches.items():
              text = path.read_text(encoding='utf-8')
              for old, new in reps:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Watch official XI with early dual-source polling
        run: python scripts/refresh_current_lineups_watchdog.py
      - name: Commit lineup feed and POST-XI trigger safely
        shell: bash
        run: |
          set -e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/lineups-current.json feed/lineups-current-summary.json feed/lineup-watchdog-current.json feed/post-xi-refresh-request.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh official XI watchdog feed'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo 'Unable to persist lineup feed after retries' >&2
          exit 1
