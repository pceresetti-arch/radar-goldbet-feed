name: GoldBet frontend bundle crawl

on:
  push:
    paths:
      - goldbet-frontend-crawl-trigger.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crawl public GoldBet frontend assets
        run: |
          python - <<'PY'
          import json, pathlib, re, urllib.request, urllib.error, urllib.parse
          from datetime import datetime, timezone

          roots = [
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/',
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/index.html',
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/manifest.json',
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/asset-manifest.json',
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/ngsw.json',
          ]
          needles = re.compile(r'(getDetailsEventAams|getSportServiceConfiguration|DIG_1703|player_tab|playerTab|giocator|marcat|specialigiocatori|promptbet|pregame|Aams|aams_api|playerEvent|player-events|playerProps|player-props)', re.I)
          asset_rx = re.compile(r'''(?:src|href)=["']([^"']+\.(?:js|mjs|json)(?:\?[^"']*)?)["']''', re.I)
          quoted_asset_rx = re.compile(r'''["']([^"']+\.(?:js|mjs|json)(?:\?[^"']*)?)["']''', re.I)

          def fetch(url):
            req=urllib.request.Request(url,headers={'Accept':'*/*','User-Agent':'Mozilla/5.0 RadarGoldBet/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read()
                return {'url':url,'status':r.status,'ctype':r.headers.get('content-type',''),'text':raw.decode('utf-8','replace'),'bytes':len(raw)}
            except urllib.error.HTTPError as e:
              return {'url':url,'status':e.code,'ctype':e.headers.get('content-type','') if e.headers else '','text':e.read().decode('utf-8','replace'),'bytes':0}
            except Exception as e:
              return {'url':url,'error':repr(e),'text':'','bytes':0}

          fetched=[]; seen=set(); queue=list(roots)
          base='https://repo.lottomaticagroup.com/intplatform/scommesse/dev/'

          while queue and len(fetched)<80:
            url=queue.pop(0)
            if url in seen: continue
            seen.add(url)
            res=fetch(url)
            text=res.get('text','')
            hits=[]
            for m in needles.finditer(text):
              a=max(0,m.start()-450); b=min(len(text),m.end()+900)
              hits.append(text[a:b])
              if len(hits)>=30: break
            item={k:v for k,v in res.items() if k!='text'}
            item['hits']=hits
            item['prefix']=text[:1200]
            fetched.append(item)

            # discover assets from successful HTML/JSON/text responses
            if res.get('status')==200 and len(text)<8_000_000:
              candidates=set(asset_rx.findall(text))|set(quoted_asset_rx.findall(text))
              for c in candidates:
                if c.startswith('data:'): continue
                u=urllib.parse.urljoin(url,c)
                # only crawl public Lottomatica repo assets
                if urllib.parse.urlparse(u).hostname=='repo.lottomaticagroup.com' and u not in seen and len(queue)<200:
                  queue.append(u)

          out={
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'fetched_count':len(fetched),
            'hit_files':sum(1 for x in fetched if x.get('hits')),
            'files':fetched,
          }
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/goldbet-frontend-crawl.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit crawl
        run: |
          git config user.name "radar-goldbet-bot"
          git config user.email "radar-goldbet-bot@users.noreply.github.com"
          git add feed/goldbet-frontend-crawl.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Crawl GoldBet public frontend bundles"
          git push
