name: Historical GoldBet TRUE OPEN Calibration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/historical_goldbet_true_open_calibration.py"
      - ".github/workflows/historical-goldbet-true-open-calibration.yml"

permissions:
  contents: write

concurrency:
  group: historical-goldbet-true-open-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate frozen exact-outcome calibration
        run: python tools/historical_goldbet_true_open_calibration.py
      - name: Commit evidence
        run: |
          git config user.name "radar-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed/historical/open-close/goldbet-true-open-calibration-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist GoldBet TRUE OPEN calibration audit"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
