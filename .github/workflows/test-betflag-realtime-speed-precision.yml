name: Test BetFlag realtime speed and precision

on:
  push:
    paths:
      - 'quote-realtime-test-trigger.json'
      - '.github/workflows/test-betflag-realtime-speed-precision.yml'
      - 'scripts/test_betflag_realtime.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run realtime speed and precision test
        run: python scripts/test_betflag_realtime.py

      - name: Commit test report
        run: |
          git config user.name 'radar-bot'
          git config user.email 'radar-bot@users.noreply.github.com'
          git add feed/quote-realtime-test-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record realtime BetFlag speed and precision test'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
