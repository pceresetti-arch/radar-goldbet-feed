name: OddsPapi GBO sibling player probe

on:
  push:
    paths:
      - oddspapi-gbo-sibling-player-probe-trigger.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare player props across GBO brands
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          from datetime import datetime, timezone
          key=os.environ.get('ODDSPAPI_KEY','').strip()
          cfg=json.loads(pathlib.Path('oddspapi-gbo-sibling-player-probe-trigger.json').read_text())
          fid=cfg['fixtureId']
          books=cfg.get('bookmakers') or ['goldbet.it','betflag.it','lottomatica.it']
          base='https://api.oddspapi.io/v4'
          def get(path,params):
              p=dict(params); p['apiKey']=key
              req=urllib.request.Request(base+path+'?'+urllib.parse.urlencode(p),headers={'Accept':'application/json','User-Agent':'RadarGoldBet/4.1'})
              with urllib.request.urlopen(req,timeout=90) as r: return json.loads(r.read().decode())
          markets=get('/markets',{'language':'en'})
          cat=markets if isinstance(markets,list) else markets.get('data',[]) if isinstance(markets,dict) else []
          mmap={str(m.get('marketId')):m for m in cat if isinstance(m,dict)}
          odds=get('/odds',{'fixtureId':fid,'bookmakers':','.join(books),'language':'en','verbosity':3})
          bo=odds.get('bookmakerOdds') or {}
          result=[]
          for book in books:
              b=bo.get(book) or {}
              raw=b.get('markets') or {}
              rows=[]; pms=[]
              for mid,md in raw.items():
                  meta=mmap.get(str(mid),{})
                  if meta.get('playerProp'): pms.append({'marketId':str(mid),'marketName':meta.get('marketName'),'marketType':meta.get('marketType'),'period':meta.get('period')})
                  for oid,od in ((md or {}).get('outcomes') or {}).items():
                      for pid,sel in ((od or {}).get('players') or {}).items():
                          if not isinstance(sel,dict): continue
                          if sel.get('playerName') or str(pid) not in ('0','None',''):
                              rows.append({'marketId':str(mid),'marketName':meta.get('marketName'),'outcomeId':str(oid),'playerId':str(pid),'playerName':sel.get('playerName'),'price':sel.get('price')})
              result.append({'bookmaker':book,'bookmakerFixtureId':b.get('bookmakerFixtureId'),'fixturePath':b.get('fixturePath'),'market_count':len(raw),'player_prop_market_count':len(pms),'player_selection_count':len(rows),'player_prop_markets':pms,'player_selections':rows[:200]})
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'fixtureId':fid,'event':f"{odds.get('participant1Name')} - {odds.get('participant2Name')}",'results':result}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/oddspapi-gbo-sibling-player-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit result
        run: |
          git config user.name "radar-goldbet-bot"
          git config user.email "radar-goldbet-bot@users.noreply.github.com"
          git add feed/oddspapi-gbo-sibling-player-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Compare GBO player props via OddsPapi"
          git push
