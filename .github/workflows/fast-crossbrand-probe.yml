name: Fast GBO player API probe

on:
  push:
    paths:
      - 'fast-crossbrand-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe concurrently
        run: |
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.error,concurrent.futures
          from datetime import datetime,timezone
          hosts=['www.lottomatica.it','lottomatica.it','www.betflag.it','betflag.it']
          paths=['/api/games/app/getSportServiceConfiguration','/api/sport/pregame/getDetailsEventAams/0/264/0/15996319/0/0']
          def one(x):
            host,path=x; url='https://'+host+path
            h={'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.6 Mobile/15E148 Safari/604.1','Accept':'application/json,text/plain,*/*','Accept-Language':'it-IT,it;q=0.9','Referer':'https://'+host+'/','Origin':'https://'+host}
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=8) as r:
                b=r.read(200000).decode('utf-8','replace'); return {'url':url,'status':r.status,'ctype':r.headers.get('content-type'),'bytes':len(b),'body':b[:20000]}
            except urllib.error.HTTPError as e:
              b=e.read(5000).decode('utf-8','replace'); return {'url':url,'status':e.code,'ctype':e.headers.get('content-type'),'bytes':len(b),'body':b[:5000]}
            except Exception as e: return {'url':url,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            results=list(ex.map(one,[(h,p) for h in hosts for p in paths]))
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'results':results}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/fast-crossbrand-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/fast-crossbrand-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fast probe GBO player API'
          git push
