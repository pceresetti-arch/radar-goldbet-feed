name: Deploy clean BetFlag v7 fast path

on:
  push:
    paths:
      - '.github/workflows/deploy-radar-betflag-v7.yml'
      - 'wrangler.v7.jsonc'
      - 'worker/src/**'
      - 'radar-betflag-v7-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-radar-betflag-v7
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5

      - name: Deploy clean v7 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config wrangler.v7.jsonc

      - name: Explicitly enable workers.dev route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p feed
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/radar-betflag-v7/subdomain"
          curl -fsS "$api" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Accept: application/json' \
            > feed/radar-betflag-v7-subdomain-before.json
          curl -fsS -X POST "$api" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' \
            > feed/radar-betflag-v7-subdomain-enable.json
          curl -fsS "$api" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Accept: application/json' \
            > feed/radar-betflag-v7-subdomain-after.json
          python - <<'PY'
          import json, pathlib
          for name in ['before','enable','after']:
              p=pathlib.Path(f'feed/radar-betflag-v7-subdomain-{name}.json')
              body=json.loads(p.read_text(encoding='utf-8'))
              print(name, json.dumps(body, ensure_ascii=False))
          after=json.loads(pathlib.Path('feed/radar-betflag-v7-subdomain-after.json').read_text(encoding='utf-8'))
          result=after.get('result') or {}
          if not after.get('success') or result.get('enabled') is not True:
              raise SystemExit('workers.dev subdomain did not enable')
          PY

      - name: Verify v7 health and live BetFlag paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p feed
          python - <<'PY'
          import json, pathlib, time, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          base='https://radar-betflag-v7.p-ceresetti.workers.dev'

          def get(path, params=None):
              url=base+path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              sep='&' if '?' in url else '?'
              url += sep + 'cb=' + str(int(time.time()*1000))
              req=urllib.request.Request(url,headers={
                  'Accept':'application/json',
                  'User-Agent':'RadarBetFlagV7Verify/3.0',
                  'Cache-Control':'no-cache, no-store, max-age=0',
                  'Pragma':'no-cache'
              })
              started=time.perf_counter()
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      raw=r.read().decode('utf-8','replace'); status=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace'); status=e.code
              try: body=json.loads(raw)
              except Exception: body={'raw':raw[:3000]}
              return status, body, round((time.perf_counter()-started)*1000), url

          health_result=None
          for attempt in range(1,9):
              hs,hb,hms,hu=get('/health')
              ok=(
                  hs==200 and isinstance(hb,dict) and
                  hb.get('ok') is True and
                  hb.get('version')=='7.0-betflag-operational' and
                  hb.get('public_fast_path') is True and
                  hb.get('exact_player_price_proof') is True and
                  '/live/player-props' in (hb.get('endpoints') or []) and
                  '/live/player-price' in (hb.get('endpoints') or [])
              )
              health_result={'attempt':attempt,'status':hs,'body':hb,'ms':hms,'url':hu,'verified':ok}
              print(json.dumps(health_result,ensure_ascii=False))
              if ok: break
              time.sleep(5)

          discovery_result=None
          price_path_result=None
          if health_result and health_result.get('verified'):
              # A deliberately non-matching query forces a fresh BetFlag/AAMS scan
              # without depending on yesterday's fixtures or a hard-coded player.
              ds,db,dms,du=get('/live/player-props',{'q':'zzzraderprobe','limit':1})
              dfresh=(db.get('freshness') or {}) if isinstance(db,dict) else {}
              discovery_ok=(
                  ds==200 and isinstance(db,dict) and
                  db.get('source_class')=='BETFLAG_AAMS_DIRECT' and
                  db.get('source_healthy') is True and
                  dfresh.get('fresh') is True
              )
              discovery_result={'status':ds,'body':db,'ms':dms,'url':du,'verified':discovery_ok}
              print(json.dumps(discovery_result,ensure_ascii=False))

              # Probe the exact-price route with an intentionally impossible identity.
              # 404/0 rows is correct here; the check validates that the live direct
              # source was reached and that the gate remains closed without an exact quote.
              ps,pb,pms,pu=get('/live/player-price',{
                  'player':'ZZZ_RADAR_PROBE_NO_PLAYER',
                  'market':'Marc',
                  'selection':'Si'
              })
              pfresh=(pb.get('freshness') or {}) if isinstance(pb,dict) else {}
              price_path_ok=(
                  ps in (200,404) and isinstance(pb,dict) and
                  pb.get('source_class')=='BETFLAG_AAMS_DIRECT' and
                  pb.get('source_healthy') is True and
                  pfresh.get('fresh') is True and
                  pb.get('price_gate_eligible') is False and
                  int(pb.get('returned') or 0)==0
              )
              price_path_result={'status':ps,'body':pb,'ms':pms,'url':pu,'verified':price_path_ok}
              print(json.dumps(price_path_result,ensure_ascii=False))

          out={
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'worker':'radar-betflag-v7',
              'base_url':base,
              'health':health_result,
              'betflag_discovery_probe':discovery_result,
              'betflag_exact_route_probe':price_path_result,
              'live_verified':bool(health_result and health_result.get('verified')),
              'betflag_discovery_verified':bool(discovery_result and discovery_result.get('verified')),
              'betflag_exact_route_verified':bool(price_path_result and price_path_result.get('verified')),
              'note':'Exact positive player-price certification is performed on-demand only for a real decision candidate; deploy verification never depends on a stale hard-coded fixture.'
          }
          pathlib.Path('feed/radar-betflag-v7-status.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['live_verified']:
              raise SystemExit('clean v7 Worker health did not verify')
          if not out['betflag_discovery_verified']:
              raise SystemExit('clean v7 Worker live BetFlag discovery did not verify')
          if not out['betflag_exact_route_verified']:
              raise SystemExit('clean v7 Worker exact-price route did not verify')
          PY

      - name: Commit v7 status
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/radar-betflag-v7-status.json feed/radar-betflag-v7-subdomain-before.json feed/radar-betflag-v7-subdomain-enable.json feed/radar-betflag-v7-subdomain-after.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Record clean BetFlag v7 Worker status'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
