name: Deploy clean BetFlag v7 fast path

# Production deploy is intentionally manual-only. Repository maintenance must
# never trigger Cloudflare deployment failures or notification storms.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-radar-betflag-v7
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - name: Deploy clean v7 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config wrangler.v7.jsonc

      - name: Verify public BetFlag v7 health
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          base='https://radar-betflag-v7.p-ceresetti.workers.dev'
          last=None
          for _ in range(8):
              try:
                  req=urllib.request.Request(base+'/health?cb='+str(int(time.time()*1000)),headers={'Accept':'application/json','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=json.loads(r.read().decode())
                  last=body
                  if r.status==200 and body.get('ok') is True and body.get('version')=='7.0-betflag-operational':
                      print(json.dumps(body,ensure_ascii=False,indent=2))
                      raise SystemExit(0)
              except Exception as exc:
                  last={'error':str(exc)}
              time.sleep(5)
          print(json.dumps(last,ensure_ascii=False,indent=2))
          raise SystemExit('BetFlag v7 health verification failed')
          PY
