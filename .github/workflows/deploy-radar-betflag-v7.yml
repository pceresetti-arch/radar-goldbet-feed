name: Deploy clean BetFlag v7 fast path

on:
  workflow_dispatch:
  push:
    paths:
      - 'betflag-standard-worker-trigger.json'
      - 'scripts/patch_betflag_standard_worker.py'
      - 'scripts/patch_betflag_exact_event_identity.py'
      - 'scripts/patch_betflag_exact_full_fallback.py'
      - 'scripts/patch_betflag_cache_health.py'

permissions:
  contents: write

concurrency:
  group: deploy-radar-betflag-v7
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Apply BetFlag Worker patches
        run: |
          python scripts/patch_betflag_standard_worker.py
          python scripts/patch_betflag_exact_event_identity.py
          python scripts/patch_betflag_exact_full_fallback.py
          python scripts/patch_betflag_cache_health.py
          node --check worker/src/index.mjs

      - name: Deploy clean v7 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config wrangler.v7.jsonc

      - name: Verify public BetFlag v7 standard and player indexes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request, urllib.parse
          from datetime import datetime
          from zoneinfo import ZoneInfo
          base='https://radar-betflag-v7.p-ceresetti.workers.dev'
          date=datetime.now(ZoneInfo('Europe/Rome')).strftime('%d-%m-%Y')
          last=None
          def get(path):
              req=urllib.request.Request(base+path,headers={'Accept':'application/json','Cache-Control':'no-cache','User-Agent':'RadarDeployVerify/3.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.status,json.loads(r.read().decode())
          for _ in range(8):
              try:
                  hs,h=get('/health?cb='+str(int(time.time()*1000)))
                  ss,s=get('/live/standard-index?'+urllib.parse.urlencode({'date':date,'cb':int(time.time()*1000)}))
                  ps,p=get('/live/player-index?'+urllib.parse.urlencode({'date':date,'cb':int(time.time()*1000)}))
                  sf=(s.get('coverage') or {}).get('fixtures',0)
                  pf=(p.get('coverage') or {}).get('fixtures',0)
                  slots=(s.get('coverage') or {}).get('slot_results') or []
                  standard_transport_ok=bool(s.get('source_healthy') and slots and all(x.get('ok') for x in slots))
                  player_transport_ok=bool(p.get('source_healthy'))
                  last={
                    'health':{'status':hs,'version':h.get('version'),'endpoints':h.get('endpoints')},
                    'standard':{'status':ss,'source_healthy':s.get('source_healthy'),'fixtures':sf,'freshness':s.get('freshness'),'transport_ok':standard_transport_ok},
                    'player':{'status':ps,'source_healthy':p.get('source_healthy'),'fixtures':pf,'freshness':p.get('freshness'),'transport_ok':player_transport_ok}
                  }
                  print(json.dumps(last,ensure_ascii=False,indent=2))
                  # Empty markets are allowed when acquisition itself is healthy.
                  if hs==200 and ss==200 and ps==200 and h.get('ok') is True and standard_transport_ok and player_transport_ok:
                      raise SystemExit(0)
              except Exception as exc:
                  last={'error':repr(exc)}
              time.sleep(5)
          print(json.dumps(last,ensure_ascii=False,indent=2))
          raise SystemExit('BetFlag v7 standard/player transport verification failed')
          PY

      - name: Commit deployed Worker source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add worker/src/index.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Harden BetFlag cache and health semantics'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*2))
          done
          exit 1
