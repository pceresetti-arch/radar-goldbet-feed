name: Quick GoldBet shared price fingerprint

on:
  push:
    paths:
      - 'quick-goldbet-fingerprint-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Find real Milan Venezia and compare GoldBet prices
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python - <<'PY'
          import json,os,pathlib,urllib.parse,urllib.request,unicodedata,re
          from datetime import datetime,timezone
          key=os.environ.get('ODDSPAPI_KEY','').strip()
          if not key: raise SystemExit('Missing ODDSPAPI_KEY')
          base='https://api.oddspapi.io/v4'
          def get(path,params):
            p=dict(params); p['apiKey']=key
            req=urllib.request.Request(base+path+'?'+urllib.parse.urlencode(p),headers={'Accept':'application/json','User-Agent':'RadarGoldBetFingerprint/2.0'})
            with urllib.request.urlopen(req,timeout=90) as r:return json.loads(r.read().decode())
          def norm(s):
            return re.sub(r'[^a-z0-9]+',' ',unicodedata.normalize('NFKD',str(s)).encode('ascii','ignore').decode().lower()).strip()
          data=get('/fixtures',{'from':'2026-08-28','to':'2026-08-29','language':'en'})
          arr=data if isinstance(data,list) else data.get('data',[]) if isinstance(data,dict) else []
          matches=[]
          for f in arr:
            if not isinstance(f,dict): continue
            text=' '.join(str(f.get(k) or '') for k in ('participant1Name','participant2Name','name','eventName'))
            n=norm(text)
            if 'milan' not in n or 'venez' not in n: continue
            matches.append(f)
          # Prefer the real Italy Serie A fixture, explicitly reject simulated-reality variants.
          real=[f for f in matches if f.get('hasOdds') and 'srl' not in norm(f.get('tournamentName')) and norm(f.get('categoryName'))=='italy']
          if not real:
            real=[f for f in matches if f.get('hasOdds') and 'srl' not in norm(f.get('tournamentName'))]
          if not real: raise SystemExit('Real Milan-Venezia fixture not found')
          f=real[0]; fid=f.get('fixtureId')
          odds=get('/odds',{'fixtureId':fid,'bookmakers':'goldbet.it','language':'en','oddsFormat':'decimal','verbosity':3})
          book=(odds.get('bookmakerOdds') or {}).get('goldbet.it',{}) if isinstance(odds,dict) else {}
          markets=book.get('markets') or {}
          candidates=[]
          for mid,md in markets.items():
            if not isinstance(md,dict): continue
            meta=' '.join(str(md.get(k) or '') for k in ('marketName','name','marketType','period','line')).lower()
            outs=md.get('outcomes') or {}
            flat=[]
            if isinstance(outs,dict):
              for oid,o in outs.items():
                if not isinstance(o,dict): continue
                if o.get('price') is not None:
                  flat.append({'outcomeId':oid,'name':o.get('name') or o.get('outcomeName'),'price':o.get('price')})
                sels=o.get('selections')
                if isinstance(sels,dict):
                  for sid,s in sels.items():
                    if isinstance(s,dict) and s.get('price') is not None:
                      flat.append({'outcomeId':oid,'selectionId':sid,'name':s.get('name') or s.get('selectionName'),'price':s.get('price')})
            if flat and (len(flat)==3 or any(k in meta for k in ('1x2','moneyline','match winner','full time result'))):
              candidates.append({'marketId':mid,'market_meta':{k:md.get(k) for k in ('marketName','name','marketType','period','line')},'outcomes':flat})
          out={
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'selected_fixture':{k:f.get(k) for k in ('fixtureId','participant1Name','participant2Name','tournamentName','categoryName','startTime','hasOdds')},
            'goldbet_market_count':len(markets),
            'candidate_1x2_markets':candidates[:120],
            'shared_reference':{'event':'Milan - Venezia','1x2':[1.37,4.75,8.0]}
          }
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/quick-goldbet-shared-fingerprint.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:50000])
          PY
      - name: Commit result
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/quick-goldbet-shared-fingerprint.json
          git diff --cached --quiet && exit 0
          git commit -m 'Compare real Milan Venezia GoldBet shared prices'
          git push
