name: GoldBet public config diagnostic

on:
  push:
    paths:
      - goldbet-public-config-diagnostic-trigger.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public GoldBet/Lottomatica config files
        run: |
          python - <<'PY'
          import json, pathlib, re, urllib.request, urllib.error
          from datetime import datetime, timezone

          urls=[
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/Config/gb/marketconfig.json',
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/Config/gb/produzione/baseSettingsPlayBetsJson.json',
            'https://repo.lottomaticagroup.com/intplatform/scommesse/dev/Config/gb/produzione/scommesseconfig.json',
          ]
          results=[]
          needles=re.compile(r'(player|giocator|marcat|wsf|wallstreet|api|sport|pregame|prompt|odd|quote|endpoint|url|service|market)',re.I)

          def walk(x,path='root',out=None):
              if out is None: out=[]
              if len(out)>=1000: return out
              if isinstance(x,dict):
                  for k,v in x.items():
                      p=f'{path}.{k}'
                      if needles.search(str(k)) or (isinstance(v,str) and needles.search(v)):
                          out.append({'path':p,'value':v if not isinstance(v,(dict,list)) else str(v)[:1000]})
                      walk(v,p,out)
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]',out)
              return out

          for u in urls:
              req=urllib.request.Request(u,headers={'Accept':'application/json,text/plain,*/*','User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read().decode('utf-8','replace')
                      status=r.status
                      ctype=r.headers.get('content-type')
                  try:
                      data=json.loads(raw)
                      hits=walk(data)
                      top=list(data.keys()) if isinstance(data,dict) else None
                  except Exception:
                      data=None; top=None
                      hits=[{'text':m.group(0)} for m in re.finditer(r'.{0,120}(?:player|giocator|marcat|wsf|wallstreet|api|pregame|prompt|odd|endpoint|url|service).{0,240}',raw,re.I)]
                  results.append({'url':u,'status':status,'content_type':ctype,'bytes':len(raw),'top_keys':top,'hits':hits[:1000],'raw_prefix':raw[:1000]})
              except urllib.error.HTTPError as e:
                  results.append({'url':u,'status':e.code,'error_body':e.read().decode('utf-8','replace')[:3000]})
              except Exception as e:
                  results.append({'url':u,'error':repr(e)})

          out={'generated_at':datetime.now(timezone.utc).isoformat(),'results':results}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/goldbet-public-config-diagnostic.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "radar-goldbet-bot"
          git config user.email "radar-goldbet-bot@users.noreply.github.com"
          git add feed/goldbet-public-config-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inspect GoldBet public frontend config"
          git push
