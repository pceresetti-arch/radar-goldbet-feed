name: Patch Gol Assist markets

on:
  push:
    paths:
      - 'patch-gol-assist-markets-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add discovered Gol/Assist equivalent market to collector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/refresh-current-player-props.yml')
          s=p.read_text(encoding='utf-8')
          old="(2484,13816,'U/O Tiri in porta Plus'),(2484,13817,'U/O Tiri Totali Plus'),\n            (2484,19401,'Assist o Sostituto')"
          new="(2484,13816,'U/O Tiri in porta Plus'),(2484,13817,'U/O Tiri Totali Plus'),\n            (2484,19392,'Assist o Sostituto o Marcatore Plus'),(2484,19401,'Assist o Sostituto')"
          if "19392,'Assist o Sostituto o Marcatore Plus'" not in s:
              if old not in s:
                  raise SystemExit('target block not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          print('patched=',"19392,'Assist o Sostituto o Marcatore Plus'" in p.read_text(encoding='utf-8'))
          PY
      - name: Commit collector patch
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add .github/workflows/refresh-current-player-props.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Add Assist or substitute or scorer Plus market'
          git pull --rebase origin main
          git push origin HEAD:main
