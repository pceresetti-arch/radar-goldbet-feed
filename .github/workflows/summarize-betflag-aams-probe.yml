name: Summarize Betflag AAMS probe

on:
  push:
    paths:
      - 'betflag-aams-summary-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build compact summary
        run: |
          python - <<'PY'
          import json,pathlib
          src=json.loads(pathlib.Path('feed/betflag-aams-detail-probe.json').read_text(encoding='utf-8'))
          rows=[]
          for r in src.get('results',[]):
            body=r.get('body_prefix','')
            success=None; event_id=None; leo=None; lmtw=None
            try:
              j=json.loads(body)
              if isinstance(j,dict):
                success=j.get('success'); event_id=j.get('eventId'); leo=len(j.get('leo') or []); lmtw=len(j.get('lmtW') or [])
            except: pass
            rows.append({
              'label':r.get('label'),'channelId':r.get('channelId'),'status':r.get('status'),'bytes':r.get('bytes'),
              'json_type':r.get('json_type'),'success':success,'eventId':event_id,'leo_count':leo,'lmtW_count':lmtw,
              'signals':r.get('signals'),'error':r.get('error')
            })
          out={'event_id':src.get('event_id'),'rows':rows}
          pathlib.Path('feed/betflag-aams-detail-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/betflag-aams-detail-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'Summarize Betflag AAMS detail probe'
          git push
