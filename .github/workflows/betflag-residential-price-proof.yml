name: BetFlag residential exact price proof

on:
  push:
    paths:
      - 'betflag-price-proof-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: betflag-residential-price-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: [self-hosted, windows, betflag-residential]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure browser-session recovery client
        shell: powershell
        run: python -m pip install --disable-pip-version-check playwright
      - name: Fetch full residential player feed
        shell: powershell
        run: |
          python collector/betflag_residential_collector.py
      - name: Update opening and movement state with current observation
        shell: powershell
        run: |
          python collector/betflag_residential_movement.py
      - name: Resolve exact requested price and movement
        shell: powershell
        run: |
          @'
          import json, pathlib, re, unicodedata, hashlib
          from datetime import datetime, timezone
          def norm(v):
              s=unicodedata.normalize('NFD',str(v or ''))
              s=''.join(c for c in s if unicodedata.category(c)!='Mn').lower().replace('°','')
              return ' '.join(re.sub(r'[^a-z0-9]+',' ',s).split())
          def quote_id(row):
              vals=[row.get('match_market_id'),row.get('event_id'),row.get('player'),row.get('market'),row.get('line'),row.get('selection'),row.get('selection_id'),row.get('market_id')]
              raw='|'.join('' if v is None else str(v) for v in vals)
              return hashlib.sha1(raw.encode('utf-8')).hexdigest()[:24]
          req=json.loads(pathlib.Path('betflag-price-proof-request.json').read_text(encoding='utf-8'))
          feed=json.loads(pathlib.Path('feed/betflag-residential-current.json').read_text(encoding='utf-8'))
          movement_path=pathlib.Path('feed/betflag-residential-movement.json')
          movement=json.loads(movement_path.read_text(encoding='utf-8')) if movement_path.exists() else {'quotes':{}}
          want_player=norm(req.get('player')); want_market=norm(req.get('market')); want_sel=norm(req.get('selection')); qterms=norm(req.get('q')).split()
          aliases={
            'marcatore':['marc','marcatore','marcatore anytime'],
            'marcatore anytime':['marc','marcatore','marcatore anytime'],
            'gol o assist':['gol e assist','gol o assist'],
            'gol e assist':['gol e assist','gol o assist'],
          }
          valid_market={norm(x) for x in aliases.get(want_market,[want_market])}
          cand=[]
          for r in feed.get('rows',[]):
              if norm(r.get('player')) != want_player: continue
              if valid_market and norm(r.get('market')) not in valid_market: continue
              if qterms and not all(t in norm(r.get('match')) for t in qterms): continue
              if want_sel and norm(r.get('selection')) != want_sel: continue
              cand.append(r)
          quote=cand[0] if len(cand)==1 else None
          move=None
          if quote:
              ms=(movement.get('quotes') or {}).get(quote_id(quote))
              if ms:
                  true_open=ms.get('true_open_odd')
                  captured_open=ms.get('captured_open_odd')
                  incomplete='TRUE OPEN BETFLAG NON CERTIFICATA — MOVIMENTO INCOMPLETO'
                  if true_open is not None:
                      reference_type='TRUE_OPEN_BETFLAG_SOURCE_CERTIFIED'
                      reference_odd=true_open
                      reference_at=ms.get('true_open_at')
                  elif captured_open is not None:
                      reference_type='OPEN_CAPTURED_AT_FIRST_BETFLAG_AVAILABILITY'
                      reference_odd=captured_open
                      reference_at=ms.get('captured_open_at')
                  else:
                      reference_type=incomplete
                      reference_odd=None
                      reference_at=None
                  current=ms.get('current_odd')
                  move={
                    'movement_status':ms.get('movement_status') or reference_type,
                    'open_reference_type':reference_type,
                    'open_reference_odd':reference_odd,'open_reference_at':reference_at,
                    'true_open_odd':true_open,'true_open_at':ms.get('true_open_at'),
                    'true_open_source_field':ms.get('true_open_source_field'),
                    'captured_open_odd':captured_open,'captured_open_at':ms.get('captured_open_at'),
                    'captured_open_basis':ms.get('captured_open_basis'),
                    'previous_healthy_scan_at':ms.get('previous_healthy_scan_at'),
                    'first_seen_odd':ms.get('first_seen_odd'),'first_seen_at':ms.get('first_seen_at'),
                    'current_odd':current,'current_at':ms.get('current_at'),
                    'movement_from_open_reference':round(float(current)-float(reference_odd),4) if current is not None and reference_odd is not None else None,
                    'change_count':ms.get('change_count'),
                    'checkpoints':ms.get('checkpoints') or {},
                    'recent_changes':(ms.get('changes') or [])[-20:]
                  }
          fetched=datetime.now(timezone.utc).isoformat()
          canonical={'player':quote.get('player') if quote else None,'match':quote.get('match') if quote else None,'market':quote.get('market') if quote else req.get('market'),'odd':quote.get('odd') if quote else None,'fetched_at':fetched}
          digest=hashlib.sha256(json.dumps(canonical,sort_keys=True).encode()).hexdigest()
          result={
            'schema_version':'betflag-residential-price-proof-v3',
            'requested_at':req.get('requested_at'),'fetched_at':fetched,
            'source_class':'BETFLAG_AAMS_DIRECT','source':'sportservice.betflag.it via residential self-hosted runner',
            'betflag_direct':True,'source_healthy':bool(feed.get('source_healthy')),
            'request':req,'exact_matches':len(cand),
            'price_gate_eligible':bool(quote and feed.get('source_healthy')),
            'proof_id':'bfr-'+digest[:20],'sha256':digest,'quote':quote,
            'movement':move,
            'true_open_policy':'TRUE OPEN is immutable and only source-certified by explicit BetFlag evidence. If the market appears after an earlier healthy scan, the first BetFlag availability price is frozen separately as CAPTURED OPEN and used as the operational movement reference without mislabelling it TRUE OPEN.',
            'candidates':cand[:25] if len(cand)!=1 else []
          }
          p=pathlib.Path('feed'); (p/'betflag-price-proof-latest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          a=p/'price-proofs'; a.mkdir(exist_ok=True); stamp=datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          (a/f'{stamp}-{digest[:12]}.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          '@ | Set-Content -Encoding UTF8 .tmp_resolve_exact.py
          python .tmp_resolve_exact.py
      - name: Commit exact proof
        shell: powershell
        run: |
          git config user.name "radar-betflag-residential-bot"
          git config user.email "radar-betflag-residential-bot@users.noreply.github.com"
          git add feed/betflag-residential-current.json feed/betflag-residential-history feed/betflag-residential-movement.json feed/betflag-opening-field-diagnostics.json feed/betflag-price-proof-latest.json feed/price-proofs
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record residential BetFlag exact price and movement proof"
            Remove-Item -Recurse -Force .git\rebase-merge -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force .git\rebase-apply -ErrorAction SilentlyContinue
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
