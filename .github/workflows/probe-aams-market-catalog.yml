name: Probe AAMS market catalog

on:
  push:
    paths:
      - 'probe-aams-market-catalog-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Search AAMS catalog for Gol or Assist market metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, re
          from datetime import datetime, timezone

          BASE='https://sportservice.betflag.it/api/sport/pregame'
          H={'Accept':'application/json,text/plain,*/*','Accept-Language':'it-IT,it;q=0.9','x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0','Origin':'https://www.betflag.it','Referer':'https://www.betflag.it/','User-Agent':'Mozilla/5.0'}
          AGG=1334500001
          urls={
            'standard':f'{BASE}/getOverviewEventsAams/0/1/0/{AGG}/0/0/0?channelId=0',
            'players':f'{BASE}/getOverviewEventsAams/0/-1/0/{AGG}/2484/0/0?channelId=0'
          }
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'sources':{}}
          for key,url in urls.items():
            try:
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=22) as r: data=json.loads(r.read(16000000).decode('utf-8','replace'))
              hits=[]
              def walk(x,path='root'):
                if isinstance(x,dict):
                  text=' | '.join(str(v) for v in x.values() if isinstance(v,(str,int,float)))
                  low=text.lower()
                  if 'assist' in low or ('gol' in low and ('giocator' in low or 'marcat' in low)):
                    compact={k:v for k,v in x.items() if isinstance(v,(str,int,float,bool)) and len(str(v))<240}
                    hits.append({'path':path,'dict':compact})
                  for k,v in x.items(): walk(v,f'{path}.{k}')
                elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
              walk(data)
              out['sources'][key]={'status':200,'hits':hits[:1200],'hit_count':len(hits)}
            except Exception as e:
              out['sources'][key]={'status':None,'error':type(e).__name__+': '+str(e)[:240]}
          pathlib.Path('feed/aams-market-catalog-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:60000])
          PY
      - name: Commit catalog probe
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/aams-market-catalog-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Probe AAMS market catalog'
          git pull --rebase origin main
          git push origin HEAD:main
