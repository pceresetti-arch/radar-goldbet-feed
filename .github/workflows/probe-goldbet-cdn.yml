name: Probe GoldBet public CDN app

on:
  push:
    paths:
      - 'goldbet-cdn-probe-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe CDN entrypoints and referenced JS
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.error, re, urllib.parse
          from datetime import datetime, timezone
          base='https://st-cdn001.akamaized.net/goldbet/it/'
          seeds=['','index.html','manifest.json','asset-manifest.json','ngsw.json','runtime.js','main.js','config.json']
          results=[]; js_urls=[]
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/javascript,application/json,*/*'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                return r.status,r.headers.get('content-type'),r.read(1500000).decode('utf-8','replace')
            except urllib.error.HTTPError as e:
              return e.code,e.headers.get('content-type'),e.read(5000).decode('utf-8','replace')
            except Exception as e:
              return None,None,repr(e)
          for s in seeds:
            url=urllib.parse.urljoin(base,s)
            status,ctype,body=get(url)
            hits=[k for k in ['getdetailseventaams','aams','player','giocatori','marcatori','pregame','sportservice','/api/'] if k in body.lower()]
            results.append({'url':url,'status':status,'content_type':ctype,'bytes':len(body),'hits':hits,'sample':body[:15000]})
            if status==200:
              for m in re.findall(r'(?:src|href)=[\"\']([^\"\']+\.(?:js|mjs)(?:\?[^\"\']*)?)[\"\']',body,re.I):
                js_urls.append(urllib.parse.urljoin(url,m))
          for url in list(dict.fromkeys(js_urls))[:80]:
            status,ctype,body=get(url)
            low=body.lower()
            hits=[k for k in ['getdetailseventaams','aams','player','giocatori','marcatori','pregame','sportservice','/api/'] if k in low]
            urls=re.findall(r'https?://[^\\s\"\\'<>]+',body)
            if hits or urls:
              results.append({'url':url,'status':status,'content_type':ctype,'bytes':len(body),'hits':hits,'urls':urls[:100],'sample':body[:20000]})
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'base':base,'discovered_js':list(dict.fromkeys(js_urls)),'results':results}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/goldbet-cdn-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('js',len(js_urls),'results',len(results))
          PY
      - name: Commit result
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/goldbet-cdn-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Probe GoldBet public CDN app'
          git push
