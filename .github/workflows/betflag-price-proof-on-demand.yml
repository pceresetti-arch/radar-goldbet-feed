name: BetFlag cloud price proof (deprecated manual diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cloud lane disabled for operational price proof
        shell: bash
        run: |
          echo "Operational BetFlag exact-price acquisition moved to the residential self-hosted workflow."
          echo "Reason: BetFlag/Akamai rejects datacenter-origin requests with HTTP 403 Access Denied."
          echo "This workflow remains manual-only for diagnostics and MUST NOT write betflag-price-proof-latest.json."
