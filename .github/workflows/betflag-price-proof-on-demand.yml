name: BetFlag price proof on demand

on:
  push:
    paths:
      - 'betflag-price-proof-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: betflag-price-proof-on-demand
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5

      - name: Fetch exact BetFlag quote and certify
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re, urllib.request, hashlib, unicodedata
          from datetime import datetime, timezone

          BASE='https://sportservice.betflag.it/api/sport/pregame'
          AGG=1334500001
          TARGETS={
            'marcatore plus':(2484,13825,'Marcatore Plus'),
            'marcatore o sostituto':(2484,19405,'Marcatore o Sostituto'),
            'marc':(2484,22884,'Marc'),
            'marcatore':(2484,22884,'Marc'),
            'marcatore anytime':(2484,22884,'Marc'),
            '1 marcatore':(2484,13819,'1° Marcatore'),
            'primo marcatore':(2484,13819,'1° Marcatore'),
            '1 marcatore o sostituto':(2484,19403,'1° Marcatore o Sostituto'),
            'marcatore 1t':(2484,13820,'Marcatore 1T'),
            'marcatore primo tempo':(2484,13820,'Marcatore 1T'),
            'marcatore 2t':(2484,13826,'Marcatore 2T'),
            'marcatore secondo tempo':(2484,13826,'Marcatore 2T'),
            'doppietta':(2484,13821,'Doppietta'),
            'tripletta':(2484,13822,'Tripletta'),
            'u/o tiri in porta plus':(2484,13816,'U/O Tiri in porta Plus'),
            'u/o tiri totali plus':(2484,13817,'U/O Tiri Totali Plus'),
            'assist o sostituto':(2484,19401,'Assist o Sostituto'),
            'u/o tiri in porta giocatore':(2484,13495,'U/O Tiri In Porta Giocatore'),
            'tiri in porta giocatore':(2484,13495,'U/O Tiri In Porta Giocatore'),
            'u/o tiri totali giocatore':(2484,13496,'U/O Tiri Totali Giocatore'),
            'tiri totali giocatore':(2484,13496,'U/O Tiri Totali Giocatore'),
            'assist':(2484,13823,'Assist'),
            'gol e assist':(2484,13824,'Gol e Assist'),
            'goal e assist':(2484,13824,'Gol e Assist'),
            'u/o parate giocatore':(2487,13509,'U/O Parate Giocatore')
          }
          HEADERS={
            'Accept':'application/json,text/plain,*/*','x-api-version':'1.0','X-Auth-Token':'',
            'X-Brand':'3','X-IdCanale':'0','Origin':'https://www.betflag.it','Referer':'https://www.betflag.it/',
            'User-Agent':'Mozilla/5.0 RadarBetFlagPriceProof/7.0'
          }

          def norm(v):
            s=unicodedata.normalize('NFD',str(v or ''))
            s=''.join(c for c in s if unicodedata.category(c)!='Mn').lower().replace('°','')
            return ' '.join(s.split()).strip()

          def get(url):
            req=urllib.request.Request(url,headers=HEADERS)
            with urllib.request.urlopen(req,timeout=25) as r:
              return r.status,json.loads(r.read().decode('utf-8','replace'))

          def parse_player(name):
            m=re.match(r'^\(([^)]+)\)\s*(.*)$',str(name or '').strip())
            return (m.group(1).strip(),m.group(2).strip()) if m else ('',str(name or '').strip())

          def market_rows(event):
            out=[]; mm=event.get('mmkW')
            markets=mm.values() if isinstance(mm,dict) else (mm if isinstance(mm,list) else [])
            for market in markets:
              if not isinstance(market,dict): continue
              spd=market.get('spd'); spreads=spd.items() if isinstance(spd,dict) else enumerate(spd or []) if isinstance(spd,list) else []
              for spread_key,spread in spreads:
                if not isinstance(spread,dict): continue
                for q in spread.get('asl') or []:
                  if isinstance(q,dict) and q.get('ov') is not None:
                    out.append({'market':market.get('mn'),'line':None if str(spread_key)=='0.0' else spread_key,'selection':q.get('sn'),'odd':q.get('ov'),'selection_id':q.get('si'),'selection_type':q.get('sti'),'market_type':q.get('mti'),'market_id':q.get('mi'),'odds_id':q.get('oi')})
            return out

          req_path=pathlib.Path('betflag-price-proof-request.json')
          request=json.loads(req_path.read_text(encoding='utf-8'))
          market_key=norm(request.get('market'))
          target=TARGETS.get(market_key)
          if not target:
            raise SystemExit('Unsupported market: '+str(request.get('market')))

          fetched_at=datetime.now(timezone.utc).isoformat()
          standard_url=f'{BASE}/getOverviewEventsAams/0/1/0/{AGG}/0/0/0?channelId=0'
          market_url=f'{BASE}/getOverviewEventsAams/0/-1/0/{AGG}/{target[0]}/{target[1]}/0?channelId=0'
          standard_status,standard=get(standard_url)
          market_status,data=get(market_url)

          match_map={}
          def walk_standard(x):
            if isinstance(x,dict):
              if x.get('mi') is not None and x.get('en') and not norm(x.get('sn')).startswith('giocatori') and not str(x.get('en')).startswith('('):
                if x.get('si') in (1,'1') or norm(x.get('sn'))=='calcio':
                  match_map[str(x.get('mi'))]={k:x.get(k) for k in ('ei','en','ed','ti','td','cd','mi','tai')}
              for v in x.values(): walk_standard(v)
            elif isinstance(x,list):
              for v in x: walk_standard(v)
          walk_standard(standard)

          rows=[]
          def walk_player(x):
            if isinstance(x,dict):
              if 'ei' in x and 'en' in x and norm(x.get('sn')).startswith('giocatori'):
                code,player=parse_player(x.get('en')); match=match_map.get(str(x.get('mi')))
                base={'event_id':x.get('ei'),'player_event':x.get('en'),'match_code':code,'player':player,'league':x.get('td'),'match_market_id':x.get('mi'),'match':match.get('en') if match else None,'match_event_id':match.get('ei') if match else None,'match_start':match.get('ed') if match else x.get('ed'),'requested_market':target[2]}
                for q in market_rows(x): rows.append({**base,**q,'fetched_at':fetched_at})
              for v in x.values(): walk_player(v)
            elif isinstance(x,list):
              for v in x: walk_player(v)
          walk_player(data)

          player_want=norm(request.get('player')); match_id=norm(request.get('match_market_id')); q_terms=norm(request.get('q')).split(); sel=norm(request.get('selection')); line=norm(request.get('line'))
          exact=[]
          for row in rows:
            if norm(row.get('player'))!=player_want: continue
            if match_id and norm(row.get('match_market_id'))!=match_id: continue
            if q_terms:
              hay=' '.join(norm(row.get(k)) for k in ('match','match_code','league'))
              if not all(t in hay for t in q_terms): continue
            if sel and norm(row.get('selection'))!=sel: continue
            if line and norm(row.get('line'))!=line: continue
            exact.append(row)

          if not sel and len(exact)>1:
            yes=[r for r in exact if norm(r.get('selection'))=='si']
            if len(yes)==1: exact=yes

          quote=exact[0] if len(exact)==1 else None
          canonical={
            'source_class':'BETFLAG_AAMS_DIRECT','source_host':'sportservice.betflag.it','fetched_at':fetched_at,
            'match':quote.get('match') if quote else None,'match_market_id':quote.get('match_market_id') if quote else None,
            'match_event_id':quote.get('match_event_id') if quote else None,'player':quote.get('player') if quote else None,
            'requested_market':quote.get('requested_market') if quote else target[2],'market':quote.get('market') if quote else None,
            'line':quote.get('line') if quote else None,'selection':quote.get('selection') if quote else None,'odd':quote.get('odd') if quote else None,
            'selection_id':quote.get('selection_id') if quote else None,'market_id':quote.get('market_id') if quote else None,'odds_id':quote.get('odds_id') if quote else None
          }
          digest=hashlib.sha256(json.dumps(canonical,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          source_healthy=standard_status==200 and market_status==200
          result={
            'schema_version':'betflag-price-proof-v1','requested_at':request.get('requested_at'),'fetched_at':fetched_at,
            'source_class':'BETFLAG_AAMS_DIRECT','source':'sportservice.betflag.it direct AAMS player service','betflag_direct':True,
            'standard_status':standard_status,'market_status':market_status,'source_healthy':source_healthy,
            'request':request,'target':{'tab':target[0],'slot':target[1],'market':target[2]},'source_rows':len(rows),'exact_matches':len(exact),
            'price_gate_eligible':bool(source_healthy and quote is not None),'proof_id':'bf-'+digest[:20],'sha256':digest,
            'quote':quote,'candidates':exact[:25] if len(exact)!=1 else []
          }
          feed=pathlib.Path('feed'); feed.mkdir(exist_ok=True)
          latest=feed/'betflag-price-proof-latest.json'; latest.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          archive=feed/'price-proofs'; archive.mkdir(exist_ok=True)
          stamp=datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          (archive/f'{stamp}-{digest[:12]}.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Commit proof
        shell: bash
        run: |
          set -e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/betflag-price-proof-latest.json feed/price-proofs
          git diff --cached --quiet && exit 0
          git commit -m 'Record certified BetFlag price proof'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
