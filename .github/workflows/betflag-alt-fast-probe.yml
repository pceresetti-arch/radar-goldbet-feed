name: BetFlag alternate hosts fast probe

on:
  push:
    paths:
      - 'betflag-alt-fast-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Fast concurrent probe
        run: |
          python - <<'PY'
          import requests,json,pathlib,concurrent.futures,socket
          from datetime import datetime,timezone
          hosts=['appapi.betflag.it','odds.betflag.it','m.betflag.it','app.betflag.it','lol-mobile-proxy.betflag.it','sportservice.betflag.it']
          AGG=1334500001
          paths=['/', '/api/sport/pregame/getProgram?channelId=0', f'/api/sport/pregame/getOverviewEventsAams/0/1/0/{AGG}/0/0/0?channelId=0', f'/api/sport/pregame/getOverviewEventsAams/0/-1/0/{AGG}/2484/22884/0?channelId=0']
          H={'Accept':'application/json,text/plain,*/*','x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0','User-Agent':'Mozilla/5.0','Origin':'https://www.betflag.it','Referer':'https://www.betflag.it/'}
          def one(h,p):
            u='https://'+h+p
            try:
              ips=socket.getaddrinfo(h,443,type=socket.SOCK_STREAM); ip=ips[0][4][0]
            except Exception as e: ip='DNS:'+repr(e)
            try:
              r=requests.get(u,headers=H,timeout=5,allow_redirects=False)
              return {'host':h,'path':p,'resolved':ip,'status':r.status_code,'location':r.headers.get('location'),'server':r.headers.get('server'),'content_type':r.headers.get('content-type'),'bytes':len(r.content),'preview':r.text[:500]}
            except Exception as e:return {'host':h,'path':p,'resolved':ip,'error':repr(e)}
          tasks=[(h,p) for h in hosts for p in paths]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex: rows=list(ex.map(lambda hp:one(*hp),tasks))
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'results':rows}
          pathlib.Path('feed').mkdir(exist_ok=True);pathlib.Path('feed/betflag-alt-fast-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name radar-goldbet-bot
          git config user.email radar-goldbet-bot@users.noreply.github.com
          git add feed/betflag-alt-fast-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fast probe alternate BetFlag hosts'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main || { git fetch origin main; git rebase origin/main; git push origin HEAD:main; }
