name: Historical GoldBet T30 Outcome Pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/historical_goldbet_t30_outcome_pilot.py"
      - ".github/workflows/historical-goldbet-t30-outcome-pilot.yml"

permissions:
  contents: write

concurrency:
  group: historical-goldbet-t30-outcome-pilot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact-ID pilot
        run: python tools/historical_goldbet_t30_outcome_pilot.py
      - name: Commit evidence
        run: |
          git config user.name "radar-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed/historical/open-close/goldbet-t30-outcome-pilot-v1.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist GoldBet T-30 exact outcome pilot"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
