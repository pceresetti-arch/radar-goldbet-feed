name: Historical Cross-League OU25 Close OOS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/historical-cross-league-ou25-close-oos.yml'
      - 'tools/historical_cross_league_ou25_close_oos.py'

permissions:
  contents: write

concurrency:
  group: historical-cross-league-ou25-close-oos
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate frozen OU25 holdouts
        run: python tools/historical_cross_league_ou25_close_oos.py
      - name: Preserve evidence
        run: |
          rm -rf /tmp/ou25-markets
          cp -R feed/historical/markets /tmp/ou25-markets
      - name: Commit OOS evidence
        run: |
          git config user.name "radar-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p feed/historical
            rm -rf feed/historical/markets
            cp -R /tmp/ou25-markets feed/historical/markets
            git add feed/historical/markets
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Add cross-league OU25 closing benchmark"
            if git push; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
