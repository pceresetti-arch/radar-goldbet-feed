name: Cloudflare credentials diagnostic

on:
  push:
    paths:
      - 'cloudflare-credentials-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          from datetime import datetime, timezone
          names=['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','CF_API_TOKEN','CF_ACCOUNT_ID']
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'configured':{n:bool(os.environ.get(n,'').strip()) for n in names}}
          pathlib.Path('feed').mkdir(exist_ok=True)
          pathlib.Path('feed/cloudflare-credentials-diagnostic.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/cloudflare-credentials-diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'Check Cloudflare deployment credentials'
          git push
