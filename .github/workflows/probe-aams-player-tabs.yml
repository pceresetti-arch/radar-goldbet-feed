name: Probe AAMS player tabs

on:
  push:
    paths:
      - 'probe-aams-player-tabs-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Inspect player tab metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request
          from datetime import datetime, timezone
          BASE='https://sportservice.betflag.it/api/sport/pregame'; AGG=1334500001
          H={'Accept':'application/json,text/plain,*/*','x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0','Origin':'https://www.betflag.it','Referer':'https://www.betflag.it/','User-Agent':'Mozilla/5.0'}
          url=f'{BASE}/getOverviewEventsAams/0/-1/0/{AGG}/2484/0/0?channelId=0'
          req=urllib.request.Request(url,headers=H)
          with urllib.request.urlopen(req,timeout=22) as r: data=json.loads(r.read(16000000).decode('utf-8','replace'))
          tabs=[]
          for i,t in enumerate(data.get('lmtW') or []):
            if not isinstance(t,dict): continue
            scalars={k:v for k,v in t.items() if isinstance(v,(str,int,float,bool)) and len(str(v))<160}
            markets=[]
            for m in t.get('lotb') or []:
              if isinstance(m,dict): markets.append({k:m.get(k) for k in ('ti','sn','o','lt') if k in m})
            tabs.append({'index':i,'meta':scalars,'markets':markets})
          out={'generated_at':datetime.now(timezone.utc).isoformat(),'tabs':tabs}
          pathlib.Path('feed/aams-player-tabs-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:60000])
          PY
      - name: Commit tab probe
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/aams-player-tabs-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Probe AAMS player tabs'
          git pull --rebase origin main
          git push origin HEAD:main
