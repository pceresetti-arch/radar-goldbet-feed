name: BetFlag residential feed

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: betflag-residential-feed
  cancel-in-progress: true

jobs:
  collect:
    runs-on: [self-hosted, windows, betflag-residential]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect BetFlag player markets from residential network
        shell: powershell
        run: |
          python collector/betflag_residential_collector.py
      - name: Update immutable opening and movement history
        shell: powershell
        run: |
          python collector/betflag_residential_movement.py
      - name: Commit fresh BetFlag feed and movement
        shell: powershell
        run: |
          git config user.name "radar-betflag-residential-bot"
          git config user.email "radar-betflag-residential-bot@users.noreply.github.com"
          git add feed/betflag-residential-current.json feed/betflag-residential-history feed/betflag-residential-movement.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Refresh residential BetFlag feed and movement"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
