name: BetFlag residential feed

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'betflag-residential-trigger.json'

permissions:
  contents: write

concurrency:
  group: betflag-residential-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, windows, betflag-residential]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
      - name: Clear stale git operation metadata
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          Remove-Item '.git\rebase-merge' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item '.git\rebase-apply' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item '.git\MERGE_HEAD' -Force -ErrorAction SilentlyContinue
          Remove-Item '.git\CHERRY_PICK_HEAD' -Force -ErrorAction SilentlyContinue
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure browser-session recovery client
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: python -m pip install --disable-pip-version-check playwright
      - name: Ensure local true-open close watcher
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $root = 'C:\BetFlagRadar'
          $state = Join-Path $root 'state'
          $script = Join-Path $root 'betflag_true_open_close_watcher.py'
          New-Item -ItemType Directory -Force -Path $root,$state | Out-Null
          Copy-Item 'collector\betflag_true_open_close_watcher.py' $script -Force
          Copy-Item 'collector\betflag_session_transport.py' (Join-Path $root 'betflag_session_transport.py') -Force
          $taskName = 'BetFlag True Open Close Watcher'
          $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if (-not $task) {
            $python = (Get-Command python.exe -ErrorAction Stop).Source
            $action = New-ScheduledTaskAction -Execute $python -Argument ('"' + $script + '" --window-seconds 50 --interval 20')
            $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(20) -RepetitionInterval (New-TimeSpan -Minutes 1)
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -ExecutionTimeLimit (New-TimeSpan -Minutes 2)
            Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Settings $settings -RunLevel Highest -Description 'BetFlag residential watcher: open, movement and last pre-kickoff close.' | Out-Null
          }
          if (-not (Test-Path (Join-Path $state 'betflag-open-close-watch.json'))) { Start-ScheduledTask -TaskName $taskName }
      - name: Collect BetFlag player markets
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: python collector/betflag_residential_collector.py
      - name: Update player movement history
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: python collector/betflag_residential_movement.py
      - name: Collect BetFlag standard markets
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: python collector/betflag_standard_market_collector.py
      - name: Update standard-market movement
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: python collector/betflag_standard_movement.py
      - name: Build residential per-fixture live feed
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: python collector/betflag_hot_feed.py
      - name: Import local open-close watcher state
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $src = 'C:\BetFlagRadar\state\betflag-open-close-watch.json'
          if (Test-Path $src) { Copy-Item $src 'feed\betflag-open-close-watch.json' -Force }
      - name: Publish data-only live branch
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Get-Location).Path
          $publishRoot = Join-Path $env:RUNNER_TEMP 'betflag-live-publish'

          # betflag-live is a data publication branch. Build the new snapshot on
          # top of its own history so changes under .github/workflows on main are
          # never included in the live-branch push (GITHUB_TOKEN has contents
          # permission only, by design).
          git worktree prune
          if (Test-Path $publishRoot) {
            git worktree remove --force $publishRoot 2>$null
            Remove-Item $publishRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
          git fetch origin betflag-live:refs/remotes/origin/betflag-live
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch dedicated betflag-live branch' }
          git worktree add --detach $publishRoot origin/betflag-live
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create data-only BetFlag publish worktree' }

          try {
            $files = @(
              'feed/betflag-residential-current.json',
              'feed/betflag-residential-movement.json',
              'feed/betflag-opening-field-diagnostics.json',
              'feed/betflag-standard-current.json',
              'feed/betflag-standard-movement.json',
              'feed/betflag-movement-index.json',
              'feed/betflag-residential-hot-feed.json',
              'feed/betflag-live-status.json',
              'feed/betflag-residential-fixtures-index.json',
              'feed/betflag-fixtures-index.json'
            )

            foreach ($rel in $files) {
              $src = Join-Path $workspace $rel
              if (-not (Test-Path $src)) { throw "Missing generated BetFlag publication file: $rel" }
              $dst = Join-Path $publishRoot $rel
              New-Item -ItemType Directory -Force -Path (Split-Path $dst -Parent) | Out-Null
              Copy-Item $src $dst -Force
            }

            $fixtureDirs = @('betflag-residential-fixtures','betflag-fixtures')
            foreach ($dirName in $fixtureDirs) {
              $srcFixtures = Join-Path $workspace ("feed/" + $dirName)
              $dstFixtures = Join-Path $publishRoot ("feed/" + $dirName)
              if (-not (Test-Path $srcFixtures)) { throw "Missing generated BetFlag fixture directory: $dirName" }
              Remove-Item $dstFixtures -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $dstFixtures | Out-Null
              Copy-Item (Join-Path $srcFixtures '*') $dstFixtures -Recurse -Force
            }

            $watchRel = 'feed/betflag-open-close-watch.json'
            $watchSrc = Join-Path $workspace $watchRel
            if (Test-Path $watchSrc) {
              $watchDst = Join-Path $publishRoot $watchRel
              New-Item -ItemType Directory -Force -Path (Split-Path $watchDst -Parent) | Out-Null
              Copy-Item $watchSrc $watchDst -Force
            }

            Push-Location $publishRoot
            try {
              git config user.name "radar-betflag-residential-bot"
              git config user.email "radar-betflag-residential-bot@users.noreply.github.com"
              git add -A -- feed/betflag-residential-current.json feed/betflag-residential-movement.json feed/betflag-opening-field-diagnostics.json feed/betflag-standard-current.json feed/betflag-standard-movement.json feed/betflag-movement-index.json feed/betflag-residential-hot-feed.json feed/betflag-live-status.json feed/betflag-residential-fixtures-index.json feed/betflag-residential-fixtures feed/betflag-fixtures-index.json feed/betflag-fixtures
              if (Test-Path $watchRel) { git add $watchRel }

              git diff --cached --quiet
              if ($LASTEXITCODE -ne 0) {
                git commit -m "Publish BetFlag residential live snapshot"
                if ($LASTEXITCODE -ne 0) { throw 'Unable to create data-only BetFlag live snapshot commit' }
              }

              git push origin HEAD:refs/heads/betflag-live
              if ($LASTEXITCODE -ne 0) { throw 'Unable to publish dedicated betflag-live data branch' }
            }
            finally {
              Pop-Location
            }
          }
          finally {
            git worktree remove --force $publishRoot 2>$null
            git worktree prune
          }
