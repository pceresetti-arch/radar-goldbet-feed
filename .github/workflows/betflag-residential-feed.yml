name: BetFlag residential feed

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'betflag-residential-trigger.json'

permissions:
  contents: write

concurrency:
  group: betflag-residential-feed
  cancel-in-progress: true

jobs:
  collect:
    runs-on: [self-hosted, windows, betflag-residential]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect BetFlag player markets
        shell: powershell
        run: |
          python collector/betflag_residential_collector.py
      - name: Update player movement history
        shell: powershell
        run: |
          python collector/betflag_residential_movement.py
      - name: Collect BetFlag standard markets
        shell: powershell
        run: |
          python collector/betflag_standard_market_collector.py
      - name: Update standard-market movement
        shell: powershell
        run: |
          python collector/betflag_standard_movement.py
      - name: Import local open-close watcher state
        shell: powershell
        run: |
          $src = 'C:\BetFlagRadar\state\betflag-open-close-watch.json'
          if (Test-Path $src) {
            Copy-Item $src 'feed\betflag-open-close-watch.json' -Force
            Write-Host 'Imported local BetFlag open-close watcher state.'
          } else {
            Write-Host 'Local open-close watcher not installed yet; production feed continues without it.'
          }
      - name: Commit fresh production feeds
        shell: powershell
        run: |
          git config user.name "radar-betflag-residential-bot"
          git config user.email "radar-betflag-residential-bot@users.noreply.github.com"
          git add feed/betflag-residential-current.json feed/betflag-residential-history feed/betflag-residential-movement.json feed/betflag-opening-field-diagnostics.json feed/betflag-standard-current.json feed/betflag-standard-movement.json feed/betflag-movement-index.json
          if (Test-Path 'feed\betflag-open-close-watch.json') { git add feed/betflag-open-close-watch.json }
          if (-not (git diff --cached --quiet)) {
            git commit -m "Refresh residential BetFlag production feeds"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
