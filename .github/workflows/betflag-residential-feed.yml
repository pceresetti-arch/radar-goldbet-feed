name: BetFlag residential feed

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'betflag-residential-trigger.json'

permissions:
  contents: write

concurrency:
  group: betflag-residential-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, windows, betflag-residential]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure browser-session recovery client
        shell: powershell
        run: python -m pip install --disable-pip-version-check playwright
      - name: Ensure local true-open close watcher
        shell: powershell
        run: |
          $root = 'C:\BetFlagRadar'
          $state = Join-Path $root 'state'
          $script = Join-Path $root 'betflag_true_open_close_watcher.py'
          New-Item -ItemType Directory -Force -Path $root,$state | Out-Null
          Copy-Item 'collector\betflag_true_open_close_watcher.py' $script -Force
          Copy-Item 'collector\betflag_session_transport.py' (Join-Path $root 'betflag_session_transport.py') -Force
          $taskName = 'BetFlag True Open Close Watcher'
          $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if (-not $task) {
            $python = (Get-Command python.exe -ErrorAction Stop).Source
            $action = New-ScheduledTaskAction -Execute $python -Argument ('"' + $script + '" --window-seconds 50 --interval 20')
            $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(20) -RepetitionInterval (New-TimeSpan -Minutes 1)
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -ExecutionTimeLimit (New-TimeSpan -Minutes 2)
            Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Settings $settings -RunLevel Highest -Description 'BetFlag residential watcher: open, movement and last pre-kickoff close.' | Out-Null
          }
          if (-not (Test-Path (Join-Path $state 'betflag-open-close-watch.json'))) { Start-ScheduledTask -TaskName $taskName }
      - name: Collect BetFlag player markets
        shell: powershell
        run: python collector/betflag_residential_collector.py
      - name: Update player movement history
        shell: powershell
        run: python collector/betflag_residential_movement.py
      - name: Collect BetFlag standard markets
        shell: powershell
        run: python collector/betflag_standard_market_collector.py
      - name: Update standard-market movement
        shell: powershell
        run: python collector/betflag_standard_movement.py
      - name: Build compact fixture hot feed
        shell: powershell
        run: python collector/betflag_hot_feed.py
      - name: Import local open-close watcher state
        shell: powershell
        run: |
          $src = 'C:\BetFlagRadar\state\betflag-open-close-watch.json'
          if (Test-Path $src) { Copy-Item $src 'feed\betflag-open-close-watch.json' -Force }
      - name: Commit fresh production feeds
        shell: powershell
        run: |
          git config user.name "radar-betflag-residential-bot"
          git config user.email "radar-betflag-residential-bot@users.noreply.github.com"

          git rebase --abort 2>$null
          if (Test-Path '.git\rebase-merge') { Remove-Item '.git\rebase-merge' -Recurse -Force }
          if (Test-Path '.git\rebase-apply') { Remove-Item '.git\rebase-apply' -Recurse -Force }

          git add feed/betflag-residential-current.json feed/betflag-residential-history feed/betflag-residential-movement.json feed/betflag-opening-field-diagnostics.json feed/betflag-standard-current.json feed/betflag-standard-movement.json feed/betflag-movement-index.json feed/betflag-hot-feed.json
          if (Test-Path 'feed\betflag-fixtures-index.json') { git add feed/betflag-fixtures-index.json }
          if (Test-Path 'feed\betflag-fixtures') { git add feed/betflag-fixtures }
          if (Test-Path 'feed\betflag-open-close-watch.json') { git add feed/betflag-open-close-watch.json }
          if (-not (git diff --cached --quiet)) {
            git commit -m "Refresh residential BetFlag production feeds"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
