name: Cloudflare runtime diagnostic

on:
  push:
    paths:
      - '.github/workflows/cloudflare-runtime-diagnostic.yml'
      - 'cloudflare-runtime-diagnostic-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5

      - name: Inspect Cloudflare Worker runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p feed
          npx --yes wrangler@4 deployments status --name radar-goldbet --json > feed/cloudflare-deployment-current.json
          npx --yes wrangler@4 versions list --name radar-goldbet --json > feed/cloudflare-versions-current.json
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.error
          from datetime import datetime, timezone

          deployments=json.loads(pathlib.Path('feed/cloudflare-deployment-current.json').read_text(encoding='utf-8'))
          versions=json.loads(pathlib.Path('feed/cloudflare-versions-current.json').read_text(encoding='utf-8'))
          try:
              with urllib.request.urlopen(
                  urllib.request.Request(
                      'https://radar-goldbet.p-ceresetti.workers.dev/health',
                      headers={'Accept':'application/json','User-Agent':'RadarCloudflareDiagnostic/2.0'}
                  ), timeout=30
              ) as r:
                  text=r.read().decode('utf-8','replace')
                  status=r.status
          except urllib.error.HTTPError as e:
              text=e.read().decode('utf-8','replace')
              status=e.code
          try:
              body=json.loads(text)
          except Exception:
              body={'raw':text[:2000]}

          out={
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'deployment_status':deployments,
              'recent_versions':versions,
              'public_health_status':status,
              'public_health_body':body
          }
          pathlib.Path('feed/cloudflare-runtime-diagnostic.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2), encoding='utf-8'
          )
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Commit diagnostic
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/cloudflare-deployment-current.json feed/cloudflare-versions-current.json feed/cloudflare-runtime-diagnostic.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Record Cloudflare runtime diagnostic'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
