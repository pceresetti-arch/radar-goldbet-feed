name: Cloudflare runtime diagnostic

on:
  push:
    paths:
      - '.github/workflows/cloudflare-runtime-diagnostic.yml'
      - 'cloudflare-runtime-diagnostic-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5

      - name: Inspect Cloudflare Worker runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p feed
          npx --yes wrangler@4 deployments status --name radar-goldbet --json > feed/cloudflare-deployment-current.json
          npx --yes wrangler@4 versions list --name radar-goldbet --json > feed/cloudflare-versions-current.json
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/radar-goldbet/content" \
            -o /tmp/radar-goldbet-live-script.bin
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request, urllib.error
          from datetime import datetime, timezone

          raw=pathlib.Path('/tmp/radar-goldbet-live-script.bin').read_bytes()
          try:
              with urllib.request.urlopen(
                  urllib.request.Request(
                      'https://radar-goldbet.p-ceresetti.workers.dev/health',
                      headers={'Accept':'application/json','User-Agent':'RadarCloudflareDiagnostic/1.0'}
                  ), timeout=30
              ) as r:
                  text=r.read().decode('utf-8','replace')
                  status=r.status
          except urllib.error.HTTPError as e:
              text=e.read().decode('utf-8','replace')
              status=e.code
          try:
              body=json.loads(text)
          except Exception:
              body={'raw':text[:2000]}
          out={
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'script_bytes':len(raw),
              'script_sha256':hashlib.sha256(raw).hexdigest(),
              'script_contains_v7_marker':b'7.0-betflag-operational' in raw,
              'script_contains_player_price_marker':b'/live/player-price' in raw,
              'script_contains_old_bridge_marker':b'Radar Unico GoldBet Bridge' in raw,
              'public_health_status':status,
              'public_health_body':body
          }
          pathlib.Path('feed/cloudflare-runtime-diagnostic.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2), encoding='utf-8'
          )
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Commit diagnostic
        shell: bash
        run: |
          set -e
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/cloudflare-deployment-current.json feed/cloudflare-versions-current.json feed/cloudflare-runtime-diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Cloudflare runtime diagnostic'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
