name: Historical Backtest Germany 2 Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/historical-backtest-germany2-bootstrap.yml'
      - 'tools/historical_ingest_germany2.py'
      - 'tools/historical_build_germany2_baseline.py'
      - 'tools/historical_model_germany2_structural.py'

permissions:
  contents: write

concurrency:
  group: historical-backtest-germany2-bootstrap
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and profile Germany 2 historical source
        run: python tools/historical_ingest_germany2.py
      - name: Build frozen Germany 2 baseline
        run: python tools/historical_build_germany2_baseline.py
      - name: Build Germany 2 structural OOS model
        run: python tools/historical_model_germany2_structural.py
      - name: Preserve generated evidence
        run: |
          rm -rf /tmp/germany2-history
          cp -R feed/historical/germany2 /tmp/germany2-history
      - name: Commit historical discovery evidence
        run: |
          git config user.name "radar-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf feed/historical/germany2
            mkdir -p feed/historical
            cp -R /tmp/germany2-history feed/historical/germany2
            git add feed/historical/germany2
            if git diff --cached --quiet; then
              echo "No discovery changes"
              exit 0
            fi
            git commit -m "Update Germany 2 historical source discovery"
            if git push; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
