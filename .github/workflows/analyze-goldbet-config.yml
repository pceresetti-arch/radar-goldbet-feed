name: Analyze GoldBet config endpoints

on:
  push:
    paths:
      - 'goldbet-config-analysis-trigger.json'
      - '.github/workflows/analyze-goldbet-config.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract endpoint-like config values
        shell: bash
        run: |
          python - <<'PY'
          import json,re,pathlib,urllib.parse
          p=pathlib.Path('feed/goldbet-public-scommesseconfig.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          rows=[]
          urls=[]
          keywords=('api','url','host','service','endpoint','aams','player','gioc','marcat','sport','pregame','base','path')
          def walk(v,path=''):
              if isinstance(v,dict):
                  for k,x in v.items():
                      kp=f'{path}.{k}' if path else str(k)
                      lk=str(k).lower()
                      if any(w in lk for w in keywords):
                          rows.append({'path':kp,'value':x if isinstance(x,(str,int,float,bool)) or x is None else f'<{type(x).__name__}>'})
                      walk(x,kp)
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,f'{path}[{i}]')
              elif isinstance(v,str):
                  for u in re.findall(r'https?://[^\s"\'<>]+',v):
                      urls.append({'path':path,'url':u,'host':urllib.parse.urlparse(u).netloc})
                  lv=v.lower()
                  if any(w in lv for w in ('/api/','aams','player','giocatori','marcatori','pregame','sportservice')):
                      rows.append({'path':path,'value':v})
          walk(data)
          def uniq(items,key):
              out=[]; seen=set()
              for x in items:
                  k=key(x)
                  if k not in seen: seen.add(k); out.append(x)
              return out
          rows=uniq(rows,lambda x:(x['path'],str(x['value'])))
          urls=uniq(urls,lambda x:(x['path'],x['url']))
          hosts=sorted(set(x['host'] for x in urls if x['host']))
          out={'source':str(p),'hosts':hosts,'urls':urls,'endpoint_like_values':rows}
          pathlib.Path('feed/goldbet-config-url-map.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('hosts',hosts)
          print('rows',len(rows),'urls',len(urls))
          PY
      - name: Commit map
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/goldbet-config-url-map.json
          git diff --cached --quiet && exit 0
          git commit -m 'Map GoldBet config API endpoints'
          git push
