name: Certify shared AAMS prices vs GoldBet

# Temporarily removed the recurring schedule because upstream failures were
# generating repeated GitHub Actions failure emails. Keep this diagnostic
# available on demand; it can be re-enabled after the upstream path is stable.
on:
  workflow_dispatch:
  push:
    paths:
      - 'certify-shared-goldbet-trigger.json'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Diagnostic placeholder
        run: |
          echo "Shared AAMS vs GoldBet certification is manual-only while upstream access is unstable."
          echo "No scheduled failure email will be generated by this workflow."
