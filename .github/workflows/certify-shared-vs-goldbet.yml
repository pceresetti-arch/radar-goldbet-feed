name: Certify shared AAMS prices vs GoldBet

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths:
      - 'certify-shared-goldbet-trigger.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-goldbet-certification
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare simultaneous BetFlag/AAMS and GoldBet snapshots
        env:
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, difflib, json, math, os, pathlib, re, statistics, unicodedata, urllib.parse, urllib.request
          from datetime import datetime, timezone

          token=os.environ.get('BRIDGE_TOKEN','').strip()
          if not token:
            raise SystemExit('Missing BRIDGE_TOKEN')
          now=datetime.now(timezone.utc)
          generated=now.isoformat()

          def norm(s):
            s=unicodedata.normalize('NFKD',str(s or '')).encode('ascii','ignore').decode().lower()
            repl={
              'ac milan':'milan','fc internazionale':'inter','internazionale':'inter',
              'venezia fc':'venezia','juventus fc':'juventus','ssc napoli':'napoli',
              'as roma':'roma','ss lazio':'lazio','acf fiorentina':'fiorentina',
              'us sassuolo':'sassuolo','torino fc':'torino','udinese calcio':'udinese',
              'hellas verona':'verona','parma calcio':'parma','cagliari calcio':'cagliari',
              'atalanta bc':'atalanta','bologna fc':'bologna','como 1907':'como',
              'pisa sc':'pisa','us cremonese':'cremonese','us lecce':'lecce',
              'bayern munich':'bayern monaco','stuttgart':'stoccarda','barcelona':'barcellona'
            }
            for a,b in repl.items():
              s=s.replace(a,b)
            return ' '.join(re.findall(r'[a-z0-9]+',s))

          def percentile(vals,p):
            if not vals:
              return None
            a=sorted(vals)
            if len(a)==1:
              return a[0]
            k=(len(a)-1)*p
            lo=math.floor(k); hi=math.ceil(k)
            if lo==hi:
              return a[lo]
            return a[lo]*(hi-k)+a[hi]*(k-lo)

          # 1) BetFlag/shared sportservice snapshot.
          H={
            'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*',
            'x-api-version':'1.0','X-Auth-Token':'','X-Brand':'3','X-IdCanale':'0',
            'Origin':'https://www.betflag.it','Referer':'https://www.betflag.it/'
          }
          surl='https://sportservice.betflag.it/api/sport/pregame/getOverviewDefault/1?channelId=0'
          with urllib.request.urlopen(urllib.request.Request(surl,headers=H),timeout=30) as r:
            shared=json.loads(r.read(12000000).decode('utf-8','replace'))

          shared_events=[]
          def walk(x):
            if isinstance(x,dict):
              if x.get('si')==1 and x.get('ei') and x.get('en') and x.get('ed'):
                prices=None
                mm=x.get('mmkW') or {}
                vals=mm.values() if isinstance(mm,dict) else (mm if isinstance(mm,list) else [])
                for m in vals:
                  if not isinstance(m,dict) or str(m.get('mn','')).strip().upper()!='1X2':
                    continue
                  sp=m.get('spd') or {}
                  spreads=sp.values() if isinstance(sp,dict) else (sp if isinstance(sp,list) else [])
                  for z in spreads:
                    if not isinstance(z,dict):
                      continue
                    q={str(q.get('sn')):q.get('ov') for q in (z.get('asl') or []) if isinstance(q,dict)}
                    if all(k in q for k in ('1','X','2')):
                      try:
                        prices=[float(q['1']),float(q['X']),float(q['2'])]
                      except Exception:
                        prices=None
                if prices:
                  shared_events.append({
                    'event_id':x.get('ei'),'name':x.get('en'),'norm':norm(x.get('en')),
                    'date':x.get('ed'),'league':x.get('td'),'prices':prices
                  })
              for v in x.values():
                walk(v)
            elif isinstance(x,list):
              for v in x:
                walk(v)
          walk(shared)
          shared_events=list({str(e['event_id']):e for e in shared_events}.values())

          # 2) GoldBet direct snapshot, all bridge pages concurrently.
          base='https://radar-goldbet.p-ceresetti.workers.dev/odds'
          offsets=list(range(0,22000,2000))
          def page(off):
            qs=urllib.parse.urlencode({
              'token':token,'bookmakers':'goldbet','state':'prematch',
              'limit':'2000','offset':str(off)
            })
            req=urllib.request.Request(base+'?'+qs,headers={
              'Accept':'application/json','User-Agent':'RadarPriceCert/2.0'
            })
            try:
              with urllib.request.urlopen(req,timeout=75) as r:
                d=json.loads(r.read().decode('utf-8','replace'))
                return {'offset':off,'count':d.get('count'),'rows':d.get('odds') or [],'error':None}
            except Exception as e:
              return {'offset':off,'count':None,'rows':[],'error':type(e).__name__+': '+str(e)[:200]}

          with concurrent.futures.ThreadPoolExecutor(max_workers=11) as ex:
            pages=list(ex.map(page,offsets))
          total=max([p.get('count') or 0 for p in pages] or [0])
          rows=[]
          for p in pages:
            if p['offset']<total or total==0:
              rows.extend(p['rows'])

          gold=[]
          for r in rows:
            if not isinstance(r,dict) or str(r.get('market','')).lower()!='1x2':
              continue
            bms=r.get('bookmakers') or []
            bm=None
            if isinstance(bms,list):
              for b in bms:
                if isinstance(b,dict) and str(b.get('key','')).lower()=='goldbet':
                  bm=b; break
            elif isinstance(bms,dict):
              bm=bms.get('goldbet') or bms
            if not isinstance(bm,dict):
              continue
            o=bm.get('outcomes') or {}
            if not all(k in o for k in ('HOME','DRAW','AWAY')):
              continue
            try:
              prices=[float(o['HOME']),float(o['DRAW']),float(o['AWAY'])]
            except Exception:
              continue
            name=r.get('event') or f"{r.get('home_team','')} - {r.get('away_team','')}"
            gold.append({
              'event_id':r.get('event_id'),'name':name,'norm':norm(name),
              'commence_time':r.get('commence_time'),'league':r.get('league'),
              'prices':prices,'last_update':bm.get('last_update')
            })

          # 3) High-confidence fixture matching.
          comparisons=[]
          used_gold=set()
          for s in shared_events:
            best=None
            for gi,g in enumerate(gold):
              score=difflib.SequenceMatcher(None,s['norm'],g['norm']).ratio()
              st=set(s['norm'].split()); gt=set(g['norm'].split())
              jac=len(st&gt)/max(1,len(st|gt))
              combined=.65*score+.35*jac
              if best is None or combined>best[0]:
                best=(combined,score,jac,gi,g)
            if not best:
              continue
            combined,score,jac,gi,g=best
            if combined<0.78 or gi in used_gold:
              continue
            used_gold.add(gi)
            diffs=[round(float(a)-float(b),4) for a,b in zip(s['prices'],g['prices'])]
            abs_diffs=[abs(d) for d in diffs]
            comparisons.append({
              'shared_name':s['name'],'goldbet_name':g['name'],
              'match_score':round(combined,4),
              'shared_prices':s['prices'],'goldbet_prices':g['prices'],
              'exact_all':all(d<1e-9 for d in abs_diffs),
              'diffs':diffs,'abs_diffs':abs_diffs,
              'goldbet_last_update':g['last_update'],
              'shared_date':s['date'],'goldbet_time':g['commence_time']
            })

          comparisons.sort(key=lambda x:(x['exact_all'],x['match_score']),reverse=True)
          all_abs=[d for x in comparisons for d in x['abs_diffs']]
          selection_count=len(all_abs)
          exact_selection_count=sum(1 for d in all_abs if d<1e-9)
          near_5c_selection_count=sum(1 for d in all_abs if d<=0.05+1e-9)
          exact_count=sum(1 for x in comparisons if x['exact_all'])
          near_count=sum(1 for x in comparisons if max(x['abs_diffs'])<=0.05+1e-9)

          exact_triplet_rate=(exact_count/len(comparisons)) if comparisons else 0.0
          exact_selection_rate=(exact_selection_count/selection_count) if selection_count else 0.0
          near_5c_selection_rate=(near_5c_selection_count/selection_count) if selection_count else 0.0
          mean_abs_diff=statistics.mean(all_abs) if all_abs else None
          p95_abs_diff=percentile(all_abs,.95)
          max_abs_diff=max(all_abs) if all_abs else None

          verdict='UNPROVEN'
          if len(comparisons)>=8 and exact_triplet_rate>=.70 and (p95_abs_diff is not None and p95_abs_diff<=.05):
            verdict='STRONG_EXACT_MATCH'
          elif len(comparisons)>=8 and near_5c_selection_rate>=.95 and (p95_abs_diff is not None and p95_abs_diff<=.05):
            verdict='STRONG_NEAR_MATCH'
          elif len(comparisons)>=5 and near_5c_selection_rate>=.90:
            verdict='NEAR_MATCH_ONLY'
          elif comparisons:
            verdict='DIVERGENT_OR_INSUFFICIENT'

          proxy_allowed=(
            verdict in ('STRONG_EXACT_MATCH','STRONG_NEAR_MATCH')
            and len(comparisons)>=8
            and (p95_abs_diff is not None and p95_abs_diff<=.05)
          )

          policy={
            'generated_at':generated,
            'source_class':'GOLDBET_ALIGNED_PROXY',
            'goldbet_direct':False,
            'evidence_scope':'SIMULTANEOUS_STANDARD_1X2_CROSSBRAND',
            'proxy_player_gate_allowed':proxy_allowed,
            'verdict':verdict,
            'stale_after_minutes':45,
            'strong_buffer_pct':0.03,
            'strong_buffer_abs':0.05,
            'strong_proxy_gate_formula':'max(final_gate * 1.03, final_gate + 0.05)',
            'near_only_automatic_bet_allowed':False,
            'near_only_watch_buffer_pct':0.05,
            'near_only_watch_buffer_abs':0.10,
            'matched_fixture_count':len(comparisons),
            'exact_triplet_rate':round(exact_triplet_rate,6),
            'exact_selection_rate':round(exact_selection_rate,6),
            'near_5c_selection_rate':round(near_5c_selection_rate,6),
            'mean_abs_diff':round(mean_abs_diff,6) if mean_abs_diff is not None else None,
            'p95_abs_diff':round(p95_abs_diff,6) if p95_abs_diff is not None else None,
            'max_abs_diff':round(max_abs_diff,6) if max_abs_diff is not None else None,
            'caveat':'Cross-brand standard-market evidence supports a conservative player-price proxy; it does not prove player-by-player price identity. Direct GoldBet player price prevails whenever available.'
          }

          out={
            'generated_at':generated,
            'shared_event_count':len(shared_events),
            'goldbet_1x2_count':len(gold),
            'bridge_total_count':total,
            'page_status':[{'offset':p['offset'],'rows':len(p['rows']),'error':p['error']} for p in pages],
            'matched_count':len(comparisons),
            'exact_count':exact_count,
            'near_5c_count':near_count,
            'selection_count':selection_count,
            'exact_selection_count':exact_selection_count,
            'near_5c_selection_count':near_5c_selection_count,
            'exact_triplet_rate':round(exact_triplet_rate,6),
            'exact_selection_rate':round(exact_selection_rate,6),
            'near_5c_selection_rate':round(near_5c_selection_rate,6),
            'mean_abs_diff':round(mean_abs_diff,6) if mean_abs_diff is not None else None,
            'p95_abs_diff':round(p95_abs_diff,6) if p95_abs_diff is not None else None,
            'max_abs_diff':round(max_abs_diff,6) if max_abs_diff is not None else None,
            'verdict':verdict,
            'proxy_policy':policy,
            'comparisons':comparisons[:60]
          }

          feed=pathlib.Path('feed'); feed.mkdir(exist_ok=True)
          (feed/'shared-goldbet-price-certification.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          (feed/'shared-goldbet-proxy-policy.json').write_text(json.dumps(policy,ensure_ascii=False,indent=2),encoding='utf-8')

          history_path=feed/'shared-goldbet-price-certification-history.json'
          try:
            history=json.loads(history_path.read_text(encoding='utf-8')) if history_path.exists() else []
            if not isinstance(history,list): history=[]
          except Exception:
            history=[]
          history.append({
            'generated_at':generated,'matched_count':len(comparisons),'exact_count':exact_count,
            'exact_triplet_rate':round(exact_triplet_rate,6),
            'exact_selection_rate':round(exact_selection_rate,6),
            'near_5c_selection_rate':round(near_5c_selection_rate,6),
            'mean_abs_diff':round(mean_abs_diff,6) if mean_abs_diff is not None else None,
            'p95_abs_diff':round(p95_abs_diff,6) if p95_abs_diff is not None else None,
            'max_abs_diff':round(max_abs_diff,6) if max_abs_diff is not None else None,
            'verdict':verdict,'proxy_player_gate_allowed':proxy_allowed
          })
          history=history[-192:]
          history_path.write_text(json.dumps(history,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'policy':policy,'sample':comparisons[:10]},ensure_ascii=False,indent=2)[:50000])
          PY

      - name: Commit calibration and proxy policy
        run: |
          git config user.name 'radar-goldbet-bot'
          git config user.email 'radar-goldbet-bot@users.noreply.github.com'
          git add feed/shared-goldbet-price-certification.json feed/shared-goldbet-proxy-policy.json feed/shared-goldbet-price-certification-history.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh BetFlag-GoldBet proxy calibration'
          git pull --rebase origin main
          git push
